name: Patch 2F ABS teacher warning

on:
  push:
    paths:
      - .sprint-2f-abs-teacher-warning-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Apply modal and request de-duplication fix
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          index_path = root / 'apps-script' / 'index.html'
          index = index_path.read_text(encoding='utf-8')

          old_vars = '''      let callbackKonfirmasiGlobal = null;\n\n      let editGuruRow = null;'''
          new_vars = '''      let callbackKonfirmasiGlobal = null;\n\n      let attendanceCalendarRequestId = 0;\n\n      let editGuruRow = null;'''
          if old_vars not in index:
              raise SystemExit('PATCH FAILED: global variable anchor not found')
          index = index.replace(old_vars, new_vars, 1)

          old_modal = '''      function showConfirmModal(\n        judul,\n        pesan,\n        callback\n      ) {\n\n        callbackKonfirmasiGlobal =\n          callback;\n\n        document\n          .getElementById(\n            "judulKonfirmasiGlobal"\n          )\n          .innerText = judul;\n\n        document\n          .getElementById(\n            "pesanKonfirmasiGlobal"\n          )\n          .innerText = pesan;\n\n        const modal =\n          new bootstrap.Modal(\n\n            document.getElementById(\n              "modalKonfirmasiGlobal"\n            )\n\n          );\n\n        modal.show();\n\n        document\n          .getElementById(\n            "btnYaKonfirmasiGlobal"\n          )\n          .onclick = function () {\n\n            modal.hide();\n\n            setTimeout(function () {\n\n              if (callbackKonfirmasiGlobal) {\n\n                callbackKonfirmasiGlobal();\n\n              }\n\n            }, 200);\n\n          };\n\n      }'''

          new_modal = '''      function showConfirmModal(\n        judul,\n        pesan,\n        callback\n      ) {\n\n        const modalElement =\n          document.getElementById(\n            "modalKonfirmasiGlobal"\n          );\n\n        if (!modalElement) {\n          return;\n        }\n\n        callbackKonfirmasiGlobal =\n          callback;\n\n        document\n          .getElementById(\n            "judulKonfirmasiGlobal"\n          )\n          .innerText = judul;\n\n        document\n          .getElementById(\n            "pesanKonfirmasiGlobal"\n          )\n          .innerText = pesan;\n\n        const modal =\n          bootstrap.Modal.getOrCreateInstance(\n            modalElement\n          );\n\n        const btnYa =\n          document.getElementById(\n            "btnYaKonfirmasiGlobal"\n          );\n\n        btnYa.onclick = function () {\n\n          const callbackSaatIni =\n            callbackKonfirmasiGlobal;\n\n          callbackKonfirmasiGlobal = null;\n\n          modalElement.addEventListener(\n            "hidden.bs.modal",\n            function () {\n\n              if (\n                typeof callbackSaatIni ===\n                "function"\n              ) {\n                callbackSaatIni();\n              }\n\n            },\n            { once: true }\n          );\n\n          modal.hide();\n\n        };\n\n        modal.show();\n\n      }'''
          if old_modal not in index:
              raise SystemExit('PATCH FAILED: showConfirmModal block not found')
          index = index.replace(old_modal, new_modal, 1)

          old_load = '''      function loadExistingAttendance() {\n\n        const kelas ='''
          new_load = '''      function loadExistingAttendance() {\n\n        const requestId =\n          ++attendanceCalendarRequestId;\n\n        const kelas ='''
          if old_load not in index:
              raise SystemExit('PATCH FAILED: loadExistingAttendance anchor not found')
          index = index.replace(old_load, new_load, 1)

          old_success = '''          .withSuccessHandler(function (context) {\n\n            if (\n              context &&\n              context.shouldWarn\n            ) {'''
          new_success = '''          .withSuccessHandler(function (context) {\n\n            if (\n              requestId !==\n              attendanceCalendarRequestId\n            ) {\n              return;\n            }\n\n            if (\n              context &&\n              context.shouldWarn\n            ) {'''
          if old_success not in index:
              raise SystemExit('PATCH FAILED: attendance calendar success handler anchor not found')
          index = index.replace(old_success, new_success, 1)

          old_warning = '''              showConfirmModal(\n                "Hari Libur Sekolah",\n                pesan,\n                function () {\n                  loadExistingAttendanceCore();\n                }\n              );'''
          new_warning = '''              const judulPeringatan =\n                context.warningType === "teacher_schedule"\n                  ? "Periksa Jadwal Mengajar"\n                  : "Hari Libur Sekolah";\n\n              const modalElement =\n                document.getElementById(\n                  "modalKonfirmasiGlobal"\n                );\n\n              if (\n                modalElement &&\n                modalElement.classList.contains("show")\n              ) {\n                return;\n              }\n\n              showConfirmModal(\n                judulPeringatan,\n                pesan,\n                function () {\n                  loadExistingAttendanceCore();\n                }\n              );'''
          if old_warning not in index:
              raise SystemExit('PATCH FAILED: warning modal call block not found')
          index = index.replace(old_warning, new_warning, 1)

          index_path.write_text(index, encoding='utf-8')

          # Structural assertions.
          index = index_path.read_text(encoding='utf-8')
          assert 'let attendanceCalendarRequestId = 0;' in index
          assert 'bootstrap.Modal.getOrCreateInstance(' in index
          assert '{ once: true }' in index
          assert 'requestId !==' in index
          assert 'context.warningType === "teacher_schedule"' in index
          assert 'modalElement.classList.contains("show")' in index

          # Remove trigger and this temporary workflow after the patch is committed.
          trigger = root / '.sprint-2f-abs-teacher-warning-trigger'
          if trigger.exists():
              trigger.unlink()
          workflow = root / '.github' / 'workflows' / 'patch-2f-abs-teacher-warning.yml'

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/index.html .sprint-2f-abs-teacher-warning-trigger
          git rm -f .github/workflows/patch-2f-abs-teacher-warning.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent duplicate attendance warning modal"
          git push
