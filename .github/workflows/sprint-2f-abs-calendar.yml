name: Sprint 2F ABS Calendar Fix

on:
  push:
    paths:
      - .sprint-2f-abs-calendar-trigger

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'mitanbihulathfal' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize frontend weekday
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('apps-script/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'      function updateHariAbsensi\(\) \{.*?\n      \}\n\n      function setStatusAbsen', re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('updateHariAbsensi block not found')
          new = '''      function updateHariAbsensi() {\n\n        const tanggal =\n          document\n            .getElementById(\n              'tanggalAbsensi'\n            )\n            .value;\n\n        if (!tanggal) {\n          return;\n        }\n\n        const hariLocale =\n          new Intl.DateTimeFormat(\n            'id-ID',\n            { weekday: 'long' }\n          ).format(\n            new Date(tanggal)\n          );\n\n        const hari =\n          hariLocale === 'Minggu'\n            ? 'Ahad'\n            : hariLocale;\n\n        document\n          .getElementById(\n            'hariAbsensi'\n          )\n          .value = hari;\n\n      }\n\n      function setStatusAbsen'''
          s = s[:m.start()] + new + s[m.end():]
          p.write_text(s, encoding='utf-8')
          assert 'const hariList = [' not in s
          assert "new Intl.DateTimeFormat(" in s
          assert "hariLocale === 'Minggu'" in s
          t = Path('.sprint-2f-abs-calendar-trigger')
          if t.exists(): t.unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use locale weekday for attendance UI"
          git push
