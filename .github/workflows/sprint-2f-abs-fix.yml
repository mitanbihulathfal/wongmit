name: Sprint 2F ABS Fix

on:
  push:
    paths:
      - .sprint-2f-abs-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'mitanbihulathfal' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix signature
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps-script/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function initAbsensiTanggal( {'
          new = 'function initAbsensiTanggal() {'
          if old not in s:
              raise SystemExit('broken signature not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          assert 'function initAbsensiTanggal() {' in s
          assert 'function initAbsensiTanggal( {' not in s
          t = Path('.sprint-2f-abs-fix-trigger')
          if t.exists(): t.unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair attendance function signature"
          git push
