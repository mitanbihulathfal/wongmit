name: Sprint 2F ABS Patch

on:
  push:
    paths:
      - .sprint-2f-abs-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'mitanbihulathfal' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch Sprint 2F ABS
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          code_path = root / 'apps-script' / 'Code.js'
          code = code_path.read_text(encoding='utf-8')

          old = '''function isSchoolHoliday(date) {\n\n  if (!date) {\n    return false;\n  }\n\n  const hariIndonesia = [\n    "Ahad",\n    "Senin",\n    "Selasa",\n    "Rabu",\n    "Kamis",\n    "Jumat",\n    "Sabtu"\n  ];\n\n  const hari =\n    hariIndonesia[\n      new Date(date).getDay()\n    ];\n\n  const hariLibur =\n    getWeeklyHolidays();\n\n  return hariLibur.some(function (libur) {\n\n    return String(libur).trim() === hari;\n\n  });\n\n}\n'''
          new = '''function isSchoolHoliday(date) {\n\n  if (!date) {\n    return false;\n  }\n\n  const hari =\n    getWeekDays()[\n      new Date(date).getDay()\n    ];\n\n  const hariLibur =\n    getWeeklyHolidays();\n\n  return hariLibur.some(function (libur) {\n\n    return String(libur).trim() === hari;\n\n  });\n\n}\n\n/* =========================\n   KONTEKS KALENDER ABSENSI\n========================= */\n\nfunction getAttendanceCalendarContext(\n  kelas,\n  tanggal\n) {\n\n  const hari =\n    getNamaHariIndonesia(tanggal);\n\n  const hariLibur =\n    isSchoolHoliday(tanggal);\n\n  const relasi =\n    getRelasiMengajarByHari(\n      kelas,\n      hari\n    );\n\n  return {\n\n    tanggal: tanggal,\n\n    hari: hari,\n\n    isSchoolHoliday: hariLibur,\n\n    hasFormalActivity: !!relasi,\n\n    shouldWarn:\n      hariLibur && !relasi,\n\n    formalActivity: relasi\n      ? {\n          idRelasi: relasi.idRelasi,\n          idGuru: relasi.idGuru,\n          mapel: relasi.mapel\n        }\n      : null\n\n  };\n\n}\n'''
          if old not in code:
              raise SystemExit('PATCH FAILED: isSchoolHoliday block not found')
          code = code.replace(old, new, 1)

          old2 = '''function getNamaHariIndonesia(\n\n  tanggal\n\n) {\n\n  const hari =\n\n    [\n\n      "Ahad",\n\n      "Senin",\n\n      "Selasa",\n\n      "Rabu",\n\n      "Kamis",\n\n      "Jumat",\n\n      "Sabtu"\n\n    ];\n\n  return hari[\n\n    new Date(\n      tanggal\n    ).getDay()\n\n  ];\n\n}\n'''
          new2 = '''function getNamaHariIndonesia(\n\n  tanggal\n\n) {\n\n  return getWeekDays()[\n\n    new Date(\n      tanggal\n    ).getDay()\n\n  ];\n\n}\n'''
          if old2 not in code:
              raise SystemExit('PATCH FAILED: getNamaHariIndonesia block not found')
          code = code.replace(old2, new2, 1)
          code_path.write_text(code, encoding='utf-8')

          p = root / 'apps-script' / 'index.html'
          text = p.read_text(encoding='utf-8')

          old_days = '''const hariList = [\n\n          "Ahad",\n          "Senin",\n          "Selasa",\n          "Rabu",\n          "Kamis",\n          "Jumat",\n          "Sabtu"\n\n        ];'''
          new_days = '''const hariList = [\n          "Ahad",\n          "Senin",\n          "Selasa",\n          "Rabu",\n          "Kamis",\n          "Jumat",\n          "Sabtu"\n        ];'''
          if old_days in text:
              text = text.replace(old_days, new_days, 1)

          pattern = re.compile(r'      function loadExistingAttendance\(\) \{.*?\n      \}\n\n      function initAbsensiTanggal\(\)', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('PATCH FAILED: loadExistingAttendance not found in index.html')

          new_block = '''      function loadExistingAttendance() {\n\n        const kelas =\n          document.getElementById(\n            "filterKelasAbsensi"\n          ).value;\n\n        const tanggal =\n          document.getElementById(\n            "tanggalAbsensi"\n          ).value;\n\n        if (!kelas || !tanggal) {\n\n          document\n            .getElementById(\n              "infoAbsenWaktu"\n            )\n            .innerHTML =\n            "--/--/---- --:--:--";\n\n          document\n            .getElementById(\n              "infoAbsenOleh"\n            )\n            .innerHTML =\n            "---";\n\n          return;\n\n        }\n\n        google.script.run\n          .withSuccessHandler(function (context) {\n\n            if (\n              context &&\n              context.shouldWarn\n            ) {\n\n              const pesan =\n                "Tanggal " +\n                tanggal +\n                " adalah hari libur sekolah (" +\n                context.hari +\n                ") dan belum ditemukan jadwal kegiatan formal untuk kelas " +\n                kelas +\n                ".\\n\\nApakah Anda tetap ingin melanjutkan absensi?";\n\n              showConfirmModal(\n                "Hari Libur Sekolah",\n                pesan,\n                function () {\n                  loadExistingAttendanceCore();\n                }\n              );\n\n              return;\n\n            }\n\n            loadExistingAttendanceCore();\n\n          })\n          .withFailureHandler(function (error) {\n\n            console.error(error);\n\n            showToast(\n              "Gagal memeriksa kalender sekolah. Silakan coba lagi.",\n              "error"\n            );\n\n          })\n          .getAttendanceCalendarContext(\n            kelas,\n            tanggal\n          );\n\n      }\n\n      function loadExistingAttendanceCore() {\n\n        const kelas =\n          document.getElementById(\n            "filterKelasAbsensi"\n          ).value;\n\n        const tanggal =\n          document.getElementById(\n            "tanggalAbsensi"\n          ).value;\n\n        if (!kelas || !tanggal) {\n          return;\n        }\n\n        google.script.run\n          .withSuccessHandler(function (result) {\n\n            result =\n              JSON.parse(result);\n\n            if (!result.info.ditemukan) {\n\n              modeAbsensi = "baru";\n\n              resetStatusAbsensi();\n              pulihkanDraftAbsensi();\n              modeEditAbsensi = false;\n\n              setSimpanAbsensiText(\n                '<i class="fa-solid fa-floppy-disk"></i> Simpan',\n                "btn-primary"\n              );\n\n              setSimpanAbsensiDisabled(false);\n              setHadirSemuaDisabled(false);\n\n              document.getElementById("infoAbsenWaktu").innerHTML =\n                "--/--/---- --:--:--";\n              document.getElementById("infoAbsenOleh").innerHTML =\n                "---";\n\n              return;\n\n            }\n\n            const waktuAbsen = new Date(result.info.timestamp);\n\n            const pad = function (angka) {\n              return String(angka).padStart(2, "0");\n            };\n\n            const waktuFormat =\n              pad(waktuAbsen.getDate()) + "/" +\n              pad(waktuAbsen.getMonth() + 1) + "/" +\n              waktuAbsen.getFullYear() + " " +\n              pad(waktuAbsen.getHours()) + ":" +\n              pad(waktuAbsen.getMinutes()) + ":" +\n              pad(waktuAbsen.getSeconds());\n\n            document.getElementById("infoAbsenWaktu").innerHTML =\n              waktuFormat;\n            document.getElementById("infoAbsenOleh").innerHTML =\n              result.info.inputOleh;\n\n            modeAbsensi = "revisi";\n            modeEditAbsensi = false;\n\n            setSimpanAbsensiText(\n              '<i class="fa-solid fa-pen"></i> Revisi Absen',\n              "btn-primary"\n            );\n            setSimpanAbsensiDisabled(false);\n            setHadirSemuaDisabled(true);\n\n            modeEditAbsensi = true;\n            result.data.forEach(function (item) {\n              setStatusAbsen(item.nisn, item.status);\n            });\n            modeEditAbsensi = false;\n\n          })\n          .withFailureHandler(function (error) {\n            console.error(error);\n            showToast(\n              "Gagal memuat data absensi.",\n              "error"\n            );\n          })\n          .getAttendanceByClassAndDate(\n            kelas,\n            tanggal\n          );\n\n      }\n\n      function initAbsensiTanggal('''

          text = text[:match.start()] + new_block + text[match.end():]
          p.write_text(text, encoding='utf-8')

          trigger = root / '.sprint-2f-abs-trigger'
          if trigger.exists():
              trigger.unlink()

          code = code_path.read_text(encoding='utf-8')
          assert 'function getAttendanceCalendarContext(' in code
          assert 'const hariIndonesia = [' not in code
          assert 'function getNamaHariIndonesia(' in code
          text = p.read_text(encoding='utf-8')
          assert 'function loadExistingAttendanceCore()' in text
          assert '.getAttendanceCalendarContext(' in text
          assert 'Hari Libur Sekolah' in text

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.js apps-script/index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add school holiday warning to attendance"
          git push
