name: WONG MIT P4-P6 Patch

on:
  push:
    paths:
      - '.github/workflows/wongmit-p4-p6-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch target master-data reads
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('apps-script/Code.js')
          text = path.read_text(encoding='utf-8')
          original = text

          targets = {
              'getWeeklyHolidays',
              'getAttendanceCalendarContext',
              'updateStudent',
              'deleteStudent',
              'deleteTeacher',
              'deleteClass',
              'checkLogin',
              'getGuruProfile',
              'getRoleBySession',
              'getStudentsByClass',
              'getKelasAbsensi',
              'getMapelOptions',
              'getMapelUsage',
              'downloadTemplateGuruMengajar',
              'downloadTemplateSiswa',
          }
          master_names = {'Siswa','Guru','Kelas','Mapel','GuruMengajar','Pengaturan'}

          def body_span(src, name):
              m = re.search(r'function\s+' + re.escape(name) + r'\s*\(', src)
              if not m:
                  raise RuntimeError(f'Function not found: {name}')
              brace = src.find('{', m.end())
              if brace < 0:
                  raise RuntimeError(f'Opening brace not found: {name}')
              depth = 0
              quote = None
              esc = False
              for i in range(brace, len(src)):
                  c = src[i]
                  if quote:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in "'\"`":
                      quote = c
                      continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return brace + 1, i
              raise RuntimeError(f'Unclosed function: {name}')

          def patch_function(src, name):
              start, end = body_span(src, name)
              body = src[start:end]

              # Discover local sheet variables and their Master Sheet names.
              vars_to_master = {}
              for m in re.finditer(
                  r'const\s+(\w+)\s*=\s*SS\.getSheetByName\(\s*[\"\']([^\"\']+)[\"\']\s*\)',
                  body
              ):
                  var, sheet = m.group(1), m.group(2)
                  if sheet in master_names:
                      vars_to_master[var] = sheet

              changed = False
              for var, sheet in vars_to_master.items():
                  pattern = re.compile(
                      r'\b' + re.escape(var) + r'\s*\.\s*getDataRange\(\)\s*\.\s*getValues\(\)'
                  )
                  body, n = pattern.subn(f'getMasterSheetData("{sheet}")', body)
                  changed |= n > 0

              # Remove now-unused Master sheet declarations only.
              for var, sheet in vars_to_master.items():
                  if not re.search(r'\b' + re.escape(var) + r'\b', body):
                      decl = re.compile(
                          r'\s*const\s+' + re.escape(var) + r'\s*=\s*SS\.getSheetByName\(\s*[\"\']' + re.escape(sheet) + r'[\"\']\s*\)\s*;?\s*'
                      )
                      body, n = decl.subn('\n', body, count=1)
                      changed |= n > 0

              if changed:
                  src = src[:start] + body + src[end:]
              return src, changed

          for name in targets:
              text, _ = patch_function(text, name)

          if text == original:
              raise RuntimeError('No target change was produced; aborting.')

          # Safety: P1/P2 function bodies must remain byte-for-byte identical.
          for protected in ('saveAttendance', 'reviseAttendance'):
              a, b = body_span(original, protected)
              c, d = body_span(text, protected)
              if original[a:b] != text[c:d]:
                  raise RuntimeError(f'Protected function changed: {protected}')

          path.write_text(text, encoding='utf-8', newline='\n')

          # Validate that no direct getDataRange().getValues() remains in target functions
          # when the corresponding sheet is a Master Sheet.
          remaining = []
          for name in targets:
              a, b = body_span(text, name)
              body = text[a:b]
              vars_to_master = {}
              for m in re.finditer(
                  r'const\s+(\w+)\s*=\s*SS\.getSheetByName\(\s*[\"\']([^\"\']+)[\"\']\s*\)',
                  body
              ):
                  if m.group(2) in master_names:
                      vars_to_master[m.group(1)] = m.group(2)
              for var, sheet in vars_to_master.items():
                  if re.search(r'\b' + re.escape(var) + r'\s*\.\s*getDataRange\(\)\s*\.\s*getValues\(\)', body):
                      remaining.append(f'{name}: {sheet}')

          if remaining:
              raise RuntimeError('Direct Master reads remain: ' + ', '.join(remaining))

          subprocess.run(['git','diff','--check'], check=True)

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wongmit-p4-p6-patch.yml
          git add apps-script/Code.js
          git diff --cached --check
          git commit -m "perf: complete P4-P6 master data reads"
          git push origin HEAD:main
