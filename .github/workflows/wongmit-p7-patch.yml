name: WONG MIT P7 Patch

on:
  push:
    paths:
      - '.github/workflows/wongmit-p7-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P7 async-state and Edit Siswa fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          INDEX = Path('apps-script/index.html')
          CODE = Path('apps-script/Code.js')
          SISWA = Path('apps-script/page_siswa.html')

          index = INDEX.read_text(encoding='utf-8')
          code = CODE.read_text(encoding='utf-8')
          siswa = SISWA.read_text(encoding='utf-8')

          def body_span(src, name):
              m = re.search(r'function\s+' + re.escape(name) + r'\s*\(', src)
              if not m:
                  raise RuntimeError(f'Function not found: {name}')
              brace = src.find('{', m.end())
              if brace < 0:
                  raise RuntimeError(f'Opening brace not found: {name}')
              depth = 0
              quote = None
              esc = False
              for i in range(brace, len(src)):
                  c = src[i]
                  if quote:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in "'\"`":
                      quote = c
                      continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return m.start(), i + 1
              raise RuntimeError(f'Unclosed function: {name}')

          def replace_function(src, name, replacement):
              a, b = body_span(src, name)
              return src[:a] + replacement.rstrip() + '\n' + src[b:]

          # ------------------------------------------------------------
          # P7-A/B — Absensi async request-state + modern loading state.
          # ------------------------------------------------------------
          helper = r'''/* =========================
   P7 — ABSENSI ASYNC REQUEST STATE
========================= */

function ensureAbsensiDataLoadingUI() {

  if (!document.getElementById("absensiDataLoadingStyle")) {

    const style = document.createElement("style");

    style.id = "absensiDataLoadingStyle";

    style.textContent = `
      .absensi-data-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 92px;
        margin: 14px 0;
        padding: 18px 20px;
        border: 1px solid #e6edf7;
        border-radius: 14px;
        background: linear-gradient(135deg, #f8fbff, #ffffff);
        color: #64748b;
        font-size: 14px;
        font-weight: 500;
      }
      .absensi-data-loading .spinner-ring {
        width: 24px;
        height: 24px;
        border: 3px solid #dbe7f7;
        border-top-color: #0b2d6b;
        border-radius: 50%;
        animation: absensiSpin .75s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes absensiSpin {
        to { transform: rotate(360deg); }
      }
    `;

    document.head.appendChild(style);

  }

}

function setAbsensiDataLoading(active, message) {

  ensureAbsensiDataLoadingUI();

  const tableBody =
    document.getElementById("tableAbsensi");

  const mobileContainer =
    document.getElementById("mobileAbsensiContainer");

  let loader =
    document.getElementById("absensiDataLoading");

  if (!loader && tableBody) {

    const tableCard =
      tableBody.closest(".card");

    loader = document.createElement("div");
    loader.id = "absensiDataLoading";
    loader.className = "absensi-data-loading";
    loader.setAttribute("aria-live", "polite");
    loader.setAttribute("aria-busy", "true");

    if (tableCard && tableCard.parentNode) {
      tableCard.parentNode.insertBefore(
        loader,
        tableCard
      );
    }

  }

  if (active) {

    if (tableBody) {
      tableBody.innerHTML = "";
    }

    if (mobileContainer) {
      mobileContainer.innerHTML = "";
      mobileContainer.classList.add("d-none");
    }

    if (loader) {
      loader.innerHTML =
        '<span class="spinner-ring"></span>' +
        '<span>' +
        (message || "Memuat data kelas...") +
        '</span>';
      loader.style.display = "flex";
    }

  } else if (loader) {

    loader.style.display = "none";
    loader.setAttribute("aria-busy", "false");

  }

}

function nextRekapFilterRequestId() {

  nextRekapFilterRequestId.value =
    (nextRekapFilterRequestId.value || 0) + 1;

  return nextRekapFilterRequestId.value;

}

'''

          if 'function ensureAbsensiDataLoadingUI()' not in index:
              marker = 'function loadStudentsByClass() {'
              pos = index.find(marker)
              if pos < 0:
                  raise RuntimeError('P7 insertion marker not found')
              index = index[:pos] + helper + index[pos:]

