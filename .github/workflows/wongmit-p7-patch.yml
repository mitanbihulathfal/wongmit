          new_load_kelas_guru = r'''function loadKelasGuruRekap(
  idGuru,
  selectedValue = "",
  selectedMapel = ""
) {

  const requestId =
    nextRekapFilterRequestId();

  const select =
    document.getElementById(
      "filterKelasRekap"
    );

  const mapelSelect =
    document.getElementById(
      "filterMapelRekap"
    );

  if (select) {
    select.disabled = true;
    select.innerHTML =
      '<option value="">Memuat kelas...</option>';
  }

  if (mapelSelect) {
    mapelSelect.disabled = true;
    mapelSelect.innerHTML =
      '<option value="">Menunggu kelas...</option>';
  }

  google.script.run
    .withSuccessHandler(function (result) {

      if (
        requestId !==
        nextRekapFilterRequestId.value
      ) {
        return;
      }

      const currentGuru =
        document.getElementById(
          "filterGuruRekap"
        ).value;

      if (
        String(currentGuru).trim() !==
        String(idGuru).trim()
      ) {
        return;
      }

      const data =
        JSON.parse(result);

      if (!select) {
        return;
      }

      select.innerHTML =
        '<option value="">Semua Kelas</option>';

      const daftarKelas = [];

      for (
        let i = 1;
        i < data.length;
        i++
      ) {

        const idGuruData =
          String(data[i][1]).trim();

        const kelas =
          String(data[i][3]).trim();

        const status =
          String(data[i][6]).trim();

        if (
          status &&
          status !== "Aktif"
        ) {
          continue;
        }

        if (
          idGuruData !==
          String(idGuru).trim()
        ) {
          continue;
        }

        if (
          daftarKelas.includes(kelas)
        ) {
          continue;
        }

        daftarKelas.push(kelas);

        select.innerHTML +=
          '<option value="' +
          kelas +
          '">' +
          kelas +
          '</option>';
      }

      if (
        selectedValue &&
        Array.from(select.options).some(function (option) {
          return option.value === selectedValue;
        })
      ) {
        select.value = selectedValue;
