          new_get_student = r'''function getStudentById(id) {

  const data =
    getMasterSheetData("Siswa");

  for (
    let i = 1;
    i < data.length;
    i++
  ) {

    if (
      String(data[i][0]).trim() ===
      String(id).trim()
    ) {

      let tanggalLahir = "";

      if (
        data[i][5] instanceof Date
      ) {

        tanggalLahir =
          Utilities.formatDate(
            data[i][5],
            Session.getScriptTimeZone(),
            "yyyy-MM-dd"
          );

      } else {

        tanggalLahir =
          String(
            data[i][5] || ""
          ).trim();

      }

      return JSON.stringify({

        rowIndex: i + 1,
        id: data[i][0],
        nisn: data[i][1],
        nama: data[i][2],
        jk: data[i][3],
        tempatLahir: data[i][4],
        tanggalLahir: tanggalLahir,
        kelas: data[i][6],
        status: data[i][7]

      });

    }

  }

  return "";

}
'''
          code = replace_function(code, 'getStudentById', new_get_student)

          # Give the modal a stable title hook.
          title_pattern = re.compile(
              r'<h5 class="modal-title">\s*Tambah Siswa\s*</h5>'
          )
          siswa2, n = title_pattern.subn(
              '<h5 class="modal-title" id="judulModalSiswa">\n          Tambah Siswa\n        </h5>',
