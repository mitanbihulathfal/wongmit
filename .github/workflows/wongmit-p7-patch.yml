        const desktopOnly =
          document.querySelector(".desktop-only");

        if (desktopOnly) {
          desktopOnly.style.display = "none";
        }

        document
          .getElementById("mobileAbsensiContainer")
          .classList.remove("d-none");

      } else {

        document
          .getElementById("tableAbsensi")
          .innerHTML = html;

        document
          .getElementById("mobileAbsensiContainer")
          .innerHTML = "";

        const desktopOnly =
          document.querySelector(".desktop-only");

        if (desktopOnly) {
          desktopOnly.style.display = "";
        }

        document
          .getElementById("mobileAbsensiContainer")
          .classList.add("d-none");

      }

      loadExistingAttendance(requestId);

    })
    .withFailureHandler(function (error) {

      if (
        requestId !==
        loadStudentsByClass.requestId
      ) {
        return;
      }

      setAbsensiDataLoading(false);
      console.error(error);
      showToast(
        "Gagal memuat data siswa.",
        "error"
      );

    })
    .getStudentsByClass(kelas);

}

loadStudentsByClass.requestId = 0;

'''
          index = replace_function(index, 'loadStudentsByClass', new_load_students)

          # Calendar request now carries the student-load generation.
          old_sig = 'function loadExistingAttendance() {'
          new_sig = 'function loadExistingAttendance(studentRequestId) {'
          if old_sig not in index:
              raise RuntimeError('loadExistingAttendance signature not found')
          index = index.replace(old_sig, new_sig, 1)

          needle = '''        const requestId =\n          ++attendanceCalendarRequestId;'''
          repl = '''        const requestId =\n          ++attendanceCalendarRequestId;\n\n        if (studentRequestId == null) {\n          studentRequestId =\n            loadStudentsByClass.requestId;\n        }'''
          if needle not in index:
              raise RuntimeError('attendance request-id anchor not found')
          index = index.replace(needle, repl, 1)

          # Existing calendar callback must ignore stale class responses.
          guard = '''            if (\n              requestId !==\n              attendanceCalendarRequestId\n            ) {\n              return;\n            }'''
          guard2 = '''            if (\n              requestId !==\n              attendanceCalendarRequestId\n            ) {\n              return;\n            }\n\n            if (\n              studentRequestId !==\n              loadStudentsByClass.requestId\n            ) {\n              return;\n            }'''
          if guard not in index:
              raise RuntimeError('calendar success guard not found')
          index = index.replace(guard, guard2, 1)

          # Both confirmation and normal flow preserve the generation token.
          index = index.replace(
              'loadExistingAttendanceCore();',
              'loadExistingAttendanceCore(studentRequestId);',
              1
          )

          # Replace the first standalone normal call if the confirmation branch
          # replacement above consumed only one occurrence.
          index = index.replace(
              '            loadExistingAttendanceCore();',
              '            loadExistingAttendanceCore(studentRequestId);',
              1
          )

          # Core request gets its own generation and validates current class/date.
          index = index.replace(
              'function loadExistingAttendanceCore() {',
              'function loadExistingAttendanceCore(studentRequestId) {',
              1
          )

          core_anchor = '''        const kelas =\n          document.getElementById(\n            "filterKelasAbsensi"\n          ).value;\n\n        const tanggal ='''
          core_repl = '''        const requestId =\n          ++loadExistingAttendanceCore.requestId;\n\n        const kelas =\n          document.getElementById(\n            "filterKelasAbsensi"\n          ).value;\n\n        const tanggal ='''
          # Only replace the first occurrence after the core function marker.
          core_start = index.find('function loadExistingAttendanceCore(studentRequestId) {')
          tail = index[core_start:]
          if core_anchor not in tail:
              raise RuntimeError('core anchor not found')
          tail = tail.replace(core_anchor, core_repl, 1)
          index = index[:core_start] + tail

          core_guard = '''            result =\n              JSON.parse(result);'''
          core_guard_repl = '''            if (\n              requestId !==\n              loadExistingAttendanceCore.requestId\n            ) {\n              return;\n            }\n\n            if (\n              studentRequestId !==\n              loadStudentsByClass.requestId\n            ) {\n              return;\n            }\n\n            if (\n              document.getElementById("filterKelasAbsensi").value !== kelas ||\n              document.getElementById("tanggalAbsensi").value !== tanggal\n            ) {\n              return;\n            }\n\n            result =\n              JSON.parse(result);'''
          core_start = index.find('function loadExistingAttendanceCore(studentRequestId) {')
          tail = index[core_start:]
          if core_guard not in tail:
              raise RuntimeError('core success anchor not found')
          tail = tail.replace(core_guard, core_guard_repl, 1)
          index = index[:core_start] + tail

          # Hide the loading state only after the matching attendance result is rendered.
          core_start = index.find('function loadExistingAttendanceCore(studentRequestId) {')
          tail = index[core_start:]
          marker = '''            if (!result.info.ditemukan) {'''
          replacement = '''            if (!result.info.ditemukan) {'''
          if marker not in tail:
              raise RuntimeError('attendance result marker not found')
          # Insert hide before the early return path.
          tail = tail.replace(
              '              modeEditAbsensi = false;\n\n              setSimpanAbsensiText(',
