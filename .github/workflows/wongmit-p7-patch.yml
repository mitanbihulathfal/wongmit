          siswa = siswa2

          # Show Tambah explicitly resets the title.
          index = index.replace(
              '''      function showTambahSiswa() {\n\n        modeForm = "tambah";''',
              '''      function showTambahSiswa() {\n\n        modeForm = "tambah";\n\n        const judulModal =\n          document.getElementById("judulModalSiswa");\n\n        if (judulModal) {\n          judulModal.textContent = "Tambah Siswa";\n        }''',
              1
          )

          # Edit title and date are set after the server response.
          edit_marker = '''            modeForm = "edit";\n\n            document.getElementById('idSiswa').value = data.id;'''
          edit_repl = '''            modeForm = "edit";\n\n            const judulModal =\n              document.getElementById("judulModalSiswa");\n\n            if (judulModal) {\n              judulModal.textContent = "Edit Siswa";\n            }\n\n            document.getElementById('idSiswa').value = data.id;'''
          if edit_marker not in index:
              raise RuntimeError('Edit Siswa title anchor not found')
          index = index.replace(edit_marker, edit_repl, 1)

          # Ensure a title reset even if Bootstrap closes the modal externally.
          # The edit path itself remains authoritative, so no global modal event is added.

          # ------------------------------------------------------------
          # Safety checks: protected P1/P2 must remain unchanged relative
          # to the repository baseline.
          # ------------------------------------------------------------
          baseline_code = subprocess.check_output(
              ['git', 'show', 'HEAD:apps-script/Code.js'],
              text=True,
              encoding='utf-8'
          )
          for protected in ('saveAttendance', 'reviseAttendance'):
              a1, b1 = body_span(baseline_code, protected)
              a2, b2 = body_span(code, protected)
              if baseline_code[a1:b1] != code[a2:b2]:
                  raise RuntimeError(
                      f'Protected P1/P2 function changed: {protected}'
                  )

          # Ensure the new async helpers exist exactly once.
          for marker in (
              'function ensureAbsensiDataLoadingUI()',
              'function setAbsensiDataLoading(',
              'function nextRekapFilterRequestId()',
              'function loadStudentsByClass()',
              'function loadExistingAttendance(studentRequestId)',
              'function loadExistingAttendanceCore(studentRequestId)',
              'function loadKelasGuruRekap(',
              'function loadSemuaKelasRekap()',
              'function loadMapelRekap(',
          ):
              if index.count(marker) != 1:
                  raise RuntimeError(
                      f'Unexpected function count for: {marker}'
                  )

          INDEX.write_text(index, encoding='utf-8', newline='\n')
          CODE.write_text(code, encoding='utf-8', newline='\n')
          SISWA.write_text(siswa, encoding='utf-8', newline='\n')

          subprocess.run(['git', 'diff', '--check'], check=True)

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wongmit-p7-patch.yml
          git add apps-script/index.html apps-script/Code.js apps-script/page_siswa.html
          git diff --cached --check
          git commit -m "fix: prevent stale async data in attendance and rekap"
          git push origin HEAD:main
