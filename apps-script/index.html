      /* =========================
         RENDER PREVIEW SISWA
      ========================= */

      function renderPreviewSiswa(data) {

        const header =

          data[0] || [];

        const validHeader =

          header.length >= 8 &&

          header[0] === "ID" &&

          header[1] === "NISN" &&

          header[2] === "Nama Siswa" &&

          header[3] === "JK" &&

          header[4] === "Tempat Lahir" &&

          header[5] === "Tanggal Lahir" &&

          header[6] === "Kelas" &&

          header[7] === "Status";

        if (

          !validHeader

        ) {

          document.getElementById(

            "previewImportSiswa"

          ).innerHTML =

            '<div class="alert alert-danger mb-0">' +

            '<i class="fa-solid fa-circle-xmark me-2"></i>' +

            '<strong>Template tidak sesuai.</strong><br>' +

            'Gunakan Template Siswa yang disediakan.' +

            '</div>';

          document.getElementById(

            "btnUploadSiswa"

          ).disabled = true;

          return;

        }

        const totalData =

          data.length - 1;

        let totalValid = 0;

        let totalError = 0;

        /* =========================
        HITUNG SELURUH DATA
        ========================= */

        for (

          let i = 1;

          i < data.length;

          i++

        ) {

          let barisError = false;

          for (

            let j = 0;

            j < data[i].length;

            j++

          ) {

            const value =

              String(

                data[i][j] || ""

              ).trim();

            if (

              value === ""

            ) {

              barisError = true;

            }

            if (

              j === 3 &&

              !["L", "P"].includes(value)

            ) {

              barisError = true;

            }

            if (

              j === 7 &&

              !["Aktif", "Lulus", "Mutasi"].includes(value)

            ) {

              barisError = true;

            }

          }

          if (

            barisError

          ) {

            totalError++;

          }

          else {

            totalValid++;

          }

        }

        /* =========================
        PREVIEW (10 BARIS)
        ========================= */

        let html =

          '<div class="table-responsive">' +

          '<table class="table table-bordered table-sm">' +

          '<tbody>';

        const maxPreview =

          Math.min(

            data.length,

            11

          );

        for (

          let i = 0;

          i < maxPreview;

          i++

        ) {

          html += "<tr>";

          for (

            let j = 0;

            j < data[i].length;

            j++

          ) {

            let value =

              data[i][j] || "";

            let style = "";

            if (

              i > 0

            ) {

              if (

                String(value).trim() === ""

              ) {

                style =

                  ' class="table-danger"';

              }

              if (

                j === 3 &&

                !["L", "P"].includes(

                  String(value).trim()

                )

              ) {

                style =

                  ' class="table-danger"';

              }

              if (

                j === 7 &&

                !["Aktif", "Lulus", "Mutasi"].includes(

                  String(value).trim()

                )

              ) {

                style =

                  ' class="table-danger"';

              }

              if (

                j === 5 &&

                typeof value === "number"

              ) {

                value =

                  XLSX.SSF.format(

                    "yyyy-mm-dd",

                    value

                  );

              }

            }

            html +=

              i === 0

                ?

                "<th>" +

                value +

                "</th>"

                :

                "<td" +

                style +

                ">" +

                value +

                "</td>";

          }

          html += "</tr>";

        }

        html +=

          "</tbody>" +

          "</table>" +

          "</div>";

        html +=

          buildPreviewSummary(

            totalData,

            totalValid,

            totalError

          );

        document.getElementById(

          "btnUploadSiswa"

        ).disabled =

          totalError > 0;

        document.getElementById(

          "previewImportSiswa"

        ).innerHTML =

          html;

      }

                  '">' +
                  data[i][1] +

              }
      
              if (
                selectedKelas &&
                Array.from(
                  select.options
                ).some(

                      option.value ===
                      selectedKelas
                    );

                )
              ) {

                rekapFilterRequestId

                  "filterKelasRekap"

      /* =========================
         IMPORT PREVIEW ENGINE
      ========================= */

      function buildPreviewSummary(totalData, totalValid, totalError) {

        return (

          '<div class="mt-3">' +

          '<div class="alert ' +

          (totalError > 0 ? "alert-warning" : "alert-success") +

          '">' +

          '<strong>Total Data :</strong> ' + totalData +

          '<br>' +

          '<strong>Valid :</strong> ' + totalValid +

          '<br>' +

          '<strong>Error :</strong> ' + totalError +

          '</div>' +

          '</div>'

        );

      }

      function renderPreviewGuruMengajar(data) {

        const header =

          data[0] || [];

        const validHeader =

          header.length >= 9 &&

          header[0] === "Guru" &&

          header[1] === "Kelas" &&

          header[2] === "Hari" &&

          header[3] === "Mapel 1" &&

          header[4] === "Mapel 2" &&

          header[5] === "Mapel 3" &&

          header[6] === "Mapel 4" &&

          header[7] === "Mapel 5" &&

          header[8] === "Status";

        if (

          !validHeader

        ) {

          document.getElementById(

            "previewImportGuruMengajar"

          ).innerHTML =

            '<div class="alert alert-danger mb-0">' +

            '<i class="fa-solid fa-circle-xmark me-2"></i>' +

            '<strong>Template tidak sesuai.</strong><br>' +

            'Gunakan file Template Guru Mengajar yang disediakan.' +

            '</div>';

          return;

        }

        let totalValid = 0;

        let totalError = 0;

        let html =

          '<div class="table-responsive">' +

          '<table class="table table-bordered table-sm">' +

          '<tbody>';

        const maxRow =

          Math.min(

            data.length,

            6

          );

        for (

          let i = 0;

          i < maxRow;

          i++

        ) {

          html += "<tr>";

          let barisError = false;

          for (

            let j = 0;

            j < data[i].length;

            j++

          ) {

            let value =

              data[i][j] || "";

            let style = "";

            if (

              i > 0

            ) {

              /* =========================
                 VALIDASI GURU
              ========================= */

              if (

                j === 0 &&

                String(value).trim() === ""

              ) {

                style =

                  ' class="table-danger"';

                barisError = true;

              }

              const guruAda =

                masterGuruImport.some(

                  function (item) {

                    return (

                      item.nama ===

                      String(value).trim()

                    );

                  }

                );

              if (

                j === 0 &&

                String(value).trim() !== "" &&

                !guruAda

              ) {

                style =

                  ' class="table-danger"';

                barisError = true;

              }

              /* =========================
                 VALIDASI KELAS
              ========================= */

              if (

                j === 1 &&

                String(value).trim() === ""

              ) {

                style =

                  ' class="table-danger"';

                barisError = true;

              }

              const kelasAda =

                masterKelasImport.some(

                  function (item) {

                    return (

                      item.nama ===

                      String(value).trim()

                    );

                  }

                );

              if (

                j === 1 &&

                String(value).trim() !== "" &&

                !kelasAda

              ) {

                style =

                  ' class="table-danger"';

                barisError = true;

              }

              /* =========================
                 VALIDASI HARI
              ========================= */

              if (

                j === 2 &&

                ![

                  "Ahad",
                  "Senin",
                  "Selasa",
                  "Rabu",
                  "Kamis",
                  "Sabtu"

                ].includes(

                  String(value).trim()

                )

              ) {

                style =

                  ' class="table-danger"';

                barisError = true;

              }

              /* =========================
                 VALIDASI MAPEL
              ========================= */

              if (

                j === 3 &&

                String(value).trim() === ""

              ) {

                style =

                  ' class="table-danger"';

                barisError = true;

              }

              if (

                j >= 3 &&

                j <= 7 &&

                String(value).trim() !== ""

              ) {

                const mapelAda =

                  masterMapelImport.some(

                    function (item) {

                      return (

                        item.nama ===

                        String(value).trim()

                      );

                    }

                  );

                if (

                  !mapelAda

                ) {

                  style =

                    ' class="table-danger"';

                  barisError = true;

                }

              }

              /*
                Mapel 2–5 boleh kosong.
      
                Validasi Master Mapel
                dilakukan pada Preview
                dan akan divalidasi ulang
                pada Backend Import
                (GM.4E).
              */

              /* =========================
                 VALIDASI STATUS
              ========================= */

              if (

                j === 8 &&

                ![

                  "Aktif",
                  "Nonaktif"

                ].includes(

                  String(value).trim()

                )

              ) {

                style =

                  ' class="table-danger"';

                barisError = true;

              }

            }

            html +=

              i === 0

                ?

                "<th>" +

                value +

                "</th>"

                :

                "<td" +

                style +

                ">" +

                value +

                "</td>";

          }

          if (

            i > 0

          ) {

            if (

              barisError

            ) {

              totalError++;

            }

            else {

              totalValid++;

            }

          }

          html += "</tr>";

        }

        html +=

          "</tbody>" +

          "</table>" +

          "</div>";

        html += buildPreviewSummary(

          data.length - 1,

          totalValid,

          totalError

        );

        document.getElementById(

          "btnUploadGuruMengajar"

        ).disabled =

          totalError > 0;

        document.getElementById(

          "previewImportGuruMengajar"

        ).innerHTML =

          html;

      }

      /* =========================
         IMPORT EXCEL ENGINE
      ========================= */

      function readExcelFile(file, callback) {

        if (!file) {
          return;
        }

        const reader = new FileReader();

        reader.onload = function (e) {

          const workbook =

            XLSX.read(

              e.target.result,

              {

                type: "binary"

              }

            );

          const sheet =

            workbook.Sheets[
            workbook.SheetNames[0]
            ];

          const data =

            XLSX.utils.sheet_to_json(

              sheet,

              {

                header: 1,

                blankrows: false,

                raw: false,

                dateNF: "yyyy-mm-dd"

              }

            );

          callback(

            workbook,

            data

          );

        };

        reader.readAsBinaryString(file);

      }

      function loadKelasGuruRekap(
        idGuru,
        selectedValue = "",
        selectedMapel = "",
        requestId = rekapFilterRequestId
      ) {
      
        google.script.run
      
          .withSuccessHandler(
            function (result) {
      
              if (
                requestId !==
                rekapFilterRequestId
              ) {
                return;
              }
      
              const data =
                JSON.parse(result);
      
              const select =
                document.getElementById(
                  "filterKelasRekap"
                );
      
              if (!select) {
                return;
              }
      
              select.innerHTML =
                '<option value="">Semua Kelas</option>';
      
              const daftarKelas =
                [];
      
              for (
                let i = 1;
                i < data.length;
                i++
              ) {
      
                const idGuruData =
                  String(
                    data[i][1]
                  ).trim();
      
                const kelas =
                  String(
                    data[i][3]
                  ).trim();
      
                const status =
                  String(
                    data[i][6]
                  ).trim();
      
                if (
                  status &&
                  status !== "Aktif"
                ) {
                  continue;
                }
      
                if (
                  idGuruData !==
                  String(
                    idGuru
                  ).trim()
                ) {
                  continue;
                }
      
                if (
                  daftarKelas.includes(
                    kelas
                  )
                ) {
                  continue;
                }
      
                daftarKelas.push(
                  kelas
                );
      
                select.innerHTML +=
                  '<option value="' +
                  kelas +
                  '">' +
                  kelas +
                  '</option>';
      
              }
      
              if (
                selectedValue &&
                Array.from(
                  select.options
                ).some(
                  function (option) {
      
                    return (
                      option.value ===
                      selectedValue
                    );
      
                  }
                )
              ) {
      
                select.value =
                  selectedValue;
      
              }
      
              /*
               * Kelas hanya disabled
               * selama request berlangsung.
               * Setelah data kelas selesai,
               * wajib kembali aktif.
               */
              select.disabled = false;
      
              loadMapelRekap(
                idGuru,
                select.value,
                selectedMapel,
                requestId
              );
      
            }
          )
      
          .withFailureHandler(
            function (error) {
      
              if (
                requestId !==
                rekapFilterRequestId
              ) {
                return;
              }
      
              const select =
                document.getElementById(
                  "filterKelasRekap"
                );
      
              if (select) {
      
                select.disabled = false;
      
              }
      
              console.error(error);
      
            }
          )
      
          .getGuruMengajar(
            localStorage.getItem(
              "wongmit_session"
            )
          );
      
      }

      let rekapTableData = [];
      let rekapSortKey = "";
      let rekapSortDirection = "asc";

      function updateRekapSortIndicators() {

        document.querySelectorAll(
          "#rekapTableWrapper thead th[data-rekap-sort]"
        ).forEach(function (header) {

          const isActive =
            header.dataset.rekapSort === rekapSortKey;

          const direction =
            isActive ? rekapSortDirection : "none";

          header.setAttribute(
            "aria-sort",
            direction === "asc" ? "ascending" :
              direction === "desc" ? "descending" : "none"
          );

          header.querySelector(
            ".rekap-sort-icon"
          ).textContent =
            direction === "asc" ? "▲" :
              direction === "desc" ? "▼" : "";

        });

      }

      function sortRekapTable(sortKey) {

        if (!rekapTableData.length) {
          return;
        }

        if (rekapSortKey === sortKey) {
          rekapSortDirection =
            rekapSortDirection === "asc" ? "desc" : "asc";
        } else {
          rekapSortKey = sortKey;
          rekapSortDirection = "asc";
        }

        const sortedData =
          rekapTableData.map(function (row, index) {
            return {
              row: row,
              index: index
            };
          });

        sortedData.sort(function (first, second) {

          const firstValue = first.row[sortKey];
          const secondValue = second.row[sortKey];
          let comparison;

          if (sortKey === "nama" ||
              sortKey === "kelas" ||
              sortKey === "keterangan") {

            comparison = String(firstValue || "").localeCompare(
              String(secondValue || ""),
              undefined,
              { numeric: true, sensitivity: "base" }
            );

          } else {

            comparison = Number(firstValue || 0) -
              Number(secondValue || 0);

          }

          return comparison || first.index - second.index;

        });

        if (rekapSortDirection === "desc") {
          sortedData.reverse();
        }

        rekapTableData = sortedData.map(function (item) {
          return item.row;
        });

        renderRekapTable(rekapTableData);
        updateRekapSortIndicators();

      }

        const tanggalAkhir =

          document.getElementById(
            "tanggalAkhirRekap"

          tanggalAwal &&
          tanggalAkhir &&
          tanggalAwal > tanggalAkhir
        ) {

            "warning"
          );

          document.getElementById(
            "filterMapelRekap"
          ).value;

        setRekapLoading(true);

        startRekapLoading();

        google.script.run

          .withSuccessHandler(function (result) {

            if (
              requestId !==
              rekapFilterRequestId
            ) {
              return;
            }

            successRekapLoading();

            setRekapLoading(false);

            stopRekapLoading();

            if (result == null) {

              console.error(
                "RESULT NULL"
              );

                "Result NULL",
                "error"
              );

              return;

            }

            const data =
              result;

            rekapTableData = data.slice();
            rekapSortKey = "";
            rekapSortDirection = "asc";
            updateRekapSortIndicators();

            renderRekapSummary(data);

            renderRekapTable(data);

          })

          .withFailureHandler(function (error) {

            if (
              requestId !==
              rekapFilterRequestId
            ) {
              return;
            }
            
            stopRekapLoading();

            setRekapLoading(false);

            console.error(error);

              "error"
            );

              "wongmit_session"

          document.getElementById(
            "filterKelasRekap"
          ).value;

        const mapel =

          document.getElementById(
            "filterMapelRekap"
          ).value;

        const btnExport =

          document.getElementById(
            "btnExportRekap"
          );

        setButtonLoading(

          btnExport,

          "Menyiapkan Excel..."

        );

        google.script.run

          .withSuccessHandler(function (result) {

            resetButtonLoading(
              btnExport
            );

            window.open(

              result.exportUrl,

              "_blank"

            );

            showToast(
              "Export berhasil.",
              "success"
            );

            google.script.run
              .cleanupExportSpreadsheet(

                result.spreadsheetId

              );

          })

          .withFailureHandler(function (error) {

            resetButtonLoading(
              btnExport
            );

            console.error(error);

            showToast(

              "Export gagal.",

              "error"

            );

          })

          .exportRekapExcel(
            localStorage.getItem(
              "wongmit_session"
            ),
            tanggalAwal,
            tanggalAkhir,
            guru,
            kelas,
            mapel,
            guruText,
            rekapTableData
          );

      }

      function editGuruMengajar(idRelasi) {

        modeGuruMengajar =
          "edit";

        google.script.run

          .withSuccessHandler(function (data) {

            if (!data) {

              showToast(
                "Data tidak ditemukan",
                "warning"
              );

              return;

            }

            editGuruMengajarRow =
              data.rowIndex;

            document.getElementById(
              "idRelasiMengajar"
            ).value =
              data.idRelasi;

            document.getElementById(
              "guruMengajar"
            ).value =
              data.idGuru;

            document.getElementById(
              "kelasMengajar"
            ).value =
              data.kelas;

            document.getElementById(
              "statusMengajar"
            ).value =
              data.status;

            loadHariMengajar(function () {

              document.getElementById(
                "hariMengajar"
              ).value =
                data.hari;

              loadMapelCheckbox(function () {

                const daftarMapel =
                  String(
                    data.mapel
                  ).split("|");

                document
                  .querySelectorAll(
                    "#listMapelMengajar .mapel-check"
                  )
                  .forEach(function (item) {

                    item.checked =
                      daftarMapel.includes(
                        item.value
                      );

                  });

                const modal =
                  new bootstrap.Modal(
                    document.getElementById(
                      "modalGuruMengajar"
                    )
                  );

                modal.show();

              });

            });

          })

          .withFailureHandler(function (error) {

            console.error(error);

            showToast(
              "Gagal memuat data",
              "error"
            );

          })

          .getGuruMengajarById(
            idRelasi
          );

      }

      function hapusGuruMengajar(

        idRelasi

      ) {

        showConfirmModal(

          "Hapus Guru Mengajar",

          "Apakah Anda yakin ingin menghapus data guru mengajar ini?",

          function () {

            prosesHapusGuruMengajar(

              idRelasi

            );

          }

        );

      }

      function prosesHapusGuruMengajar(

        idRelasi

      ) {

        const btn =

          document.getElementById(

            "btnYaKonfirmasiGlobal"

          );

        startButtonLoading(

          btn,

          "Menghapus..."

        );

        google.script.run

          .withSuccessHandler(function () {

            successButtonLoading(

              btn,

              "Berhasil"

            );

            setTimeout(function () {

              stopButtonLoading(

                btn

              );

              bootstrap.Modal

                .getInstance(

                  document.getElementById(

                    "modalKonfirmasiGlobal"

                  )

                )

                ?.hide();

              showToast(

                "Data berhasil dihapus"

              );

              loadGuruMengajar();

            }, 800);

          })

          .withFailureHandler(function (error) {

            console.error(error);

            stopButtonLoading(

              btn

            );

            showToast(

              "Gagal menghapus data",

              "error"

            );

          })

          .deleteGuruMengajar(

            localStorage.getItem(

              "wongmit_session"

            ),

            idRelasi

          );

      }

      function simpanGuruMengajar() {

        const btn =

          document.getElementById(
            "btnSimpanGuruMengajar"
          );

        startButtonLoading(
          btn
        );

        const data = {

          idRelasi:

            document.getElementById(
              "idRelasiMengajar"
            ).value

            ||

            Date.now(),

          idGuru:

            document.getElementById(
              "guruMengajar"
            ).value,

          kelas:

            document.getElementById(
              "kelasMengajar"
            ).value,

          hari:

            document.getElementById(
              "hariMengajar"
            ).value,

          mapel: (() => {

            const hasil = [];

            document
              .querySelectorAll(
                "#listMapelMengajar .mapel-check:checked"
              )
              .forEach(function (item) {

                hasil.push(
                  item.value
                );

              });

            return hasil.join("|");

          })(),

          status:

            document.getElementById(
              "statusMengajar"
            ).value

        };

        if (

          !data.idGuru ||

          !data.kelas ||

          !data.hari ||

          !data.mapel

        ) {

          stopButtonLoading(
            btn
          );

          showToast(
            "Lengkapi semua data",
            "warning"
          );

          return;

        }

        const runner =

          google.script.run

            .withSuccessHandler(function () {

              successButtonLoading(
                btn
              );

              showToast(

                modeGuruMengajar === "edit"

                  ?

                  "Data guru mengajar berhasil diperbarui"

                  :

                  "Data guru mengajar berhasil disimpan"

              );

              setTimeout(function () {

                stopButtonLoading(
                  btn
                );

                const modal =

                  bootstrap.Modal.getInstance(

                    document.getElementById(
                      "modalGuruMengajar"
                    )

                  );

                if (modal) {
                  modal.hide();
                }

                loadGuruMengajar();

              }, 1000);

            })

            .withFailureHandler(function (error) {

              console.error(error);

              stopButtonLoading(
                btn
              );

              showToast(
                "Gagal menyimpan data",
                "error"
              );

            });

        if (

          modeGuruMengajar === "edit"

        ) {

          runner.updateGuruMengajar(

            localStorage.getItem(
              "wongmit_session"
            ),

            editGuruMengajarRow,

            data

          );

        } else {

          runner.addGuruMengajar(

            localStorage.getItem(
              "wongmit_session"
            ),

            data

          );

        }

      }

      document.addEventListener("click", function (e) {

        if (!isMobileLayout()) {
          return;
        }

        const sidebar = document.getElementById("sidebar");

        if (!sidebar) {
          return;
        }

        const toggle = e.target.closest('[onclick="toggleSidebar()"]');

        if (toggle) {
          return;
        }

        if (sidebar.contains(e.target)) {
          return;
        }

        if (sidebar.classList.contains("show")) {
          sidebar.classList.remove("show");
        }

      });

    </script>
