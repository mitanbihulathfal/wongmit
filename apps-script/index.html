<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>WONG MIT</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {

      --primary: #0b2d6b;

      --gold: #d4af37;

      --bg: #f4f7fb;

      --white: #ffffff;

      --radius-card: 22px;

      --radius-input: 14px;

      --radius-button: 14px;

      --shadow-card:
        0 10px 28px rgba(15, 23, 42, .06);

      --shadow-hover:
        0 14px 34px rgba(15, 23, 42, .10);

      --border-soft:
        1px solid rgba(15, 23, 42, .05);

      --transition: .20s ease;

    }

    * {
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
    }

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

    }

    #appRoot {

      position: relative;

      width: 100%;

      min-height: 100vh;

      background: var(--bg);

      overflow-x: hidden;

    }

    .sidebar {

      position: fixed;

      left: 0;

      top: 0;

      bottom: 0;

      width: 260px;

      height: 100dvh;

      min-height: 100dvh;

      background: var(--primary);

      color: white;

      overflow-y: auto;

      overflow-x: hidden;

      z-index: 1000;

    }

    .logo-box {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, .15);
    }

    .logo-box img {
      width: 70px;
      margin-bottom: 10px;
    }

    .logo-box h5 {
      margin: 0;
      font-weight: 700;
    }

    .logo-box small {
      color: #ddd;
    }

    .menu-title {
      font-size: 12px;
      color: #cfcfcf;
      padding: 15px 20px 5px;
      text-transform: uppercase;
    }

    .menu-link {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      transition: .3s;
    }

    .menu-link:hover {
      background: rgba(255, 255, 255, .12);
      color: white;
    }

    .menu-link i {
      width: 25px;
    }

    .content {

      margin-left: 260px;

      width: calc(100% - 260px);

      min-height: 100dvh;

      padding: 22px;

      transition: .25s ease;

      overflow-x: hidden;

    }

    .topbar {

      background: #fff;

      padding: 24px;

      border-radius: 24px;

      box-shadow:
        0 12px 30px rgba(15, 23, 42, .06);

      margin-bottom: 24px;

    }

    .topbar h3 {

      font-weight: 700;

      color: #0f172a;

      letter-spacing: -.02em;

    }

    .topbar .text-muted {

      color: #64748b !important;

    }

    .card-stat {

      background: #fff;

      border: none;

      border-radius: 22px;

      cursor: pointer;

      box-shadow:
        0 10px 28px rgba(15, 23, 42, .06);

      transition:
        all .18s ease;

    }

    .card-stat:hover {

      transform:
        translateY(-4px) scale(1.02);

      box-shadow:
        0 18px 40px rgba(15, 23, 42, .12);

    }

    .icon-box {

      width: 54px;

      height: 54px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 20px;

      color: #fff;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .25);

    }

    .bg-gold {
      background: #d4af37;
    }

    .bg-success2 {
      background: #198754;
    }

    .bg-danger2 {
      background: #dc3545;
    }

    .bg-primary2 {

      background:
        linear-gradient(135deg,
          #2563eb,
          #1d4ed8);

    }

    .bg-gold {

      background:
        linear-gradient(135deg,
          #f6c453,
          #e0a800);

    }

    .bg-success2 {

      background:
        linear-gradient(135deg,
          #22c55e,
          #16a34a);

    }

    .bg-danger2 {

      background:
        linear-gradient(135deg,
          #ef4444,
          #dc2626);

    }

    .card-summary {

      background: #fff;

      border: none;

      border-radius: 22px;

      box-shadow:
        0 10px 28px rgba(15, 23, 42, .06);

    }

    /* =========================
      DASHBOARD ATTENDANCE LOADING
    ========================= */

    #modalDashboard .modal-title {
      margin-bottom: 0 !important;
      line-height: 1.1;
    }

    #modalDashboard #dashboardAttendanceDate {
      display: block;
      margin-top: 2px;
      line-height: 1.1;
    }
    .dashboard-attendance-guru {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      color: #6c757d;
    }
    .dashboard-attendance-loading {

      min-height: 180px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 12px;

      color: var(--primary);

      text-align: center;

    }

    .dashboard-tadpole {

      position: relative;

      width: 64px;

      height: 28px;

    }

    .dashboard-tadpole::before {

      content: "";

      position: absolute;

      width: 18px;

      height: 18px;

      border-radius: 50%;

      background: var(--primary);

      top: 5px;

      left: 0;

      box-shadow:
        12px 0 0 rgba(11, 45, 107, .45),
        22px 0 0 rgba(11, 45, 107, .22);

      animation: dashboardTadpoleMove 1.1s ease-in-out infinite;

    }

    .dashboard-tadpole::after {

      content: "";

      position: absolute;

      width: 34px;

      height: 12px;

      border-bottom: 3px solid rgba(11, 45, 107, .35);

      border-radius: 50%;

      left: 8px;

      top: 5px;

      transform: rotate(-12deg);

      transform-origin: left center;

      animation: dashboardTadpoleTail 1.1s ease-in-out infinite;

    }

    .dashboard-attendance-loading-text {

      font-size: 13px;

      font-weight: 600;

      color: #64748b;

    }

    @keyframes dashboardTadpoleMove {

      0%,
      100% {

        transform: translateX(0);

      }

      50% {

        transform: translateX(24px);

      }

    }

    @keyframes dashboardTadpoleTail {

      0%,
      100% {

        transform: rotate(-12deg) scaleX(.85);

      }

      50% {

        transform: rotate(12deg) scaleX(1);

      }

    }

    .mobile-btn {
      display: none;
    }

    .mobile-close-btn {

      display: none;

    }

    /* CSS Umum */

    #mobileAbsensiContainer {
      display: none;
    }

    /* =========================
      DASHBOARD BADGE
    ========================= */

    .dashboard-badge {

      display: inline-flex;

      align-items: center;

      padding: 5px 12px;

      margin: 2px 6px 2px 0;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 600;

      letter-spacing: .2px;

      border: 1px solid transparent;

      transition: .2s;

    }

    .badge-admin {

      background: #0b2d6b;

      color: #ffffff;

    }

    .badge-kepsek {

      background: #d4af37;

      color: #0b2d6b;

    }

    .badge-wali {

      background: #dbeafe;

      color: #1e3a8a;

      border: 1px solid #93c5fd;

    }

    .badge-mapel {

      background: #dcfce7;

      color: #166534;

      border: 1px solid #86efac;

    }

    .badge-kelas {

      background: #fff4cc;

      color: #8a5a00;

      border: 1px solid #f4d35e;

    }

    .badge-walikelas {

      background: #ede9fe;

      color: #5b21b6;

      border: 1px solid #c4b5fd;

    }

    /* =========================
      HEADER DATE TIME
    ========================= */

    .content-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

    }

    .header-datetime {

      display: flex;

      flex-direction: column;

      align-items: flex-end;

      line-height: 1.2;

    }

    #headerTanggal {

      font-size: 14px;

      font-weight: 600;

      color: #495057;

    }

    #headerJam {

      font-size: 13px;

      color: #6c757d;

    }

    /* =========================
      DASHBOARD AKADEMIK
    ========================= */

    .dashboard-akademik {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 16px;

    }

    .dashboard-akademik-item {

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      justify-content: center;

      gap: 4px;

      padding: 10px 14px;

      background: #eef5ff;

      border: 1px solid #d8e8ff;

      border-radius: 18px;

      min-height: 62px;

    }

    .dashboard-akademik-item small {

      font-size: 11px;

      color: #64748b;

      font-weight: 600;

      line-height: 1;

    }

    .dashboard-akademik-value {

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .dashboard-akademik-value i {

      color: #2563eb;

      font-size: 14px;

    }

    .dashboard-akademik-value strong {

      font-size: 18px;

      font-weight: 700;

      color: #0f172a;

    }

    .dashboard-akademik-item i {

      color: #2563eb;

    }

    .dashboard-akademik-item strong {

      color: #0f172a;

      margin-left: 4px;

    }

    /* =========================
      DASHBOARD PROFILE
    ========================= */

    .dashboard-profile {

      position: relative;

      display: flex;

      flex-direction: row;

      flex-wrap: nowrap;

      justify-content: space-between;

      align-items: flex-start;

      gap: 16px;

    }

    .dashboard-profile-info {

      flex: 1 1 280px;

      min-width: 0;

    }

    .dashboard-profile-actions {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      align-self: flex-start;
    }

    /* =========================
      DASHBOARD ACTION BUTTON
    ========================= */

    .dashboard-action-btn {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      padding: 10px 16px;

      background: var(--primary);

      color: #ffffff;

      border: 1px solid transparent;

      border-radius: 14px;

      text-decoration: none;

      box-shadow:
        0 6px 16px rgba(11, 45, 107, .22);

      transition:
        background .18s ease,
        transform .18s ease,
        box-shadow .18s ease;

    }

    .dashboard-action-btn:hover {

      background: #1d4ed8;

      color: #ffffff;

      transform: translateY(-1px);

      box-shadow:
        0 8px 20px rgba(11, 45, 107, .3);

    }

    .dashboard-action-btn-icon {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 36px;

      height: 36px;

      flex-shrink: 0;

      border-radius: 10px;

      background: rgba(255, 255, 255, .15);

      color: var(--gold);

      font-size: 16px;

    }

    .dashboard-action-btn-text {

      display: flex;

      flex-direction: column;

      text-align: left;

      line-height: 1.15;

    }

    .dashboard-action-btn-text strong {

      font-size: 14px;

      font-weight: 700;

      color: #ffffff;

    }

    .dashboard-action-btn-text small {

      font-size: 11px;

      font-weight: 500;

      color: rgba(255, 255, 255, .75);

    }

    /* CARD STATISTIK */

    .card-stat h2 {

      font-size: 44px;

      font-weight: 700;

      margin-bottom: 4px;

    }

    .card-stat small {

      display: block;

      font-size: 15px;

      color: #6c757d;

      font-weight: 500;

    }

    /* =========================
      CARD CLICK EFFECT
    ========================= */

    .card-clicking {

      transform: scale(.97);

      transition: transform .15s ease;

      opacity: .92;

    }

    /* =========================
      DASHBOARD SUMMARY CARD
    ========================= */

    .dashboard-summary-card {

      background: #fff;

      border: 1px solid #e9edf3;

      border-radius: 16px;

      padding: 14px;

      margin-bottom: 12px;

      box-shadow:

        0 4px 12px rgba(15, 23, 42, .05);

      transition:

        transform .18s ease,

        box-shadow .18s ease;

      cursor: pointer;

    }

    /* BADGE STATUS ABSENSI */

    .dashboard-status-badge {

      min-width: 82px;

      text-align: center;

      font-size: 13px;

      font-weight: 600;

      padding: 8px 12px;

      border-radius: 999px;

    }

    .dashboard-summary-card:hover {

      transform: translateY(-2px);

      box-shadow:

        0 10px 24px rgba(15, 23, 42, .08);

    }

    .dashboard-summary-card:hover {

      transform: translateY(-2px);

    }

    .dashboard-summary-card .badge {

      font-size: .78rem;

      padding: 7px 10px;

      border-radius: 999px;

    }

    /* =========================
      HALAMAN PENGATURAN
    ========================= */

    .pengaturan-page {

      max-width: 1200px;

      margin: 0 auto;

    }


    /* HEADER */

    .pengaturan-header {

      display: flex;

      align-items: center;

      gap: 16px;

      margin-bottom: 18px;

    }


    .pengaturan-header-icon {

      width: 52px;

      height: 52px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #eef4ff;

      color: #0b2d6b;

      font-size: 22px;

      flex-shrink: 0;

    }


    /* INFO */

    .pengaturan-info {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding: 7px 13px;

      border-radius: 999px;

      background: #f1f5f9;

      color: #64748b;

      font-size: 13px;

      font-weight: 600;

      margin-bottom: 12px;

    }


    /* CARD */

    .pengaturan-card {

      position: relative;

      display: flex;

      align-items: center;

      gap: 16px;

      min-height: 125px;

      height: 100%;

      padding: 20px;

      background: #fff;

      border: 1px solid #edf1f5;

      border-radius: 22px;

      box-shadow:

        0 8px 24px rgba(15, 23, 42, .06);

      cursor: pointer;

      transition:

        transform .18s ease,

        box-shadow .18s ease,

        border-color .18s ease;

    }


    /* HOVER */

    .pengaturan-card:hover {

      transform:
        translateY(-3px);

      box-shadow:

        0 14px 32px rgba(15, 23, 42, .10);

      border-color: #dde5ef;

    }


    /* CLICK */

    .pengaturan-card:active {

      transform:
        scale(.98);

    }


    /* ICON */

    .pengaturan-icon {

      width: 58px;

      height: 58px;

      min-width: 58px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 23px;

    }


    /* AKADEMIK */

    .pengaturan-icon-akademik {

      background: #e8f0ff;

      color: #2563eb;

    }


    /* SEKOLAH */

    .pengaturan-icon-sekolah {

      background: #e8f8ef;

      color: #198754;

    }


    /* SISTEM */

    .pengaturan-icon-sistem {

      background: #f1eafe;

      color: #7c3aed;

    }


    /* TAHUN AJARAN */

    .pengaturan-icon-tahun {

      background: #fff2df;

      color: #ea7c16;

    }


    /* CONTENT */

    .pengaturan-card-content {

      flex: 1;

      min-width: 0;

    }


    .pengaturan-card-content h5 {

      margin: 0 0 6px 0;

      font-size: 17px;

      font-weight: 700;

      color: #0f172a;

    }


    .pengaturan-card-content p {

      margin: 0;

      color: #64748b;

      font-size: 13px;

      line-height: 1.55;

    }

    /* PREVIEW AKADEMIK */

    .pengaturan-preview {

      display: flex;

      flex-direction: column;

      gap: 6px;

      margin-top: 8px;

    }

    .pengaturan-preview div {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

    }


    .pengaturan-preview strong {

      font-size: 13px;

      color: #475569;

    }

    .pengaturan-preview span {

      font-size: 13px;

      color: #0f172a;

      font-weight: 600;

    }

    /* ARROW */

    .pengaturan-arrow {

      display: flex;

      align-items: center;

      justify-content: center;

      color: #94a3b8;

      font-size: 15px;

      transition:
        transform .18s ease;

    }

    .pengaturan-card:hover .pengaturan-arrow {

      transform: translateX(3px);

    }

    /* =========================
      HARI LIBUR AKADEMIK
    ========================= */

    #editHariLibur {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(120px, 1fr));

      gap: 10px 16px;

    }

    #editHariLibur .form-check {

      display: flex;

      align-items: center;

      gap: 8px;

      margin: 0;

    }

    #editHariLibur .form-check-input {

      margin: 0;

    }

    #editHariLibur .form-check-label {

      margin: 0;

      white-space: nowrap;

      cursor: pointer;

    }

    /* =========================
      PENGATURAN EDIT
    ========================= */

    .pengaturan-edit {

      display: flex;

      flex-direction: column;

      gap: 16px;

    }

    .pengaturan-edit strong {

      display: block;

      margin-bottom: 6px;

    }

    @media(max-width:768px) {

      /* DASHBOARD PROFILE MOBILE */
      .dashboard-profile {

        flex-wrap: nowrap;

        gap: 12px;

      }

      .dashboard-profile-info {

        flex: 1 1 auto;

        min-width: 0;

      }

      .dashboard-profile-actions {

        position: absolute;

        top: 200px;

        right: 14px;

        display: flex;

        align-items: flex-start;

      }

      .dashboard-action-btn {

        gap: 8px;

        padding: 8px 12px;

        border-radius: 12px;

      }

      .dashboard-action-btn-icon {

        width: 30px;

        height: 30px;

        font-size: 14px;

        border-radius: 8px;

      }

      .dashboard-action-btn-text strong {

        font-size: 13px;

      }

      .dashboard-action-btn-text small {

        font-size: 10px;

      }

      .card-stat h2 {

        font-size: 38px;

        margin-bottom: 2px;

      }

      .card-stat small {

        font-size: 14px;

        font-weight: 500;

      }

      .icon-box {

        width: 46px;

        height: 46px;

        font-size: 18px;

        border-radius: 14px;

      }

      .desktop-only {
        display: none;
      }

      #mobileAbsensiContainer {
        display: block !important;
      }

      .absensi-card {

        background: #fff;

        border: 1px solid #e9ecef;

        border-radius: 14px;

        padding: 14px;

        margin-bottom: 12px;

      }

      .absensi-card-header {

        display: flex;

        gap: 10px;

        align-items: flex-start;

        margin-bottom: 12px;

      }

      .absensi-no {

        width: 32px;

        font-weight: 600;

        color: #888;

        flex-shrink: 0;

      }

      .absensi-nama {

        font-weight: 600;

        flex: 1;

        line-height: 1.35;

      }

      .absensi-card .btn-group {

        display: flex;

        width: 100%;

      }

      .absensi-card .btn {

        flex: 1;

      }

      body {

        font-size: 14px;

      }

      .content {

        margin-left: 0;

        width: 100%;

        min-height: 100dvh;

        padding: 14px;

      }

      .sidebar {

        left: -260px;

        transition: .25s ease;

        box-shadow:
          8px 0 25px rgba(0, 0, 0, .18);

      }

      .sidebar.show {

        left: 0;

      }

      .mobile-close-btn {

        display: block;

        margin: 12px;

        font-size: 24px;

        color: #fff !important;

        text-decoration: none;

      }

      .mobile-btn {

        display: flex;

        align-items: center;

        justify-content: center;

        width: 42px;

        height: 42px;

        padding: 0;

        border-radius: 12px;

        margin-bottom: 14px;

      }

      .topbar {

        padding: 14px;

        margin-bottom: 16px;

        border-radius: 16px;

      }

      .card-summary {

        padding: 14px !important;

      }

      .card-stat {

        padding: 14px !important;

      }

      .card-stat,

      .card-summary {

        border-radius: 16px;

      }

      .form-control,

      .form-select {

        min-height: 42px;

        font-size: 14px;

      }

      .btn {

        min-height: 40px;

        padding: 6px 14px;

        font-size: 14px;

        border-radius: 12px;

      }

      .logo-box {

        padding: 16px;

      }

      .logo-box img {

        width: 58px;

      }

      .menu-link {

        padding: 11px 18px;

        font-size: 14px;

      }

      h1,
      h2,
      h3,
      h4,
      h5 {

        margin-bottom: .5rem;

      }

      /* HEADER DATE TIME */

      .content-header {

        margin-bottom: 14px;

      }

      .header-datetime {

        flex: 1;

        align-items: flex-end;

      }

      #headerTanggal {

        font-size: 12px;

      }

      #headerJam {

        font-size: 11px;

      }

      .mobile-btn {

        margin-bottom: 0 !important;

      }

      /* =========================
        PREMIUM DESIGN SYSTEM
      ========================= */

      .card-summary,
      .card-stat,
      .topbar {

        background: #fff;

        border: var(--border-soft);

        border-radius: var(--radius-card);

        box-shadow: var(--shadow-card);

        transition: all var(--transition);

      }

      .card-summary:hover,
      .card-stat:hover {

        box-shadow: var(--shadow-hover);

        transform: translateY(-2px);

      }

      h1,
      h2,
      h3,

      /* =========================

      /* =========================

      }

  </style>

</head>

<body>

    <!-- MODAL DASHBOARD -->

      <div class="modal-dialog modal-dialog-scrollable">

        <div class="modal-content">

        </div>

    </div>

    <!-- MODAL KONFIRMASI GLOBAL -->

    <div class="modal fade" id="modalKonfirmasiGlobal" tabindex="-1">

      <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

          <div class="modal-body text-center p-4">

            <div id="iconKonfirmasiGlobal" class="mb-3" style="
            font-size:60px;
            color:#dc3545;
          ">

              <i class="fa-solid fa-circle-question">
              </i>

            </div>

            <h5 class="fw-bold" id="judulKonfirmasiGlobal">

              Konfirmasi

            </h5>

            <div class="text-muted" id="pesanKonfirmasiGlobal">

              Pesan konfirmasi.

            </div>

          </div>

          <div class="modal-footer justify-content-center">

            <button class="btn btn-secondary" data-bs-dismiss="modal">

              Batal

            </button>

            <button class="btn btn-danger" id="btnYaKonfirmasiGlobal">

              Ya

            </button>

          </div>

        </div>

      </div>

    </div>

    <div id="toastContainer" class="
    position-fixed
    top-0
    end-0
    p-3" style="
    z-index:9999;
  ">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let modeForm = "tambah";

      let modeAbsensi = "baru";

      let draftAbsensi = {};

      let modeEditAbsensi = false;

      let dataRevisiPending = null;

      let tombolSedangProses = {};

      let callbackKonfirmasiGlobal = null;

      let attendanceCalendarRequestId = 0;

      let editGuruRow = null;
      let editKelasRow = null;

      let headerDateTimeInterval = null;

      function toggleSidebar() {

        if (

          !isMobileLayout()

        ) {

          return;

        }

        document

          .getElementById(
            "sidebar"
          )

          .classList

          .toggle(
            "show"
          );

      }

      /* =========================
         HEADER DATE & TIME
      ========================= */

      function updateHeaderDateTime() {

        const now = new Date();

        const namaHari = [
          "Minggu",
          "Senin",
          "Selasa",
          "Rabu",
          "Kamis",
          "Jumat",
          "Sabtu"
        ];

        const namaBulan = [
          "Januari",
          "Februari",
          "Maret",
          "April",
          "Mei",
          "Juni",
          "Juli",
          "Agustus",
          "September",
          "Oktober",
          "November",
          "Desember"
        ];

        const tanggal =

          `${namaHari[now.getDay()]}, ` +
          `${now.getDate()} ` +
          `${namaBulan[now.getMonth()]} ` +
          `${now.getFullYear()}`;

        const jam =

          String(now.getHours()).padStart(2, "0") + "." +
          String(now.getMinutes()).padStart(2, "0") + "." +
          String(now.getSeconds()).padStart(2, "0") +
          " WIB";

        const elTanggal =
          document.getElementById("headerTanggal");

        const elJam =
          document.getElementById("headerJam");

        if (elTanggal) {

          elTanggal.innerText = tanggal;

        }

        if (elJam) {

          elJam.innerText = jam;

        }

      }

      /* =========================
         RESPONSIVE LAYOUT
      ========================= */

      function isMobileLayout() {

        return window.innerWidth <= 768;

      }

      // ===== DRAFT ABSENSI ===== //

      function simpanDraftAbsensi() {

        draftAbsensi = {};

        document
          .querySelectorAll('input[id^="status_"]')
          .forEach(function (input) {

            if (input.value) {

              draftAbsensi[
                input.id.replace(
                  "status_",
                  ""
                )
              ] = input.value;

            }

          });

      }

      function pulihkanDraftAbsensi() {

        Object.keys(draftAbsensi)
          .forEach(function (nisn) {

            setStatusAbsen(
              nisn,
              draftAbsensi[nisn]
            );

          });

      }

      function updateResponsiveLayout() {

        const sidebar =
          document.getElementById("sidebar");

        const content =
          document.getElementById("contentArea");

        const mobileBtn =
          document.getElementById(
            "mobileToggle"
          );

        if (!sidebar || !content) {
          return;
        }

        if (isMobileLayout()) {

          content.style.marginLeft = "0";

          sidebar.classList.remove("show");

          if (mobileBtn) {

            const loginPage =
              document.getElementById(
                "loginUsername"
              );

            mobileBtn.style.display =
              loginPage
                ? "none"
                : "flex";

          }

        } else {

          content.style.marginLeft = "260px";

          sidebar.classList.remove("show");

          if (mobileBtn) {
            mobileBtn.style.display = "none";
          }

        }

      }

      function showToast(
        pesan,
        tipe = "success"
      ) {

        const container =

          document.getElementById(
            "toastContainer"
          );

        const toast =

          document.createElement(
            "div"
          );

        let warna =

          "text-bg-success";

        let icon =

          "fa-check-circle";

        if (tipe === "error") {

          warna =
            "text-bg-danger";

          icon =
            "fa-circle-xmark";

        }

        if (tipe === "warning") {

          warna =
            "text-bg-warning";

          icon =
            "fa-triangle-exclamation";

        }

        toast.className =

          `toast align-items-center ${warna} border-0 show mb-2`;

        toast.innerHTML =

          `
    <div class="d-flex">

      <div class="toast-body">

        <i class="fa-solid ${icon}"></i>

        ${pesan}

      </div>

    </div>
    `;

        container.appendChild(
          toast
        );

        setTimeout(function () {

          toast.remove();

        }, 3000);

      }

      function setButtonLoading(
        button,
        loadingText
      ) {

        button.dataset.originalHtml =
          button.innerHTML;

        button.disabled = true;

        button.innerHTML =

          '<span class="spinner-border spinner-border-sm me-2"></span>'

          +

          loadingText;

      }

      function resetButtonLoading(
        button
      ) {

        button.disabled = false;

        if (

          button.dataset.originalHtml

        ) {

          button.innerHTML =

            button.dataset.originalHtml;

        }

      }

      function lockButton(id) {

        if (

          tombolSedangProses[id]

        ) {

          return false;

        }

        tombolSedangProses[id] = true;

        return true;

      }

      function unlockButton(id) {

        delete tombolSedangProses[id];

      }

      function startButtonLoading(
        button,
        text = "Menyimpan..."
      ) {

        if (!button) {
          return;
        }

        button.disabled = true;

        button.dataset.originalText =
          button.innerHTML;

        button.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> '
          + text;

      }

      function successButtonLoading(
        button,
        text = "Tersimpan"
      ) {

        if (!button) {
          return;
        }

        button.innerHTML =
          '<i class="fa-solid fa-check"></i> '
          + text;

      }

      function stopButtonLoading(
        button
      ) {

        if (!button) {
          return;
        }

        button.disabled = false;

        if (
          button.dataset.originalText
        ) {

          button.innerHTML =
            button.dataset.originalText;

        }

      }

      function showConfirmModal(
        judul,
        pesan,
        callback
      ) {

        const modalElement =
          document.getElementById(
            "modalKonfirmasiGlobal"
          );

        if (!modalElement) {
          return;
        }

        callbackKonfirmasiGlobal =
          callback;

        document
          .getElementById(
            "judulKonfirmasiGlobal"
          )
          .innerText = judul;

        document
          .getElementById(
            "pesanKonfirmasiGlobal"
          )
          .innerText = pesan;

        const modal =
          bootstrap.Modal.getOrCreateInstance(
            modalElement
          );

        const btnYa =
          document.getElementById(
            "btnYaKonfirmasiGlobal"
          );

        btnYa.onclick = function () {

          const callbackSaatIni =
            callbackKonfirmasiGlobal;

          callbackKonfirmasiGlobal = null;

          modalElement.addEventListener(
            "hidden.bs.modal",
            function () {

              if (
                typeof callbackSaatIni ===
                "function"
              ) {
                callbackSaatIni();
              }

            },
            { once: true }
          );

          modal.hide();

        };

        modal.show();

      }

      function setHadirSemuaDisabled(status) {

        const btnAtas =
          document.getElementById(
            "btnHadirSemua"
          );

        const btnBawah =
          document.getElementById(
            "btnHadirSemuaBottom"
          );

        if (btnAtas) {
          btnAtas.disabled = status;
        }

        if (btnBawah) {
          btnBawah.disabled = status;
        }

      }

      function setSimpanAbsensiDisabled(
        status
      ) {

        const btnAtas =
          document.getElementById(
            "btnSimpanAbsensi"
          );

        const btnBawah =
          document.getElementById(
            "btnSimpanAbsensiBottom"
          );

        [btnAtas, btnBawah]
          .forEach(function (btn) {

            if (!btn) {
              return;
            }

            btn.disabled = status;

          });

      }

      function startSimpanAbsensiLoading(
        text = "Menyimpan..."
      ) {

        const btnAtas =
          document.getElementById(
            "btnSimpanAbsensi"
          );

        const btnBawah =
          document.getElementById(
            "btnSimpanAbsensiBottom"
          );

        [btnAtas, btnBawah]
          .forEach(function (btn) {

            if (!btn) {
              return;
            }

            startButtonLoading(
              btn,
              text
            );

          });

      }

      function successSimpanAbsensiLoading(
        text = "Tersimpan"
      ) {

        const btnAtas =
          document.getElementById(
            "btnSimpanAbsensi"
          );

        const btnBawah =
          document.getElementById(
            "btnSimpanAbsensiBottom"
          );

        [btnAtas, btnBawah]
          .forEach(function (btn) {

            if (!btn) {
              return;
            }

            successButtonLoading(
              btn,
              text
            );

          });

      }

      function stopSimpanAbsensiLoading() {

        const btnAtas =
          document.getElementById(
            "btnSimpanAbsensi"
          );

        const btnBawah =
          document.getElementById(
            "btnSimpanAbsensiBottom"
          );

        [btnAtas, btnBawah]
          .forEach(function (btn) {

            if (!btn) {
              return;
            }

            stopButtonLoading(
              btn
            );

          });

      }

      function setSimpanAbsensiText(
        html,
        kelas = "btn-primary"
      ) {

        const btnAtas =

          document.getElementById(
            "btnSimpanAbsensi"
          );

        const btnBawah =

          document.getElementById(
            "btnSimpanAbsensiBottom"
          );

        [btnAtas, btnBawah]
          .forEach(function (btn) {

            if (!btn) {
              return;
            }

            btn.innerHTML = html;

            btn.classList.remove(
              "btn-primary",
              "btn-success",
              "btn-warning"
            );

            btn.classList.add(
              kelas
            );

          });

      }

      /* =========================
         REKAP LOADING
      ========================= */

      function setRekapLoading(
        status
      ) {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          btn.disabled = status;

        }

      }

      function startRekapLoading() {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          startButtonLoading(
            btn,
            "Memuat..."
          );

        }

        const loading =

          document.getElementById(
            "loadingRekap"
          );

        if (loading) {

          loading.style.display =
            "block";

          const table =

            document.getElementById(
              "rekapTableWrapper"
            );

          if (table) {

            table.style.display =
              "none";

          }

        }

      }

      function stopRekapLoading() {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          stopButtonLoading(
            btn
          );

        }

        const loading =

          document.getElementById(
            "loadingRekap"
          );

        if (loading) {

          loading.style.display =
            "none";

          const table =

            document.getElementById(
              "rekapTableWrapper"
            );

          if (table) {

            table.style.display =
              "block";

          }

        }

      }

      function successRekapLoading() {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          successButtonLoading(
            btn,

        });

      /* =========================================================

        ========================================================= */

      let masterDataBundle = null;
      let masterDataBundleLoading = false;
      let masterDataBundleQueue = [];


      /**
       * Mengambil seluruh Master Data dalam satu request.
       */
      function loadMasterDataBundle(callback) {

        if (masterDataBundle) {

          if (typeof callback === "function") {
            callback(masterDataBundle);
          }

          return;
        }

        if (masterDataBundleLoading) {

          if (typeof callback === "function") {
            masterDataBundleQueue.push(callback);
          }

          return;
        }

        masterDataBundleLoading = true;

        if (typeof callback === "function") {
          masterDataBundleQueue.push(callback);
        }

        google.script.run
          .withSuccessHandler(function (bundle) {

            masterDataBundle =
              bundle || {};

            masterDataBundleLoading =
              false;

            const queue =
              masterDataBundleQueue.slice();

            masterDataBundleQueue = [];

            queue.forEach(function (fn) {
              try {
                fn(masterDataBundle);
              } catch (error) {
                console.error(error);
              }
            });

          })
          .withFailureHandler(function (error) {

            masterDataBundleLoading =
              false;

            masterDataBundleQueue = [];

            console.error(
              "Gagal memuat Master Data Bundle:",
              error
            );

            showToast(
              "Gagal memuat Master Data",
              "error"
            );

          })
          .getMasterDataBundle();
      }


      /**
       * Dipanggil setelah Master Data berubah.
       *
       * Karena perubahan terjadi di server,
       * frontend harus membuang bundle lamanya.
       */
      function invalidateFrontendMasterData() {

        masterDataBundle = null;

      }

      function loadStudents() {

        google.script.run

          .withSuccessHandler(function (data) {

            data = JSON.parse(data);

            const header = data.shift();

            data.sort(function (a, b) {

              const kelas = String(a[6]).localeCompare(
                String(b[6]),
                'id',
                {
                  numeric: true,
                  sensitivity: 'base'
                }
              );

              if (kelas !== 0) {
                return kelas;
              }

              return String(a[2]).localeCompare(
                String(b[2]),
                'id',
                {
                  sensitivity: 'base'
                }
              );

            });

            allStudents = data;

            isiFilterKelas([header, ...allStudents]);

            filterSiswa();

            const roleSiswa =
              localStorage.getItem("wongmit_role") || "";

            const grupTambah =
              document.getElementById("grupTambahSiswa");

            if (
              grupTambah &&
              !roleSiswa.includes("Admin") &&
              !roleSiswa.includes("KepalaSekolah")
            ) {

              grupTambah.classList.add("d-none");

            }

          })

          .withFailureHandler(function (error) {

            console.error(error);

            showToast(
              "Gagal mengambil data siswa",
              "error"
            );

          })

          .getStudents();

      }

      function filterMapel() {

          var row = rows[i];
          if (row.cells.length === 1) continue;
          var text = row.textContent.toLowerCase();
          row.style.display = text.indexOf(keyword) !== -1 ? '' : 'none';

          );

          btn

          roles.push('Admin');
        }

        if (document.getElementById('roleKepsek').checked) {
          roles.push('KepalaSekolah');
        }

        if (document.getElementById('roleWali').checked) {
          roles.push('WaliKelas');
        }

        if (document.getElementById('roleMapel').checked) {
          roles.push('GuruMapel');
        }

          id:

            modeForm === "edit"
              ? document.getElementById('idGuru').value
              : Date.now(),

          namaGuru:
            document.getElementById('namaGuru').value,

          username:
            document.getElementById('usernameGuru').value,

          password:
            document.getElementById('passwordGuru').value,

          role:
            roles.join(','),

            document.getElementById('statusGuru').value

            .withSuccessHandler(function () {

              unlockButton(
                "simpanGuru"

                btn

                  btn

                "simpanGuru"
              );

                btn
              );

              console.error(error);

                "Gagal memperbarui data guru",
                "error"
              );

            .updateTeacher(

            );

              );

              showToast(

      function isiFilterKelas(data) {

        const select =
          document.getElementById('filterKelas');

        if (!select) return;

        const kelasUnik = [];

        data.slice(1).forEach(function (row) {

          const kelas = row[6];

          if (
            kelas &&
            !kelasUnik.includes(kelas)
          ) {
            kelasUnik.push(kelas);
          }

        });

        kelasUnik.sort();

        select.innerHTML =
          '<option value="">Semua Kelas</option>';

        kelasUnik.forEach(function (kelas) {

          select.innerHTML += `
      <option value="${kelas}">
        ${kelas}
      </option>
    `;

        });

      }

        allStudents.forEach(function (row) {

      function siapkanDataExportSiswa(kelas) {

        const baris = [];

        allStudents.forEach(function (row) {

          const kelasSiswa = row[6];

          if (
            kelas &&
            kelas !== "" &&
            String(kelasSiswa) !== String(kelas)
          ) {

            return;

          }

          baris.push([

            baris.length + 1,
            row[1],
            row[2],
            row[4],
            formatTanggal(row[5]),
            row[3],
            row[6],
            row[7]

          ]);

        });

        return baris;

      }

      function downloadSiswaExcel() {

        const kelas =
          document.getElementById('kelasDownloadSiswa').value;

        const btn =
          document.getElementById('btnDownloadSiswaExcel');

        setButtonLoading(
          btn,
          "Memproses..."
        );

        try {

          const baris =
            siapkanDataExportSiswa(kelas);

          const kelasText =
            kelas || "Semua Kelas";

          const tanggalExport =
            new Date().toLocaleString(
              "id-ID",
              {
                day: "2-digit",
                month: "long",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }
            ).replace(" pukul ", ", ") + " WIB";

          const namaPengunduh =
            localStorage.getItem("wongmit_nama") || "-";

          google.script.run

            .withSuccessHandler(function (settings) {

              const tahunAjaran =
                settings.tahunAjaran || "-";

              const wsData = [

                ["DATA SISWA"],
                ["MIS TANBIHUL ATHFAL"],
                ["TAHUN AJARAN " + tahunAjaran],
                [],
                ["Kelas", "", kelasText, "", "Tanggal Export", tanggalExport, "", ""],
                ["Jumlah", "", baris.length + " siswa", "", "Didownload oleh", namaPengunduh, "", ""],
                [],
                ["No", "NISN", "Nama", "Tempat Lahir", "Tanggal Lahir", "JK", "Kelas", "Status"]

              ];

              baris.forEach(function (row) {
                wsData.push(row);
              });

              const ws =
                XLSX.utils.aoa_to_sheet(wsData);

                ws['!views'] = [
                  { showGridLines: false }
                ];

              ws['!merges'] = [

                { s: { r: 0, c: 0 }, e: { r: 0, c: 7 } },
                { s: { r: 1, c: 0 }, e: { r: 1, c: 7 } },
                { s: { r: 2, c: 0 }, e: { r: 2, c: 7 } },
                { s: { r: 4, c: 0 }, e: { r: 4, c: 1 } },
                { s: { r: 4, c: 5 }, e: { r: 4, c: 7 } },
                { s: { r: 5, c: 0 }, e: { r: 5, c: 1 } },
                { s: { r: 5, c: 5 }, e: { r: 5, c: 7 } }

              ];

              ws['!cols'] = [

                { wch: 4 },   // No
                { wch: 13 },  // NISN
                { wch: 43 },  // Nama
                { wch: 15 },  // Tempat Lahir
                { wch: 18 },  // Tanggal Lahir
                { wch: 6 },   // JK
                { wch: 10 },  // Kelas
                { wch: 10 }   // Status

              ];

              for (let r = 0; r <= 2; r++) {

                const addr =
                  XLSX.utils.encode_cell({ r: r, c: 0 });

                if (ws[addr]) {

                  ws[addr].s = {

                    font: {
                      name: "Cambria",
                      bold: true,
                      sz: (r === 0) ? 14 : (r === 1 ? 14 : 12)
                    },

                    alignment: {
                      horizontal: "center",
                      vertical: "center"
                    }

                  };

                }

              }

              const labelCells = ["A5", "A6", "E5", "E6"];

              labelCells.forEach(function (addr) {

                if (ws[addr]) {

                  ws[addr].s = {
                    font: {
                      name: "Cambria",
                      bold: true,
                      sz: 11
                    }
                  };

                }

              });

              const valueCells = ["C5", "C6", "F5", "F6"];

              valueCells.forEach(function (addr) {

                if (ws[addr]) {

                  ws[addr].s = {
                    font: {
                      name: "Cambria",
                      sz: 11
                    }
                  };

                }

              });

              const headerRowIdx = 7;

              for (let c = 0; c < 8; c++) {

                const addr =
                  XLSX.utils.encode_cell({ r: headerRowIdx, c: c });

                if (ws[addr]) {

                  ws[addr].s = {

                    font: {
                      name: "Cambria",
                      bold: true,
                      color: { rgb: "FFFFFF" },
                      sz: 12 
                    },

                    fill: { 
                      fgColor: { rgb: "4A90D9" }
                    }

                  };

                }

              }

              for (let i = 0; i < baris.length; i++) {

                const warna =
                  (i % 2 === 0) ? "FFFFFF" : "F2F6FC";

                for (let c = 0; c < 8; c++) {

                  const addr =
                    XLSX.utils.encode_cell({ r: headerRowIdx + 1 + i, c: c });

                  if (ws[addr]) {

                    ws[addr].s = {
                      font: {
                        name: "Cambria",
                        sz: 12
                      },

                      fill: {
                        fgColor: { rgb: warna }
                      },

                      border: {
                        top: {
                          style: "thin",
                          color: { rgb: "B7B7B7" }
                        },
                        bottom: {
                          style: "thin",
                          color: { rgb: "B7B7B7" }
                        },
                        left: {
                          style: "thin",
                          color: { rgb: "B7B7B7" }
                        },
                        right: {
                          style: "thin",
                          color: { rgb: "B7B7B7" }
                        }
                      }
                    };

                  }

                }

              }

              const wb =
                XLSX.utils.book_new();

              XLSX.utils.book_append_sheet(
                wb,
                ws,
                "Data Siswa"
              );

              XLSX.writeFile(
                wb,
                "Data_Siswa_" + (kelas || "SemuaKelas") + ".xlsx"
              );

              resetButtonLoading(btn);

              bootstrap.Modal.getInstance(
                document.getElementById('modalDownloadSiswa')
              ).hide();

            })

            .withFailureHandler(function (error) {

              console.error(error);

              resetButtonLoading(btn);

              showToast(
                "Gagal mengambil pengaturan tahun ajaran",
                "error"
              );

            })

            .getAcademicSettings(
              localStorage.getItem(
                "wongmit_session"
              )
            );

        } catch (error) {

          console.error(error);

          resetButtonLoading(btn);

          showToast(
            "Gagal membuat file Excel",
            "error"
          );

        }

      }

        <label class="form-check-label">

          ${h}

        </label>

      </div>

    `;

        }).join("");

      }

      /* =========================

      function loadPage(pageName) {

        console.log("Memuat halaman:", pageName);

        const role =

          localStorage.getItem(
            "wongmit_role"
          ) || "";

        const roles =
          role.split(",");

        if (

          pageName === "page_pengaturan"

          &&

          !roles.includes("Admin")

        ) {

          showToast(
            "Pengaturan hanya dapat diakses oleh Admin",
            "warning"
          );

          return;

        }

        if (

          pageName === "page_guru"

          &&

          !roles.includes("Admin")

          &&

          !roles.includes("KepalaSekolah")

        ) {

          showToast(
            "Anda tidak memiliki akses ke halaman ini",
            "warning"
          );

          return;

        }

        if (

          pageName === "page_kelas"

          &&

          !roles.includes("Admin")

          &&

          !roles.includes("KepalaSekolah")

        ) {

          showToast(
            "Anda tidak memiliki akses ke halaman ini",
            "warning"
          );

          return;

        }

        if (

          pageName === "page_gurumengajar"

          &&

          !roles.includes("Admin")

          &&

          !roles.includes("KepalaSekolah")

        ) {

          showToast(
            "Anda tidak memiliki akses ke halaman ini",
            "warning"
          );

          return;

        }

        google.script.run
          .withSuccessHandler(function (html) {

            console.log("HTML diterima");

            document.getElementById('mainContent').innerHTML = html;

            updateResponsiveLayout();

            if (pageName === "page_login") {
              loadLoginUsernameHistory();
            }

            if (

              isMobileLayout()

            ) {

              document

                .getElementById(
                  "sidebar"
                )

                .classList.remove(
                  "show"
                );

            }

            if (pageName === 'page_dashboard') {
              loadDashboard();
            }

            if (pageName === 'page_siswa') {
              loadStudents();
            }

            if (pageName === 'page_guru') {
              loadTeachers();
            }

            if (pageName === 'page_kelas') {

              loadClasses();

              setTimeout(function () {

                loadWaliKelas();

              }, 300);

            }

            if (pageName === 'page_absensi') {

              setTimeout(function () {

                initAbsensiTanggal();

                loadKelasAbsensi();

              }, 300);

            }

            if (pageName === 'page_rekap') {

              loadRekap();

            }

            if (pageName === 'page_gurumengajar') {

              loadGuruMengajar();

              loadGuruDropdown();

              loadKelasDropdown();

            }

            if (

              pageName === "page_pengaturan"

            ) {

              loadAcademicSettings();

            }

              "jk"
            ).value =
              data.jk ?? "L";
      
            document.getElementById(
              "tempatLahir"
            ).value =
              data.tempatLahir ?? "";
      
            /* =========================
               TANGGAL LAHIR
               INPUT TYPE DATE HARUS
               YYYY-MM-DD
            ========================= */
      
            let tanggalLahir = "";
      
            if (data.tanggalLahir) {
      
              const nilai =
                String(
                  data.tanggalLahir
                ).trim();
      
              /*
               * Jika sudah YYYY-MM-DD,
               * gunakan langsung.
               */
              if (
                /^\d{4}-\d{2}-\d{2}$/.test(
                  nilai
                )
              ) {
      
                tanggalLahir = nilai;
      
              }
      
              /*
               * Jika berbentuk ISO Date:
               * 2020-01-15T00:00:00.000Z
               */
              else {
      
                const match =
                  nilai.match(
                    /^(\d{4}-\d{2}-\d{2})/
                  );
      
                if (match) {
      
                  tanggalLahir =
                    match[1];
      
                }
      
                /*
                 * Fallback untuk format
                 * tanggal lain yang masih
                 * dapat dibaca browser.
                 */
                else {
      
                  const parsedDate =
                    new Date(nilai);
      
                  if (
                    !isNaN(
                      parsedDate.getTime()
                    )
                  ) {
      
                    const tahun =
                      parsedDate
                        .getFullYear()
                        .toString()
                        .padStart(4, "0");
      
                    const bulan =
                      String(
                        parsedDate.getMonth() + 1
                      ).padStart(2, "0");
      
                    const hari =
                      String(
                        parsedDate.getDate()
                      ).padStart(2, "0");
      
                    tanggalLahir =
                      tahun +
                      "-" +
                      bulan +
                      "-" +
                      hari;
      
                  }
      
                }
      
              }
      
            }
      
            document.getElementById(
              "tanggalLahir"
            ).value =
              tanggalLahir;
      
            document.getElementById(
              "kelas"
            ).value =
              data.kelas ?? "";
      
            document.getElementById(
              "status"
            ).value =
              data.status ?? "Aktif";

            bootstrap.Modal
              .getOrCreateInstance(
                document.getElementById(
                  "modalSiswa"
                )
              )
              .show();

            );
      
            showToast(
              "Gagal mengambil data siswa",
              "error"
            );
      
          })

      function filterSiswa() {

        const keyword =
          document
            .getElementById("searchSiswa")
            .value
            .trim()
            .toLowerCase();

        const kelasFilter =
          document
            .getElementById("filterKelas")
            .value
            .trim()
            .toLowerCase();

        let hasil = allStudents.filter(function (row) {

          const text = [
            row[1],
            row[2]
          ].join(" ").toLowerCase();

          const cocokNama =
            text.includes(keyword);

          const cocokKelas =
            kelasFilter === "" ||
            String(row[6]).toLowerCase() === kelasFilter;

          return cocokNama && cocokKelas;

        });

        if (currentSortColumn !== null) {

          hasil.sort(function (a, b) {

            let nilaiA = a[currentSortColumn] ?? "";
            let nilaiB = b[currentSortColumn] ?? "";

            if (currentSortColumn === 0 || currentSortColumn === 1) {

              nilaiA = Number(nilaiA);
              nilaiB = Number(nilaiB);

              return currentSortDirection === "asc"
                ? nilaiA - nilaiB
                : nilaiB - nilaiA;

            }

            return currentSortDirection === "asc"

              ? String(nilaiA).localeCompare(
                String(nilaiB),
                "id",
                {
                  numeric: true,
                  sensitivity: "base"
                }
              )

              : String(nilaiB).localeCompare(
                String(nilaiA),
                "id",
                {
                  numeric: true,
                  sensitivity: "base"
                }
              );

          });

        }

        renderStudentsTable(hasil);

      }

      function sortTable(column) {

        if (currentSortColumn === column) {

          currentSortDirection =
            currentSortDirection === 'asc'
              ? 'desc'
              : 'asc';

        } else {

          currentSortColumn = column;
          currentSortDirection = 'asc';

        }

        filterSiswa();

      }

      function getSortIcon(column) {

        if (currentSortColumn !== column) {
          return "↕";
        }

        return currentSortDirection === "asc"
          ? "▲"
          : "▼";

      }

            .innerHTML =
            "---";

          return;

        }

        google.script.run
          .withSuccessHandler(function (context) {

            if (
              requestId !==
              attendanceCalendarRequestId
            ) {
              return;
            }
            
            if (
              studentRequestId !==
              absensiStudentRequestId
            ) {
              return;
            }
            
            if (
              context &&
              context.shouldWarn
            ) {

              const isHariLibur =
                !!context.isSchoolHoliday;

              const isTidakAdaJadwalGuru =
                context.warningType === "teacher_schedule";

              let judulPeringatan =
                "Periksa Absensi";

              let pesan =
                "Periksa kembali tanggal dan jadwal mengajar yang dipilih.\n\nApakah Anda tetap ingin melanjutkan absensi?";

              if (
                isHariLibur &&
                isTidakAdaJadwalGuru
              ) {

                judulPeringatan =
                  "Periksa Hari & Jadwal Mengajar";

                pesan =
                  "Tanggal " +
                  tanggal +
                  " adalah hari libur sekolah (" +
                  context.hari +
                  "). Anda juga tidak memiliki jadwal mengajar untuk kelas " +
                  kelas +
                  " pada hari tersebut.\n\nPeriksa kembali tanggal dan jadwal Anda. Apakah Anda tetap ingin melanjutkan absensi?";

              } else if (
                isTidakAdaJadwalGuru
              ) {

                judulPeringatan =
                  "Periksa Jadwal Mengajar";

                pesan =
                  "Anda tidak memiliki jadwal mengajar untuk kelas " +
                  kelas +
                  " pada hari " +
                  context.hari +
                  ". Periksa kembali tanggal yang dipilih.\n\nApakah Anda tetap ingin melanjutkan absensi?";

              } else if (
                isHariLibur
              ) {

                judulPeringatan =
                  "Hari Libur Sekolah";

                pesan =
                  "Tanggal " +
                  tanggal +
                  " adalah hari libur sekolah (" +
                  context.hari +
                  ").\n\nApakah Anda tetap ingin melanjutkan absensi?";

              }

              const modalElement =
                document.getElementById(
                  "modalKonfirmasiGlobal"
                );

              if (
                modalElement &&
                modalElement.classList.contains("show")
              ) {
                return;
              }

              showConfirmModal(
                judulPeringatan,
                pesan,
                function () {
                  loadExistingAttendanceCore(
                    studentRequestId
                  );
                }
              );

              return;

            }

            loadExistingAttendanceCore(
              studentRequestId
            );

          })
          .withFailureHandler(function (error) {

            if (
              studentRequestId !==
              absensiStudentRequestId
            ) {
              return;
            }
          
            console.error(error);

            showToast(
              "Gagal memeriksa kalender sekolah. Silakan coba lagi.",
              "error"
            );

          })
          .getAttendanceCalendarContext(
            kelas,
            tanggal,
            localStorage.getItem(
              "wongmit_nama"
            ) || ""
          );

      }

      function loadExistingAttendanceCore(
        studentRequestId
      ) {
      
        if (
          studentRequestId == null
        ) {
          studentRequestId =
            absensiStudentRequestId;
        }
      
        if (
          studentRequestId !==
          absensiStudentRequestId
        ) {
          return;
        }
      
        const kelas =
          document.getElementById(
            "filterKelasAbsensi"
          ).value;
      
        const tanggal =
          document.getElementById(
            "tanggalAbsensi"
          ).value;
      
        if (!kelas || !tanggal) {
          return;
        }
      
        google.script.run
          .withSuccessHandler(function (result) {
      
            if (
              studentRequestId !==
              absensiStudentRequestId
            ) {
              return;
            }
      
            const kelasSekarang =
              document.getElementById(
                "filterKelasAbsensi"
              ).value;
      
            const tanggalSekarang =
              document.getElementById(
                "tanggalAbsensi"
              ).value;
      
            if (
              kelasSekarang !== kelas ||
              tanggalSekarang !== tanggal
            ) {
              return;
            }
      
            result =
              JSON.parse(result);
      
            if (!result.info.ditemukan) {
      
              modeAbsensi = "baru";
      
              resetStatusAbsensi();
              pulihkanDraftAbsensi();
              modeEditAbsensi = false;
      
              setSimpanAbsensiText(
                '<i class="fa-solid fa-floppy-disk"></i> Simpan',
                "btn-primary"
              );
      
              setSimpanAbsensiDisabled(false);
              setHadirSemuaDisabled(false);
      
              document.getElementById(
                "infoAbsenWaktu"
              ).innerHTML =
                "--/--/---- --:--:--";
      
              document.getElementById(
                "infoAbsenOleh"
              ).innerHTML =
                "---";
      
              return;
            }
      
            const waktuAbsen =
              new Date(
                result.info.timestamp
              );
      
            const pad =
              function (angka) {
                return String(
                  angka
                ).padStart(2, "0");
              };
      
            const waktuFormat =
              pad(waktuAbsen.getDate()) +
              "/" +
              pad(
                waktuAbsen.getMonth() + 1
              ) +
              "/" +
              waktuAbsen.getFullYear() +
              " " +
              pad(
                waktuAbsen.getHours()
              ) +
              ":" +
              pad(
                waktuAbsen.getMinutes()
              ) +
              ":" +
              pad(
                waktuAbsen.getSeconds()
              );
      
            document.getElementById(
              "infoAbsenWaktu"
            ).innerHTML =
              waktuFormat;
      
            document.getElementById(
              "infoAbsenOleh"
            ).innerHTML =
              result.info.inputOleh;
      
            modeAbsensi =
              "revisi";
      
            modeEditAbsensi =
              false;
      
            setSimpanAbsensiText(
              '<i class="fa-solid fa-pen"></i> Revisi Absen',
              "btn-primary"
            );
      
            setSimpanAbsensiDisabled(
              false
            );
      
            setHadirSemuaDisabled(
              true
            );
      
            modeEditAbsensi =
              true;
      
            result.data.forEach(
              function (item) {
      
                setStatusAbsen(
                  item.nisn,
                  item.status
                );
      
              }
            );
      
            modeEditAbsensi =
              false;
      
          })
          .withFailureHandler(
            function (error) {
      
              if (
                studentRequestId !==
                absensiStudentRequestId
              ) {
                return;
              }
      
              console.error(error);
      
              showToast(
                "Gagal memuat data absensi.",
                "error"
              );
      
            }
          )
          .getAttendanceByClassAndDate(
            kelas,
            tanggal
          );
      
      }

      function initAbsensiTanggal() {

        const today =
          new Date();

        const tanggal =

          today
            .toISOString()

      function updateHariAbsensi() {

        const tanggal =
          document
            .getElementById(
              'tanggalAbsensi'
            )
            .value;

        if (!tanggal) {
          return;
        }

        const hariLocale =
          new Intl.DateTimeFormat(
            'id-ID',
            { weekday: 'long' }
          ).format(
            new Date(tanggal)
          );

        const hari =
          hariLocale === 'Minggu'
            ? 'Ahad'
            : hariLocale;

        document
          .getElementById(
            'hariAbsensi'
          )
          .value = hari;

      }

      function setStatusAbsen(
        nisn,
        status
      ) {

        if (

          modeAbsensi === "revisi"

          &&

          !modeEditAbsensi

        ) {

          return;

        }

        ["H", "S", "I", "A"]
          .forEach(function (kode) {

            const btn =
              document.getElementById(
                kode + "_" + nisn
              );

            if (btn) {

              btn.className =
                "btn btn-outline-secondary btn-sm";

            }

          });

        let kode = "H";

        if (status === "Sakit") {
          kode = "S";
        }

        if (status === "Izin") {
          kode = "I";
        }

        if (status === "Alpa") {
          kode = "A";
        }

        const btn =
          document.getElementById(
            kode + "_" + nisn
          );

        if (btn) {

          if (status === "Hadir") {

            btn.className =
              "btn btn-success btn-sm";

          }

          if (status === "Sakit") {

            btn.className =
              "btn btn-primary btn-sm";

          }

          if (status === "Izin") {

            btn.className =
              "btn btn-warning btn-sm";

          }

          if (status === "Alpa") {

            btn.className =
              "btn btn-danger btn-sm";

          }

        }

        const input =
          document.getElementById(
            "status_" + nisn
          );

        if (!input) {
          return;
        }

        input.value = status;

        const row =
          input.closest("tr");

        if (row) {

          row.classList.remove(
            "table-danger"
          );

        }

        const card =
          input.closest(".absensi-card");

        if (card) {

          card.classList.remove(
            "border-danger"
          );

        }

      }

      function hadirSemua() {

      function filterSiswaAbsensi() {

        const keyword =

          document
            .getElementById(
              "cariSiswaAbsensi"
            )
            .value
            .toLowerCase();

        const rows =
          isMobileLayout()

            ?

            document.querySelectorAll(
              "#mobileAbsensiContainer .absensi-card"
            )

            :

            document.querySelectorAll(
              "#tableAbsensi tr"
            );

        rows.forEach(function (row) {

          const text =

            row.innerText
              .toLowerCase();

          row.style.display =

            text.includes(
              keyword
            )

              ? ""

              : "none";

        });

      }

      function simpanAbsensi() {

        if (

          modeAbsensi === "revisi"

          &&

          !modeEditAbsensi

        ) {

          mulaiRevisiAbsensi();

          return;

        }

        const btnSimpan =

          document.getElementById(
            "btnSimpanAbsensi"
          );

        const tanggal =

          document.getElementById(
            "tanggalAbsensi"
          ).value;

        const kelas =

          document.getElementById(
            "filterKelasAbsensi"
          ).value;

        if (!tanggal || !kelas) {

          showToast(
            "Pilih tanggal dan kelas terlebih dahulu",
            "warning"
          );

          return;

        }

        const rows =
          isMobileLayout()
            ?
            document.querySelectorAll(
              "#mobileAbsensiContainer .absensi-card"
            )
            :
            document.querySelectorAll(
              "#tableAbsensi tr"
            );

        const data = [];

        let adaYangKosong = false;

        rows.forEach(function (row) {

          const hiddenInput =

            row.querySelector(
              'input[id^="status_"]'
            );

          if (!hiddenInput) {
            return;
          }

          const nisn =

            hiddenInput.id.replace(
              "status_",
              ""
            );

          const status =
            hiddenInput.value;

          if (!status) {

            adaYangKosong = true;

            return;

          }

          const nama =

            row
              .querySelector(".nama-siswa")
              .innerText
              .trim();

          data.push({

            tanggal: tanggal,

            nisn: nisn,

            nama: nama,

            kelas: kelas,

            status: status,

            inputOleh:

              localStorage.getItem(
                "wongmit_nama"
              )

          });

        });

        if (adaYangKosong) {

          rows.forEach(function (row) {

            const input =
              row.querySelector(
                'input[id^="status_"]'
              );

            if (!input || input.value) {
              return;
            }

            row.classList.add(
              "table-danger"
            );

            const card =
              row.closest(".absensi-card");

            if (card) {

              card.classList.add(
                "border-danger"
              );

            }

          });

          const siswaKosong =

            document.querySelector(

              'input[id^="status_"][value=""]'

            );

          if (siswaKosong) {

            const target =
              siswaKosong.closest("tr")
              ||
              siswaKosong.closest(".absensi-card");

            if (target) {

              target.scrollIntoView({

                behavior: "smooth",

                block: "center"

              });

            }

          }

          const modal =

            new bootstrap.Modal(

              document.getElementById(
                "modalWarningAbsensi"
              )

            );

          modal.show();

          showToast(
            "Lengkapi absensi yang masih kosong",
            "warning"
          );

          return;

        }

        if (data.length === 0) {

          showToast(
            "Belum ada absensi yang dipilih",
            "warning"
          );

          return;

        }

        const proses =

          modeAbsensi === "revisi"

            &&

            modeEditAbsensi

            ?

            "revisi"

            :

            "baru";

        if (proses === "baru") {

          setSimpanAbsensiDisabled(
            true
          );

          startSimpanAbsensiLoading(
            "Menyimpan..."
          );

          google.script.run
            .withSuccessHandler(function () {

              // Hapus draft karena sudah berhasil disimpan
              draftAbsensi = {};

              successSimpanAbsensiLoading(
                "Tersimpan"
              );

              showToast(
                "Absensi berhasil disimpan"
              );

              loadExistingAttendance();

            })
            .withFailureHandler(function (error) {

              stopSimpanAbsensiLoading();

              console.error(error);

              setSimpanAbsensiDisabled(
                false
              );

              showToast(
                "Gagal menyimpan absensi",
                "error"
              );

            })
            .saveAttendance(data);

        } else {

          dataRevisiPending = {

            kelas: kelas,

            tanggal: tanggal,

            data: data

          };

          konfirmasiSimpanRevisi();

          return;

        }

      }

      function saveLoginUsername(username) {

        if (!username) {
          return;
        }

        let list =
          JSON.parse(
            localStorage.getItem(
              "wongmit_login_history"
            ) || "[]"
          );

        list =
          list.filter(function (item) {
            return item !== username;
          });

        list.unshift(username);

        if (list.length > 10) {
          list = list.slice(0, 10);
        }

        localStorage.setItem(
          "wongmit_login_history",
          JSON.stringify(list)
        );

      }

      function loadLoginUsernameHistory() {

        const box =
          document.getElementById(
            "loginHistory"
          );

        if (!box) {
          return;
        }

        const list =
          JSON.parse(
            localStorage.getItem(
              "wongmit_login_history"
            ) || "[]"
          );

        if (list.length === 0) {

          box.style.display = "none";

          return;

        }

        box.innerHTML = "";

        list.forEach(function (username) {

          const item =
            document.createElement("button");

          item.type = "button";

          item.className =
            "list-group-item list-group-item-action";

          item.textContent = username;

          item.onclick = function () {

            document.getElementById(
              "loginUsername"
            ).value = username;

            box.style.display = "none";

            document.getElementById(
              "loginPassword"
            ).focus();

          };

          box.appendChild(item);

        });

      }

      function applyRoleMenu() {

        const role =

          localStorage.getItem(
            "wongmit_role"
          ) || "";

        const roles =
          role.split(",");

        const semuaMenu = [

          "menuSiswa",
          "menuGuru",
          "menuKelas",
          "menuGuruMengajar",
          "menuAbsensi",
          "menuRekap",
          "menuPengaturan"

        ];

        semuaMenu.forEach(function (id) {

          const menu =
            document.getElementById(id);

          if (menu) {

            menu.style.display = "none";

          }

        });

        if (

          roles.includes("Admin")

        ) {

          semuaMenu.forEach(function (id) {

            const menu =
              document.getElementById(id);

            if (menu) {

              menu.style.display = "";

            }

          });

          return;

        }

        if (

          roles.includes("KepalaSekolah")

        ) {

          [

            "menuSiswa",
            "menuGuru",
            "menuKelas",
            "menuGuruMengajar",
            "menuAbsensi",
            "menuRekap"

          ]

            .forEach(function (id) {

              const menu =
                document.getElementById(id);

              if (menu) {

                menu.style.display = "";

              }

            });

          return;

        }

        if (

          roles.includes("WaliKelas")

        ) {

          [

            "menuSiswa",
            "menuAbsensi",
            "menuRekap"

          ]

            .forEach(function (id) {

              const menu =
