<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>WONG MIT</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {

      --primary: #0b2d6b;

      --gold: #d4af37;

      --bg: #f4f7fb;

      --white: #ffffff;

      --radius-card: 22px;

      --radius-input: 14px;

      --radius-button: 14px;

      --shadow-card:
        0 10px 28px rgba(15, 23, 42, .06);

      --shadow-hover:
        0 14px 34px rgba(15, 23, 42, .10);

      --border-soft:
        1px solid rgba(15, 23, 42, .05);

      --transition: .20s ease;

    }

    * {
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
    }

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      -webkit-text-size-adjust: 100%;

      text-size-adjust: 100%;

    }

    #appRoot {

      position: relative;

      width: 100%;

      min-height: 100vh;

      background: var(--bg);

      overflow-x: hidden;

    }

    .sidebar {

      position: fixed;

      left: 0;

      top: 0;

      bottom: 0;

      width: 260px;

      height: 100dvh;

      min-height: 100dvh;

      background: var(--primary);

      color: white;

      overflow-y: auto;

      overflow-x: hidden;

      z-index: 1000;

    }

    .logo-box {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, .15);
    }

    .logo-box img {
      width: 70px;
      margin-bottom: 10px;
    }

    .logo-box h5 {
      margin: 0;
      font-weight: 700;
    }

    .logo-box small {
      color: #ddd;
    }

    .menu-title {
      font-size: 12px;
      color: #cfcfcf;
      padding: 15px 20px 5px;
      text-transform: uppercase;
    }

    .menu-link {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      transition: .3s;
    }

    .menu-link:hover {
      background: rgba(255, 255, 255, .12);
      color: white;
    }

    .menu-link i {
      width: 25px;
    }

    .content {

      margin-left: 260px;

      width: calc(100% - 260px);

      min-height: 100dvh;

      padding: 22px;

      transition: .25s ease;

      overflow-x: hidden;

    }

    /* =========================
       P7-D.3 — LOGIN LAYOUT ISOLATION
    ========================= */

    body.login-active .content {
      margin-left: 0 !important;
      width: 100% !important;
    }

    .topbar {

      background: #fff;

      padding: 24px;

      border-radius: 24px;

      box-shadow:
        0 12px 30px rgba(15, 23, 42, .06);

      margin-bottom: 24px;

    }

    .topbar h3 {

      font-weight: 700;

      color: #0f172a;

      letter-spacing: -.02em;

    }

    .topbar .text-muted {

      color: #64748b !important;

    }

    .card-stat {

      background: #fff;

      border: none;

      border-radius: 22px;

      cursor: pointer;

      box-shadow:
        0 10px 28px rgba(15, 23, 42, .06);

      transition:
        all .18s ease;

    }

    .card-stat:hover {

      transform:
        translateY(-4px) scale(1.02);

      box-shadow:
        0 18px 40px rgba(15, 23, 42, .12);

    }

    .icon-box {

      width: 54px;

      height: 54px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 20px;

      color: #fff;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .25);

    }

    .bg-gold {
      background: #d4af37;
    }

    .bg-success2 {
      background: #198754;
    }

    .bg-danger2 {
      background: #dc3545;
    }

    .bg-primary2 {

      background:
        linear-gradient(135deg,
          #2563eb,
          #1d4ed8);

    }

    .bg-gold {

      background:
        linear-gradient(135deg,
          #f6c453,
          #e0a800);

    }

    .bg-success2 {

      background:
        linear-gradient(135deg,
          #22c55e,
          #16a34a);

    }

    .bg-danger2 {

      background:
        linear-gradient(135deg,
          #ef4444,
          #dc2626);

    }

    .card-summary {

      background: #fff;

      border: none;

      border-radius: 22px;

      box-shadow:
        0 10px 28px rgba(15, 23, 42, .06);

    }

    /* =========================
      DASHBOARD ATTENDANCE LOADING
    ========================= */

    #modalDashboard .modal-title {
      margin-bottom: 0 !important;
      line-height: 1.1;
    }

    #modalDashboard #dashboardAttendanceDate {
      display: block;
      margin-top: 2px;
      line-height: 1.1;
    }

    .dashboard-attendance-guru {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      color: #6c757d;
    }

    .dashboard-attendance-loading {

      min-height: 180px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 12px;

      color: var(--primary);

      text-align: center;

    }

    .dashboard-tadpole {

      position: relative;

      width: 64px;

      height: 28px;

    }

    .dashboard-tadpole::before {

      content: "";

      position: absolute;

      width: 18px;

      height: 18px;

      border-radius: 50%;

      background: var(--primary);

      top: 5px;

      left: 0;

      box-shadow:
        12px 0 0 rgba(11, 45, 107, .45),
        22px 0 0 rgba(11, 45, 107, .22);

      animation: dashboardTadpoleMove 1.1s ease-in-out infinite;

    }

    .dashboard-tadpole::after {

      content: "";

      position: absolute;

      width: 34px;

      height: 12px;

      border-bottom: 3px solid rgba(11, 45, 107, .35);

      border-radius: 50%;

      left: 8px;

      top: 5px;

      transform: rotate(-12deg);

      transform-origin: left center;

      animation: dashboardTadpoleTail 1.1s ease-in-out infinite;

    }

    .dashboard-attendance-loading-text {

      font-size: 13px;

      font-weight: 600;

      color: #64748b;

    }

    @keyframes dashboardTadpoleMove {

      0%,
      100% {

        transform: translateX(0);

      }

      50% {

        transform: translateX(24px);

      }

    }

    @keyframes dashboardTadpoleTail {

      0%,
      100% {

        transform: rotate(-12deg) scaleX(.85);

      }

      50% {

        transform: rotate(12deg) scaleX(1);

      }

    }

    .mobile-btn {
      display: none;
    }

    .mobile-close-btn {

      display: none;

    }

    /* CSS Umum */

    #mobileAbsensiContainer {
      display: none;
    }

    /* =========================
      DASHBOARD BADGE
    ========================= */

    .dashboard-badge {

      display: inline-flex;

      align-items: center;

      padding: 5px 12px;

      margin: 2px 6px 2px 0;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 600;

      letter-spacing: .2px;

      border: 1px solid transparent;

      transition: .2s;

    }

    .badge-admin {

      background: #0b2d6b;

      color: #ffffff;

    }

    .badge-kepsek {

      background: #d4af37;

      color: #0b2d6b;

    }

    .badge-wali {

      background: #dbeafe;

      color: #1e3a8a;

      border: 1px solid #93c5fd;

    }

    .badge-mapel {

      background: #dcfce7;

      color: #166534;

      border: 1px solid #86efac;

    }

    .badge-kelas {

      background: #fff4cc;

      color: #8a5a00;

      border: 1px solid #f4d35e;

    }

    .badge-walikelas {

      background: #ede9fe;

      color: #5b21b6;

      border: 1px solid #c4b5fd;

    }

    /* =========================
      HEADER DATE TIME
    ========================= */

    .content-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

    }

    .header-datetime {

      display: flex;

      flex-direction: column;

      align-items: flex-end;

      line-height: 1.2;

    }

    #headerTanggal {

      font-size: 14px;

      font-weight: 600;

      color: #495057;

    }

    #headerJam {

      font-size: 13px;

      color: #6c757d;

    }

    /* =========================
      DASHBOARD AKADEMIK
    ========================= */

    .dashboard-akademik {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 16px;

    }

    .dashboard-akademik-item {

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      justify-content: center;

      gap: 4px;

      padding: 10px 14px;

      background: #eef5ff;

      border: 1px solid #d8e8ff;

      border-radius: 18px;

      min-height: 62px;

    }

    .dashboard-akademik-item small {

      font-size: 11px;

      color: #64748b;

      font-weight: 600;

      line-height: 1;

    }

    .dashboard-akademik-value {

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .dashboard-akademik-value i {

      color: #2563eb;

      font-size: 14px;

    }

    .dashboard-akademik-value strong {

      font-size: 18px;

      font-weight: 700;

      color: #0f172a;

    }

    .dashboard-akademik-item i {

      color: #2563eb;

    }

    .dashboard-akademik-item strong {

      color: #0f172a;

      margin-left: 4px;

    }

    /* =========================
      DASHBOARD PROFILE
    ========================= */

    .dashboard-profile {

      position: relative;

      display: flex;

      flex-direction: row;

      flex-wrap: nowrap;

      justify-content: space-between;

      align-items: flex-start;

      gap: 16px;

    }

    .dashboard-profile-info {

      flex: 1 1 280px;

      min-width: 0;

    }

    .dashboard-profile-actions {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      align-self: flex-start;
    }

    /* =========================
      DASHBOARD ACTION BUTTON
    ========================= */

    .dashboard-action-btn {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      padding: 10px 16px;

      background: var(--primary);

      color: #ffffff;

      border: 1px solid transparent;

      border-radius: 14px;

      text-decoration: none;

      box-shadow:
        0 6px 16px rgba(11, 45, 107, .22);

      transition:
        background .18s ease,
        transform .18s ease,
        box-shadow .18s ease;

    }

    .dashboard-action-btn:hover {

      background: #1d4ed8;

      color: #ffffff;

      transform: translateY(-1px);

      box-shadow:
        0 8px 20px rgba(11, 45, 107, .3);

    }

    .dashboard-action-btn-icon {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 36px;

      height: 36px;

      flex-shrink: 0;

      border-radius: 10px;

      background: rgba(255, 255, 255, .15);

      color: var(--gold);

      font-size: 16px;

    }

    .dashboard-action-btn-text {

      display: flex;

      flex-direction: column;

      text-align: left;

      line-height: 1.15;

    }

    .dashboard-action-btn-text strong {

      font-size: 14px;

      font-weight: 700;

      color: #ffffff;

    }

    .dashboard-action-btn-text small {

      font-size: 11px;

      font-weight: 500;

      color: rgba(255, 255, 255, .75);

    }

    /* CARD STATISTIK */

    .card-stat h2 {

      font-size: 44px;

      font-weight: 700;

      margin-bottom: 4px;

    }

    .card-stat small {

      display: block;

      font-size: 15px;

      color: #6c757d;

      font-weight: 500;

    }

    /* =========================
      CARD CLICK EFFECT
    ========================= */

    .card-clicking {

      transform: scale(.97);

      transition: transform .15s ease;

      opacity: .92;

    }

    /* =========================
      DASHBOARD SUMMARY CARD
    ========================= */

    .dashboard-summary-card {

      background: #fff;

      border: 1px solid #e9edf3;

      border-radius: 16px;

      padding: 14px;

      margin-bottom: 12px;

      box-shadow:

        0 4px 12px rgba(15, 23, 42, .05);

      transition:

        transform .18s ease,

        box-shadow .18s ease;

      cursor: pointer;

    }

    /* BADGE STATUS ABSENSI */

    .dashboard-status-badge {

      min-width: 82px;

      text-align: center;

      font-size: 13px;

      font-weight: 600;

      padding: 8px 12px;

      border-radius: 999px;

    }

    .dashboard-summary-card:hover {

      transform: translateY(-2px);

      box-shadow:

        0 10px 24px rgba(15, 23, 42, .08);

    }

    .dashboard-summary-card:hover {

      transform: translateY(-2px);

    }

    .dashboard-summary-card .badge {

      font-size: .78rem;

      padding: 7px 10px;

      border-radius: 999px;

    }

    /* =========================
      HALAMAN PENGATURAN
    ========================= */

    .pengaturan-page {

      max-width: 1200px;

      margin: 0 auto;

    }


    /* HEADER */

    .pengaturan-header {

      display: flex;

      align-items: center;

      gap: 16px;

      margin-bottom: 18px;

    }


    .pengaturan-header-icon {

      width: 52px;

      height: 52px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #eef4ff;

      color: #0b2d6b;

      font-size: 22px;

      flex-shrink: 0;

    }


    /* INFO */

    .pengaturan-info {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding: 7px 13px;

      border-radius: 999px;

      background: #f1f5f9;

      color: #64748b;

      font-size: 13px;

      font-weight: 600;

      margin-bottom: 12px;

    }


    /* CARD */

    .pengaturan-card {

      position: relative;

      display: flex;

      align-items: center;

      gap: 16px;

      min-height: 125px;

      height: 100%;

      padding: 20px;

      background: #fff;

      border: 1px solid #edf1f5;

      border-radius: 22px;

      box-shadow:

        0 8px 24px rgba(15, 23, 42, .06);

      cursor: pointer;

      transition:

        transform .18s ease,

        box-shadow .18s ease,

        border-color .18s ease;

    }


    /* HOVER */

    .pengaturan-card:hover {

      transform:
        translateY(-3px);

      box-shadow:

        0 14px 32px rgba(15, 23, 42, .10);

      border-color: #dde5ef;

    }


    /* CLICK */

    .pengaturan-card:active {

      transform:
        scale(.98);

    }


    /* ICON */

    .pengaturan-icon {

      width: 58px;

      height: 58px;

      min-width: 58px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 23px;

    }


    /* AKADEMIK */

    .pengaturan-icon-akademik {

      background: #e8f0ff;

      color: #2563eb;

    }


    /* SEKOLAH */

    .pengaturan-icon-sekolah {

      background: #e8f8ef;

      color: #198754;

    }


    /* SISTEM */

    .pengaturan-icon-sistem {

      background: #f1eafe;

      color: #7c3aed;

    }


    /* TAHUN AJARAN */

    .pengaturan-icon-tahun {

      background: #fff2df;

      color: #ea7c16;

    }


    /* CONTENT */

    .pengaturan-card-content {

      flex: 1;

      min-width: 0;

    }


    .pengaturan-card-content h5 {

      margin: 0 0 6px 0;

      font-size: 17px;

      font-weight: 700;

      color: #0f172a;

    }


    .pengaturan-card-content p {

      margin: 0;

      color: #64748b;

      font-size: 13px;

      line-height: 1.55;

    }

    /* PREVIEW AKADEMIK */

    .pengaturan-preview {

      display: flex;

      flex-direction: column;

      gap: 6px;

      margin-top: 8px;

    }

    .pengaturan-preview div {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

    }


    .pengaturan-preview strong {

      font-size: 13px;

      color: #475569;

    }

    .pengaturan-preview span {

      font-size: 13px;

      color: #0f172a;

      font-weight: 600;

    }

    /* ARROW */

    .pengaturan-arrow {

      display: flex;

      align-items: center;

      justify-content: center;

      color: #94a3b8;

      font-size: 15px;

      transition:
        transform .18s ease;

    }

    .pengaturan-card:hover .pengaturan-arrow {

      transform: translateX(3px);

    }

    /* =========================
      HARI LIBUR AKADEMIK
    ========================= */

    #editHariLibur {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(120px, 1fr));

      gap: 10px 16px;

    }

    #editHariLibur .form-check {

      display: flex;

      align-items: center;

      gap: 8px;

      margin: 0;

    }

    #editHariLibur .form-check-input {

      margin: 0;

    }

    #editHariLibur .form-check-label {

      margin: 0;

      white-space: nowrap;

      cursor: pointer;

    }

    /* =========================
      PENGATURAN EDIT
    ========================= */

    .pengaturan-edit {

      display: flex;

      flex-direction: column;

      gap: 16px;

    }

    .pengaturan-edit strong {

      display: block;

      margin-bottom: 6px;

    }

    @media(max-width:768px) {

      /* DASHBOARD PROFILE MOBILE */
      .dashboard-profile {

        flex-wrap: nowrap;

        gap: 12px;

      }

      .dashboard-profile-info {

        flex: 1 1 auto;

        min-width: 0;

      }

      .dashboard-profile-actions {

        position: absolute;

        top: 200px;

        right: 14px;

        display: flex;

        align-items: flex-start;

      }

      .dashboard-action-btn {

        gap: 8px;

        padding: 8px 12px;

        border-radius: 12px;

      }

      .dashboard-action-btn-icon {

        width: 30px;

        height: 30px;

        font-size: 14px;

        border-radius: 8px;

      }

      .dashboard-action-btn-text strong {

        font-size: 13px;

      }

      .card-stat h2 {

        font-size: 38px;

        margin-bottom: 2px;

      }

      .card-stat small {

        font-size: 14px;

        font-weight: 500;

      }

      .icon-box {

        width: 46px;

        height: 46px;

        font-size: 18px;

        border-radius: 14px;

      }

      .desktop-only {
        display: none;
      }

      #mobileAbsensiContainer {
        display: block !important;
      }

      .absensi-card {

        background: #fff;

        border: 1px solid #e9ecef;

        border-radius: 14px;

        padding: 14px;

        margin-bottom: 12px;

      }

      .absensi-card-header {

        display: flex;

        gap: 10px;

        align-items: flex-start;

        margin-bottom: 12px;

      }

      .absensi-no {

        width: 32px;

        font-weight: 600;

        color: #888;

        flex-shrink: 0;

      }

      .absensi-nama {

        font-weight: 600;

        flex: 1;

        line-height: 1.35;

      }

      .absensi-card .btn-group {

        display: flex;

        width: 100%;

      }

      .absensi-card .btn {

        flex: 1;

      }

      body {

        font-size: 14px;

      }

      .content {

        margin-left: 0;

        width: 100%;

        min-height: 100dvh;

        padding: 14px;

      }

      .sidebar {

        left: -260px;

        transition: .25s ease;

        box-shadow:
          8px 0 25px rgba(0, 0, 0, .18);

      }

      .sidebar.show {

        left: 0;

      }

      .mobile-close-btn {

        display: block;

        margin: 12px;

        font-size: 24px;

        color: #fff !important;

        text-decoration: none;

      }

      .mobile-btn {

        display: flex;

        align-items: center;

        justify-content: center;

        width: 42px;

        height: 42px;

        padding: 0;

        border-radius: 12px;

        margin-bottom: 14px;

      }

      .topbar {

        padding: 14px;

        margin-bottom: 16px;

        border-radius: 16px;

      }

      .card-summary {

        padding: 14px !important;

      }

      .card-stat {

        padding: 14px !important;

      }

      .card-stat,

      .card-summary {

        border-radius: 16px;

      }

      .form-control,

      .form-select {

        min-height: 42px;

        font-size: 14px;

      }

      .btn {

        min-height: 40px;

        padding: 6px 14px;

        font-size: 14px;

        border-radius: 12px;

      }

      .logo-box {

        padding: 16px;

      }

      .logo-box img {

        width: 58px;

      }

      .menu-link {

        padding: 11px 18px;

        font-size: 14px;

      }

      h1,
      h2,
      h3,
      h4,
      h5 {

        margin-bottom: .5rem;

      }

      /* HEADER DATE TIME */

      .content-header {

        margin-bottom: 14px;

      }

      .header-datetime {

        flex: 1;

        align-items: flex-end;

      }

      #headerTanggal {

        font-size: 12px;

      }

      #headerJam {

        font-size: 11px;

      }

      .mobile-btn {

        margin-bottom: 0 !important;

      }

      /* =========================
        PREMIUM DESIGN SYSTEM
      ========================= */

      .card-summary,
      .card-stat,
      .topbar {

        background: #fff;

        border: var(--border-soft);

        border-radius: var(--radius-card);

        box-shadow: var(--shadow-card);

        transition: all var(--transition);

      }

      .card-summary:hover,

      /* =========================

<body>

  <div id="appRoot">

    <!-- CONTENT -->

    <div class="content" id="contentArea">

      <div class="content-header">

    <!-- MODAL DASHBOARD -->

    <div class="modal fade" id="modalDashboard">

      <div class="modal-dialog modal-dialog-scrollable">

        <div class="modal-content">

          <div class="modal-header">

            <div>

              <h5 class="modal-title mb-1">

              </h5>

              <small id="dashboardAttendanceDate" class="text-muted">
              </small>

            </div>

            <button class="btn-close" data-bs-dismiss="modal">
            </button>

          </div>

          </div>

            <button class="btn btn-secondary px-4" data-bs-dismiss="modal">

              Tutup

            </button>

          </div>

        </div>

      </div>

    </div>

    <!-- MODAL KONFIRMASI GLOBAL -->

    <div class="modal fade" id="modalKonfirmasiGlobal" tabindex="-1">

      <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

          <div class="modal-body text-center p-4">

            <div id="iconKonfirmasiGlobal" class="mb-3" style="
            font-size:60px;
            color:#dc3545;
          ">

              <i class="fa-solid fa-circle-question">
              </i>

            </div>

            <h5 class="fw-bold" id="judulKonfirmasiGlobal">

              Konfirmasi

            </h5>

            <div class="text-muted" id="pesanKonfirmasiGlobal">

              Pesan konfirmasi.

            </div>

          </div>

          <div class="modal-footer justify-content-center">

            <button class="btn btn-secondary" data-bs-dismiss="modal">

              Batal

            </button>

            <button class="btn btn-danger" id="btnYaKonfirmasiGlobal">

              Ya

            </button>

          </div>

        </div>

      </div>

    </div>

    <div id="toastContainer" class="
    position-fixed
    top-0
    end-0
    p-3" style="
    z-index:9999;
  ">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let modeForm = "tambah";

      let tombolSedangProses = {};

      let callbackKonfirmasiGlobal = null;

      let editGuruRow = null;
      let editKelasRow = null;

      let headerDateTimeInterval = null;

      function toggleSidebar() {

        if (

          !isMobileLayout()

        ) {

          return;

        }

        document

          .getElementById(
            "sidebar"
          )

          .classList

          .toggle(
            "show"
          );

      }

      /* =========================
         HEADER DATE & TIME
      ========================= */

      function updateHeaderDateTime() {

        const now = new Date();

        const namaHari = [
          "Minggu",
          "Senin",
          "Selasa",
          "Rabu",
          "Kamis",
          "Jumat",
          "Sabtu"
        ];

        const namaBulan = [
          "Januari",
          "Februari",
          "Maret",
          "April",
          "Mei",
          "Juni",
          "Juli",
          "Agustus",
          "September",
          "Oktober",
          "November",
          "Desember"
        ];

        const tanggal =

          `${namaHari[now.getDay()]}, ` +
          `${now.getDate()} ` +
          `${namaBulan[now.getMonth()]} ` +
          `${now.getFullYear()}`;

        const jam =

          String(now.getHours()).padStart(2, "0") + "." +
          String(now.getMinutes()).padStart(2, "0") + "." +
          String(now.getSeconds()).padStart(2, "0") +
          " WIB";

        const elTanggal =
          document.getElementById("headerTanggal");

        const elJam =
          document.getElementById("headerJam");

        if (elTanggal) {

          elTanggal.innerText = tanggal;

        }

        if (elJam) {

          elJam.innerText = jam;

        }

      }

      /* =========================
         RESPONSIVE LAYOUT
      ========================= */

      function isMobileLayout() {

        return window.innerWidth <= 768;

      }

      function updateResponsiveLayout() {

        const sidebar =
          document.getElementById("sidebar");

        const content =
          document.getElementById("contentArea");

        const mobileBtn =
          document.getElementById(
            "mobileToggle"
          );

        if (!sidebar || !content) {
          return;
        }

        if (isMobileLayout()) {

          content.style.marginLeft = "0";

          sidebar.classList.remove("show");

          if (mobileBtn) {

            const loginPage =
              document.getElementById(
                "loginUsername"
              );

            mobileBtn.style.display =
              loginPage
                ? "none"
                : "flex";

          }

        } else {

          content.style.marginLeft = "260px";

          sidebar.classList.remove("show");

          if (mobileBtn) {
            mobileBtn.style.display = "none";
          }

        }

      }

      function showToast(
        pesan,
        tipe = "success"
      ) {

        const container =

          document.getElementById(
            "toastContainer"
          );

        const toast =

          document.createElement(
            "div"
          );

        let warna =

          "text-bg-success";

        let icon =

          "fa-check-circle";

        if (tipe === "error") {

          warna =
            "text-bg-danger";

          icon =
            "fa-circle-xmark";

        }

        if (tipe === "warning") {

          warna =
            "text-bg-warning";

          icon =
            "fa-triangle-exclamation";

        }

        toast.className =

          `toast align-items-center ${warna} border-0 show mb-2`;

        toast.innerHTML =

          `
    <div class="d-flex">

      <div class="toast-body">

        <i class="fa-solid ${icon}"></i>

        ${pesan}

      </div>

    </div>
    `;

        container.appendChild(
          toast
        );

        setTimeout(function () {

          toast.remove();

        }, 3000);

      }

      function setButtonLoading(
        button,
        loadingText
      ) {

        button.dataset.originalHtml =
          button.innerHTML;

        button.disabled = true;

        button.innerHTML =

          '<span class="spinner-border spinner-border-sm me-2"></span>'

          +

          loadingText;

      }

      function resetButtonLoading(
        button
      ) {

        button.disabled = false;

        if (

          button.dataset.originalHtml

        ) {

          button.innerHTML =

            button.dataset.originalHtml;

        }

      }

      function lockButton(id) {

        if (

          tombolSedangProses[id]

        ) {

          return false;

        }

        tombolSedangProses[id] = true;

        return true;

      }

      function unlockButton(id) {

        delete tombolSedangProses[id];

      }

      function startButtonLoading(
        button,
        text = "Menyimpan..."
      ) {

        if (!button) {
          return;
        }

        button.disabled = true;

        button.dataset.originalText =
          button.innerHTML;

        button.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> '
          + text;

      }

      function successButtonLoading(
        button,
        text = "Tersimpan"
      ) {

        if (!button) {
          return;
        }

        button.innerHTML =
          '<i class="fa-solid fa-check"></i> '
          + text;

      }

      function stopButtonLoading(
        button
      ) {

        if (!button) {
          return;
        }

        button.disabled = false;

        if (
          button.dataset.originalText
        ) {

          button.innerHTML =
            button.dataset.originalText;

        }

      }

      function showConfirmModal(
        judul,
        pesan,
        callback
      ) {

        const modalElement =
          document.getElementById(
            "modalKonfirmasiGlobal"
          );

        if (!modalElement) {
          return;
        }

        callbackKonfirmasiGlobal =
          callback;

        document
          .getElementById(
            "judulKonfirmasiGlobal"
          )
          .innerText = judul;

        document
          .getElementById(
            "pesanKonfirmasiGlobal"
          )
          .innerText = pesan;

        const modal =
          bootstrap.Modal.getOrCreateInstance(
            modalElement
          );

        const btnYa =
          document.getElementById(
            "btnYaKonfirmasiGlobal"
          );

        btnYa.onclick = function () {

          const callbackSaatIni =
            callbackKonfirmasiGlobal;

          callbackKonfirmasiGlobal = null;

          modalElement.addEventListener(
            "hidden.bs.modal",
            function () {

              if (
                typeof callbackSaatIni ===
                "function"
              ) {
                callbackSaatIni();
              }

            },
            {once: true}
          );

          modal.hide();

        };

        modal.show();

      }

      /* =========================
         REKAP LOADING
      ========================= */

      function setRekapLoading(
        status
      ) {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          btn.disabled = status;

        }

      }

      function startRekapLoading() {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          startButtonLoading(
            btn,
            "Memuat..."
          );

        }

        const loading =

          document.getElementById(
            "loadingRekap"
          );

        if (loading) {

          loading.style.display =
            "block";

          const table =

            document.getElementById(
              "rekapTableWrapper"
            );

          if (table) {

            table.style.display =
              "none";

          }

        }

      }

      function stopRekapLoading() {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          stopButtonLoading(
            btn
          );

        }

        const loading =

          document.getElementById(
            "loadingRekap"
          );

        if (loading) {

          loading.style.display =
            "none";

          const table =

            document.getElementById(
              "rekapTableWrapper"
            );

          if (table) {

            table.style.display =
              "block";

          }

        }

      }

      function successRekapLoading() {

        const btn =

          document.getElementById(
            "btnTampilkanRekap"
          );

        if (btn) {

          successButtonLoading(
            btn,
            "Selesai"
          );

        }

      }

      function showDashboardAttendance(card) {

        if (!card) {
          return;
        }

        if (
          card.dataset.loading === "true"
        ) {
          return;
        }

        card.dataset.loading = "true";

        card.classList.add(
          "card-clicking"
        );

        const body =
          document.getElementById(
            "dashboardAttendanceBody"
          );

        const modalElement =
          document.getElementById(
            "modalDashboard"
          );

        const modal =
          bootstrap.Modal.getOrCreateInstance(
            modalElement
          );

        /* =========================
          TANGGAL HARI INI
        ========================= */

        const tanggalSekarang =
          new Date();

        const namaHari = [
          "Minggu",
          "Senin",
          "Selasa",
          "Rabu",
          "Kamis",
          "Jumat",
          "Sabtu"
        ][
          tanggalSekarang.getDay()
        ];

        const tanggal =
          String(
            tanggalSekarang.getDate()
          ).padStart(
            2,
            "0"
          );

        const namaBulan = [
          "Januari",
          "Februari",
          "Maret",
          "April",
          "Mei",
          "Juni",
          "Juli",
          "Agustus",
          "September",
          "Oktober",
          "November",
          "Desember"
        ][
          tanggalSekarang.getMonth()
        ];

        const tahun =
          tanggalSekarang.getFullYear();

        const dateElement =
          document.getElementById(
            "dashboardAttendanceDate"
          );

        if (dateElement) {

          dateElement.textContent =
            namaHari +
            ", " +
            tanggal +
            " " +
            namaBulan +
            " " +
            tahun;

        }

        /* =========================
          LAZY-LOAD LOADING
        ========================= */

        body.innerHTML = `

          <div class="dashboard-attendance-loading">

            <div class="dashboard-tadpole"></div>

            <div class="dashboard-attendance-loading-text">

              Memuat data kehadiran...

            </div>

          </div>

        `;

        /*
          Modal dibuka segera.
          Data detail baru diminta setelah
          pengguna benar-benar membuka Card.
        */

        modal.show();

        /* =========================
          LAZY-LOAD DATA DETAIL
        ========================= */

        google.script.run

          .withSuccessHandler(
            function (data) {

              if (
                !Array.isArray(data)
              ) {

                throw new Error(
                  "Format data absensi Dashboard tidak valid."
                );

              }

              let html = "";

              if (
                data.length === 0
              ) {

                html = `

                  <div class="text-center text-muted py-4">

                    Tidak ada data kelas.

                  </div>

                `;

              }

              else {

                data.forEach(
                  function (item) {

                    /* =========================
                      BELUM DIABSEN
                    ========================= */

                    if (
                      item.status
                    ) {

                      html += `

                        <div class="dashboard-summary-card">

                          <div class="d-flex align-items-center">

                            <strong class="flex-shrink-0">
                              Kelas ${item.kelas}
                            </strong>

                            <small
                              class="dashboard-attendance-guru"
                              title="${item.guruMengajar || "-"}">

                              ${item.guruMengajar || "-"}

                            </small>

        ========================================================= */

      let masterDataBundle = null;
      let masterDataBundleLoading = false;
      let masterDataBundleQueue = [];


      /**
       * Mengambil seluruh Master Data dalam satu request.
       */
      function loadMasterDataBundle(callback) {

        if (masterDataBundle) {

          if (typeof callback === "function") {
            callback(masterDataBundle);
          }

          return;
        }

        if (masterDataBundleLoading) {

          if (typeof callback === "function") {
            masterDataBundleQueue.push(callback);
          }

          return;
        }

        masterDataBundleLoading = true;

        if (typeof callback === "function") {
          masterDataBundleQueue.push(callback);
        }

        google.script.run
          .withSuccessHandler(function (bundle) {

            masterDataBundle =
              bundle || {};

            masterDataBundleLoading =
              false;

            const queue =
              masterDataBundleQueue.slice();

            masterDataBundleQueue = [];

            queue.forEach(function (fn) {
              try {
                fn(masterDataBundle);
              } catch (error) {
                console.error(error);
              }
            });

          })
          .withFailureHandler(function (error) {

            masterDataBundleLoading =
              false;

            masterDataBundleQueue = [];

            console.error(
              "Gagal memuat Master Data Bundle:",
              error
            );

            showToast(
              "Gagal memuat Master Data",
              "error"
            );

          })
          .getMasterDataBundle();
      }

      function siapkanDataExportSiswa(kelas) {

        const baris = [];

        allStudents.forEach(function (row) {

          if (
            kelas &&
            kelas !== "" &&
            String(kelasSiswa) !== String(kelas)
          ) {

      function toggleLoginPassword() {

        const input =
          document.getElementById(
            "loginPassword"
          );

        const icon =
          document.getElementById(
            "loginPasswordIcon"
          );

        if (!input || !icon) {
          return;
        }

        const showPassword =
          input.type === "password";

        /*
         * Simpan posisi cursor apabila
         * browser masih mempertahankan
         * selection pada input.
         */

        const wasFocused =
          document.activeElement === input;

        let selectionStart = null;
        let selectionEnd = null;

        try {

          selectionStart =
            input.selectionStart;

          selectionEnd =
            input.selectionEnd;

        } catch (error) {

          selectionStart = null;
          selectionEnd = null;

        }

        /*
         * =========================
         * P7-D.3 — MOBILE TOUCH FIX
         * =========================
         *
         * Lepaskan focus sementara,
         * ubah tipe input, paksa browser
         * melakukan layout/repaint, lalu
         * kembalikan focus secara aman.
         */

        if (wasFocused) {

          input.blur();

        }

        input.type =
          showPassword
            ? "text"
            : "password";

        icon.className =
          showPassword
            ? "fa-solid fa-eye-slash"
            : "fa-solid fa-eye";

        /*
         * Force layout/reflow.
         */

        void input.offsetHeight;

        if (wasFocused) {

          requestAnimationFrame(
            function () {

              try {

                input.focus({
                  preventScroll: true
                });

              } catch (error) {

                input.focus();

              }

              if (
                selectionStart !== null &&
                selectionEnd !== null
              ) {

                try {

                  input.setSelectionRange(
                    selectionStart,
                    selectionEnd
                  );

                } catch (error) {

                  // Browser tertentu
                  // tidak mengizinkan
                  // selection pada state ini.

                }

              }

            }
          );

        }

      }

      function readExcelFile(file, callback) {

        if (!file) {
          return;
        }

        const reader = new FileReader();

        reader.onload = function (e) {

          const workbook =

            XLSX.read(

              e.target.result,

              {

                type: "binary"

              }

            );

          const sheet =

            workbook.Sheets[
            workbook.SheetNames[0]
            ];

          const data =

            XLSX.utils.sheet_to_json(

              sheet,

              {

                header: 1,

                blankrows: false,

                raw: false,

                dateNF: "yyyy-mm-dd"

              }

            );

          callback(

            workbook,

            data

          );

        };

        reader.readAsBinaryString(file);

      }

         * kelas dibatasi berdasarkan
         * relasi Guru Mengajar,
         * tetapi dropdown tetap aktif
         * setelah request selesai.
         */
        loadKelasGuruRekap(
          idGuru,
          selectedKelas,
          selectedMapel,
          requestId
        );

      }

      document.addEventListener("click", function (e) {

        if (!isMobileLayout()) {
          return;
        }

        const sidebar = document.getElementById("sidebar");

        if (!sidebar) {
          return;
        }

        const toggle = e.target.closest('[onclick="toggleSidebar()"]');

        if (toggle) {
          return;
        }

        if (sidebar.contains(e.target)) {
          return;
        }

        if (sidebar.classList.contains("show")) {
          sidebar.classList.remove("show");
        }

      });

    </script>
