<script>

    let modeAbsensi = "baru";

    let draftAbsensi = {};

    let modeEditAbsensi = false;

    let dataRevisiPending = null;

    let attendanceCalendarRequestId = 0;

    let absensiStudentRequestId = 0;

    // ===== DRAFT ABSENSI ===== //

    function simpanDraftAbsensi() {

        draftAbsensi = {};

        document
            .querySelectorAll('input[id^="status_"]')
            .forEach(function (input) {

                if (input.value) {

                    draftAbsensi[
                        input.id.replace(
                            "status_",
                            ""
                        )
                    ] = input.value;

                }

            });

    }

    function pulihkanDraftAbsensi() {

        Object.keys(draftAbsensi)
            .forEach(function (nisn) {

                setStatusAbsen(
                    nisn,
                    draftAbsensi[nisn]
                );

            });

    }

    /* === P7-B.1 — ABSENSI REQUEST STATE === */

    function showAbsensiLoadingState() {

        const loadingHtml = `
          <tr>
            <td
              colspan="3"
              class="text-center py-4">
      
              <div class="d-flex justify-content-center align-items-center gap-2">
      
                <div
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true">
                </div>
      
                <span>Memuat data siswa...</span>
      
              </div>
      
            </td>
          </tr>
        `;

        const table =
            document.getElementById(
                "tableAbsensi"
            );

        const mobile =
            document.getElementById(
                "mobileAbsensiContainer"
            );

        if (table) {
            table.innerHTML =
                loadingHtml;
        }

        if (mobile) {
            mobile.innerHTML = `
            <div class="text-center py-4">
      
              <div class="d-flex justify-content-center align-items-center gap-2">
      
                <div
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true">
                </div>
      
                <span>Memuat data siswa...</span>
      
              </div>
      
            </div>
          `;

            mobile.classList.remove(
                "d-none"
            );
        }
    }

    function setHadirSemuaDisabled(status) {

        const btnAtas =
            document.getElementById(
                "btnHadirSemua"
            );

        const btnBawah =
            document.getElementById(
                "btnHadirSemuaBottom"
            );

        if (btnAtas) {
            btnAtas.disabled = status;
        }

        if (btnBawah) {
            btnBawah.disabled = status;
        }

    }

    function setSimpanAbsensiDisabled(
        status
    ) {

        const btnAtas =
            document.getElementById(
                "btnSimpanAbsensi"
            );

        const btnBawah =
            document.getElementById(
                "btnSimpanAbsensiBottom"
            );

        [btnAtas, btnBawah]
            .forEach(function (btn) {

                if (!btn) {
                    return;
                }

                btn.disabled = status;

            });

    }

    function startSimpanAbsensiLoading(
        text = "Menyimpan..."
    ) {

        const btnAtas =
            document.getElementById(
                "btnSimpanAbsensi"
            );

        const btnBawah =
            document.getElementById(
                "btnSimpanAbsensiBottom"
            );

        [btnAtas, btnBawah]
            .forEach(function (btn) {

                if (!btn) {
                    return;
                }

                startButtonLoading(
                    btn,
                    text
                );

            });

    }

    function successSimpanAbsensiLoading(
        text = "Tersimpan"
    ) {

        const btnAtas =
            document.getElementById(
                "btnSimpanAbsensi"
            );

        const btnBawah =
            document.getElementById(
                "btnSimpanAbsensiBottom"
            );

        [btnAtas, btnBawah]
            .forEach(function (btn) {

                if (!btn) {
                    return;
                }

                successButtonLoading(
                    btn,
                    text
                );

            });

    }

    function stopSimpanAbsensiLoading() {

        const btnAtas =
            document.getElementById(
                "btnSimpanAbsensi"
            );

        const btnBawah =
            document.getElementById(
                "btnSimpanAbsensiBottom"
            );

        [btnAtas, btnBawah]
            .forEach(function (btn) {

                if (!btn) {
                    return;
                }

                stopButtonLoading(
                    btn
                );

            });

    }

    function setSimpanAbsensiText(
        html,
        kelas = "btn-primary"
    ) {

        const btnAtas =

            document.getElementById(
                "btnSimpanAbsensi"
            );

        const btnBawah =

            document.getElementById(
                "btnSimpanAbsensiBottom"
            );

        [btnAtas, btnBawah]
            .forEach(function (btn) {

                if (!btn) {
                    return;
                }

                btn.innerHTML = html;

                btn.classList.remove(
                    "btn-primary",
                    "btn-success",
                    "btn-warning"
                );

                btn.classList.add(
                    kelas
                );

            });

    }

    function loadStudentsByClass() {

        const requestId =
            ++absensiStudentRequestId;

        const kelas =
            document.getElementById(
                "filterKelasAbsensi"
            ).value;

        if (!kelas) {

            ++absensiStudentRequestId;

            document.getElementById(
                "tableAbsensi"
            ).innerHTML = `
            <tr>
              <td
                colspan="3"
                class="text-center">
                Pilih kelas terlebih dahulu
              </td>
            </tr>
          `;

            document.getElementById(
                "mobileAbsensiContainer"
            ).innerHTML = "";

            return;
        }

        showAbsensiLoadingState();

        google.script.run

            .withSuccessHandler(
                function (data) {

                    if (
                        requestId !==
                        absensiStudentRequestId
                    ) {
                        return;
                    }

                    data =
                        JSON.parse(data);

                    const isMobile =
                        isMobileLayout();

                    /*
                     * Spinner tetap dipertahankan.
                     * Data siswa disiapkan di belakang
                     * spinner dan dibuat invisible sampai
                     * status absensi + mode selesai.
                     */

                    let html = `
                <tr id="absensiLoadingRow">
                  <td
                    colspan="3"
                    class="text-center py-4">
      
                    <div
                      class="d-flex justify-content-center align-items-center gap-2">
      
                      <div
                        class="spinner-border spinner-border-sm"
                        role="status"
                        aria-hidden="true">
                      </div>
      
                      <span>
                        Memuat data siswa &amp; status absensi...
                      </span>
      
                    </div>
      
                  </td>
                </tr>
              `;

                    let mobileHtml = `
                <div
                  id="absensiLoadingCard"
                  class="text-center py-4">
      
                  <div
                    class="d-flex justify-content-center align-items-center gap-2">
      
                    <div
                      class="spinner-border spinner-border-sm"
                      role="status"
                      aria-hidden="true">
                    </div>
      
                    <span>
                      Memuat data siswa &amp; status absensi...
                    </span>
      
                  </div>
      
                </div>
              `;

                    data.forEach(
                        function (siswa, index) {

                            html += `
                    <tr
                      class="absensi-student-row"
                      style="visibility:hidden;">
      
                      <td class="no-cell">
                        ${index + 1}
                      </td>
      
                      <td class="nama-cell">
      
                        <div class="nama-siswa">
                          ${siswa.nama}
                        </div>
      
                      </td>
      
                      <td class="status-cell">
      
                        <div class="status-mobile">
      
                          <div
                            class="btn-group w-100"
                            role="group">
      
                            <button
                              type="button"
                              class="btn btn-outline-secondary"
                              id="H_${siswa.nisn}"
                              onclick="setStatusAbsen('${siswa.nisn}','Hadir')">
                              H
                            </button>
      
                            <button
                              type="button"
                              class="btn btn-outline-secondary"
                              id="S_${siswa.nisn}"
                              onclick="setStatusAbsen('${siswa.nisn}','Sakit')">
                              S
                            </button>
      
                            <button
                              type="button"
                              class="btn btn-outline-secondary"
                              id="I_${siswa.nisn}"
                              onclick="setStatusAbsen('${siswa.nisn}','Izin')">
                              I
                            </button>
      
                            <button
                              type="button"
                              class="btn btn-outline-secondary"
                              id="A_${siswa.nisn}"
                              onclick="setStatusAbsen('${siswa.nisn}','Alpa')">
                              A
                            </button>
      
                          </div>
      
                        </div>
      
                        <input
                          type="hidden"
                          id="status_${siswa.nisn}"
                          value="">
      
                      </td>
      
                    </tr>
                  `;

                            mobileHtml += `
                    <div
                      class="absensi-card"
                      style="visibility:hidden;">
      
                      <div class="absensi-card-header">
      
                        <div class="absensi-no">
                          ${index + 1}
                        </div>
      
                        <div class="absensi-nama">
      
                          <div class="nama-siswa">
                            ${siswa.nama}
                          </div>
      
                        </div>
      
                      </div>
      
                      <div
                        class="btn-group w-100"
                        role="group">
      
                        <button
                          type="button"
                          class="btn btn-outline-secondary btn-sm"
                          id="H_${siswa.nisn}"
                          onclick="setStatusAbsen('${siswa.nisn}','Hadir')">
                          H
                        </button>
      
                        <button
                          type="button"
                          class="btn btn-outline-secondary btn-sm"
                          id="S_${siswa.nisn}"
                          onclick="setStatusAbsen('${siswa.nisn}','Sakit')">
                          S
                        </button>
      
                        <button
                          type="button"
                          class="btn btn-outline-secondary btn-sm"
                          id="I_${siswa.nisn}"
                          onclick="setStatusAbsen('${siswa.nisn}','Izin')">
                          I
                        </button>
      
                        <button
                          type="button"
                          class="btn btn-outline-secondary btn-sm"
                          id="A_${siswa.nisn}"
                          onclick="setStatusAbsen('${siswa.nisn}','Alpa')">
                          A
                        </button>
      
                      </div>
      
                      <input
                        type="hidden"
                        id="status_${siswa.nisn}"
                        value="">
      
                    </div>
                  `;

                        }
                    );

                    if (isMobile) {

                        document.getElementById(
                            "tableAbsensi"
                        ).innerHTML = "";

                        document.getElementById(
                            "mobileAbsensiContainer"
                        ).innerHTML =
                            mobileHtml;

                        document.querySelector(
                            ".desktop-only"
                        ).style.display =
                            "none";

                        document.getElementById(
                            "mobileAbsensiContainer"
                        ).classList.remove(
                            "d-none"
                        );

                    } else {

                        document.getElementById(
                            "tableAbsensi"
                        ).innerHTML =
                            html;

                        document.getElementById(
                            "mobileAbsensiContainer"
                        ).innerHTML =
                            "";

                        document.querySelector(
                            ".desktop-only"
                        ).style.display =
                            "";

                        document.getElementById(
                            "mobileAbsensiContainer"
                        ).classList.add(
                            "d-none"
                        );

                    }

                    if (
                        requestId !==
                        absensiStudentRequestId
                    ) {
                        return;
                    }

                    /*
                     * Jangan matikan loading di sini.
                     * loadExistingAttendance() harus
                     * menyelesaikan seluruh state dahulu.
                     */

                    loadExistingAttendance(
                        requestId
                    );

                }
            )

            .withFailureHandler(
                function (error) {

                    if (
                        requestId !==
                        absensiStudentRequestId
                    ) {
                        return;
                    }

                    console.error(error);

                    showToast(
                        "Gagal memuat data siswa.",
                        "error"
                    );

                }
            )

            .getStudentsByClass(
                kelas
            );

    }

    function loadExistingAttendance(studentRequestId) {

        const requestId =
            ++attendanceCalendarRequestId;

        if (
            studentRequestId == null
        ) {
            studentRequestId =
                absensiStudentRequestId;
        }

        const kelas =
            document.getElementById(
                "filterKelasAbsensi"
            ).value;

        const tanggal =
            document.getElementById(
                "tanggalAbsensi"
            ).value;

        if (!kelas || !tanggal) {

            document
                .getElementById(
                    "infoAbsenWaktu"
                )
                .innerHTML =
                "--/--/---- --:--:--";

            document
                .getElementById(
                    "infoAbsenOleh"
                )
                .innerHTML =
                "---";

            return;

        }

        google.script.run
            .withSuccessHandler(function (context) {

                if (
                    requestId !==
                    attendanceCalendarRequestId
                ) {
                    return;
                }

                if (
                    studentRequestId !==
                    absensiStudentRequestId
                ) {
                    return;
                }

                if (
                    context &&
                    context.shouldWarn
                ) {

                    const isHariLibur =
                        !!context.isSchoolHoliday;

                    const isTidakAdaJadwalGuru =
                        context.warningType === "teacher_schedule";

                    let judulPeringatan =
                        "Periksa Absensi";

                    let pesan =
                        "Periksa kembali tanggal dan jadwal mengajar yang dipilih.\n\nApakah Anda tetap ingin melanjutkan absensi?";

                    if (
                        isHariLibur &&
                        isTidakAdaJadwalGuru
                    ) {

                        judulPeringatan =
                            "Periksa Hari & Jadwal Mengajar";

                        pesan =
                            "Tanggal " +
                            tanggal +
                            " adalah hari libur sekolah (" +
                            context.hari +
                            "). Anda juga tidak memiliki jadwal mengajar untuk kelas " +
                            kelas +
                            " pada hari tersebut.\n\nPeriksa kembali tanggal dan jadwal Anda. Apakah Anda tetap ingin melanjutkan absensi?";

                    } else if (
                        isTidakAdaJadwalGuru
                    ) {

                        judulPeringatan =
                            "Periksa Jadwal Mengajar";

                        pesan =
                            "Anda tidak memiliki jadwal mengajar untuk kelas " +
                            kelas +
                            " pada hari " +
                            context.hari +
                            ". Periksa kembali tanggal yang dipilih.\n\nApakah Anda tetap ingin melanjutkan absensi?";

                    } else if (
                        isHariLibur
                    ) {

                        judulPeringatan =
                            "Hari Libur Sekolah";

                        pesan =
                            "Tanggal " +
                            tanggal +
                            " adalah hari libur sekolah (" +
                            context.hari +
                            ").\n\nApakah Anda tetap ingin melanjutkan absensi?";

                    }

                    const modalElement =
                        document.getElementById(
                            "modalKonfirmasiGlobal"
                        );

                    if (
                        modalElement &&
                        modalElement.classList.contains("show")
                    ) {
                        return;
                    }

                    showConfirmModal(
                        judulPeringatan,
                        pesan,
                        function () {
                            loadExistingAttendanceCore(
                                studentRequestId
                            );
                        }
                    );

                    return;

                }

                loadExistingAttendanceCore(
                    studentRequestId
                );

            })
            .withFailureHandler(function (error) {

                if (
                    studentRequestId !==
                    absensiStudentRequestId
                ) {
                    return;
                }

                console.error(error);

                showToast(
                    "Gagal memeriksa kalender sekolah. Silakan coba lagi.",
                    "error"
                );

            })
            .getAttendanceCalendarContext(
                kelas,
                tanggal,
                localStorage.getItem(
                    "wongmit_nama"
                ) || ""
            );

    }

    function loadExistingAttendanceCore(
        studentRequestId
    ) {

        if (
            studentRequestId == null
        ) {

            studentRequestId =
                absensiStudentRequestId;

        }

        if (
            studentRequestId !==
            absensiStudentRequestId
        ) {
            return;
        }

        const kelas =
            document.getElementById(
                "filterKelasAbsensi"
            ).value;

        const tanggal =
            document.getElementById(
                "tanggalAbsensi"
            ).value;

        if (
            !kelas ||
            !tanggal
        ) {
            return;
        }

        google.script.run

            .withSuccessHandler(
                function (result) {

                    if (
                        studentRequestId !==
                        absensiStudentRequestId
                    ) {
                        return;
                    }

                    const kelasSekarang =
                        document.getElementById(
                            "filterKelasAbsensi"
                        ).value;

                    const tanggalSekarang =
                        document.getElementById(
                            "tanggalAbsensi"
                        ).value;

                    if (
                        kelasSekarang !== kelas ||
                        tanggalSekarang !== tanggal
                    ) {
                        return;
                    }

                    result =
                        JSON.parse(result);

                    /*
                     * =====================================
                     * ABSENSI BARU
                     * =====================================
                     */

                    if (
                        !result.info.ditemukan
                    ) {

                        modeAbsensi =
                            "baru";

                        resetStatusAbsensi();

                        pulihkanDraftAbsensi();

                        modeEditAbsensi =
                            false;

                        setSimpanAbsensiText(
                            '<i class="fa-solid fa-floppy-disk"></i> Simpan',
                            "btn-primary"
                        );

                        setSimpanAbsensiDisabled(
                            false
                        );

                        setHadirSemuaDisabled(
                            false
                        );

                        document.getElementById(
                            "infoAbsenWaktu"
                        ).innerHTML =
                            "--/--/---- --:--:--";

                        document.getElementById(
                            "infoAbsenOleh"
                        ).innerHTML =
                            "---";

                        /*
                         * State Absensi Baru sudah final.
                         * Sekarang baru hilangkan loading.
                         */

                        const loadingRow =
                            document.getElementById(
                                "absensiLoadingRow"
                            );

                        if (loadingRow) {
                            loadingRow.remove();
                        }

                        const loadingCard =
                            document.getElementById(
                                "absensiLoadingCard"
                            );

                        if (loadingCard) {
                            loadingCard.remove();
                        }

                        document
                            .querySelectorAll(
                                ".absensi-student-row"
                            )
                            .forEach(
                                function (element) {

                                    element.style.visibility =
                                        "visible";

                                }
                            );

                        document
                            .querySelectorAll(
                                "#mobileAbsensiContainer .absensi-card"
                            )
                            .forEach(
                                function (element) {

                                    element.style.visibility =
                                        "visible";

                                }
                            );

                        return;

                    }

                    /*
                     * =====================================
                     * REVISI ABSENSI
                     * =====================================
                     */

                    const waktuAbsen =
                        new Date(
                            result.info.timestamp
                        );

                    const pad =
                        function (angka) {

                            return String(
                                angka
                            ).padStart(
                                2,
                                "0"
                            );

                        };

                    const waktuFormat =
                        pad(
                            waktuAbsen.getDate()
                        ) +
                        "/" +
                        pad(
                            waktuAbsen.getMonth() + 1
                        ) +
                        "/" +
                        waktuAbsen.getFullYear() +
                        " " +
                        pad(
                            waktuAbsen.getHours()
                        ) +
                        ":" +
                        pad(
                            waktuAbsen.getMinutes()
                        ) +
                        ":" +
                        pad(
                            waktuAbsen.getSeconds()
                        );

                    document.getElementById(
                        "infoAbsenWaktu"
                    ).innerHTML =
                        waktuFormat;

                    document.getElementById(
                        "infoAbsenOleh"
                    ).innerHTML =
                        result.info.inputOleh;

                    /*
                     * Aktifkan mode edit sementara
                     * agar setStatusAbsen() dapat
                     * memasukkan status lama.
                     */

                    modeAbsensi =
                        "revisi";

                    modeEditAbsensi =
                        true;

                    result.data.forEach(
                        function (item) {

                            setStatusAbsen(
                                item.nisn,
                                item.status
                            );

                        }
                    );

                    /*
                     * Seluruh status siswa sudah
                     * selesai diterapkan.
                     */

                    modeEditAbsensi =
                        false;

                    /*
                     * Baru sekarang tentukan
                     * tombol final Revisi.
                     */

                    setSimpanAbsensiText(
                        '<i class="fa-solid fa-pen"></i> Revisi Absen',
                        "btn-primary"
                    );

                    setSimpanAbsensiDisabled(
                        false
                    );

                    setHadirSemuaDisabled(
                        true
                    );

                    /*
                     * Seluruh state Revisi sudah final.
                     * Sekarang baru hilangkan loading.
                     */

                    const loadingRow =
                        document.getElementById(
                            "absensiLoadingRow"
                        );

                    if (loadingRow) {
                        loadingRow.remove();
                    }

                    const loadingCard =
                        document.getElementById(
                            "absensiLoadingCard"
                        );

                    if (loadingCard) {
                        loadingCard.remove();
                    }

                    document
                        .querySelectorAll(
                            ".absensi-student-row"
                        )
                        .forEach(
                            function (element) {

                                element.style.visibility =
                                    "visible";

                            }
                        );

                    document
                        .querySelectorAll(
                            "#mobileAbsensiContainer .absensi-card"
                        )
                        .forEach(
                            function (element) {

                                element.style.visibility =
                                    "visible";

                            }
                        );

                }
            )

            .withFailureHandler(
                function (error) {

                    if (
                        studentRequestId !==
                        absensiStudentRequestId
                    ) {
                        return;
                    }

                    console.error(error);

                    showToast(
                        "Gagal memuat data absensi.",
                        "error"
                    );

                }
            )

            .getAttendanceByClassAndDate(
                kelas,
                tanggal
            );

    }

    function initAbsensiTanggal() {

        const today =
            new Date();

        const tanggal =

            today
                .toISOString()
                .split('T')[0];

        document
            .getElementById(
                'tanggalAbsensi'
            )
            .value = tanggal;

        updateHariAbsensi();

    }

    function updateHariAbsensi() {

        const tanggal =
            document
                .getElementById(
                    'tanggalAbsensi'
                )
                .value;

        if (!tanggal) {
            return;
        }

        const hariLocale =
            new Intl.DateTimeFormat(
                'id-ID',
                {weekday: 'long'}
            ).format(
                new Date(tanggal)
            );

        const hari =
            hariLocale === 'Minggu'
                ? 'Ahad'
                : hariLocale;

        document
            .getElementById(
                'hariAbsensi'
            )
            .value = hari;

    }

    function setStatusAbsen(
        nisn,
        status
    ) {

        if (

            modeAbsensi === "revisi"

            &&

            !modeEditAbsensi

        ) {

            return;

        }

        ["H", "S", "I", "A"]
            .forEach(function (kode) {

                const btn =
                    document.getElementById(
                        kode + "_" + nisn
                    );

                if (btn) {

                    btn.className =
                        "btn btn-outline-secondary btn-sm";

                }

            });

        let kode = "H";

        if (status === "Sakit") {
            kode = "S";
        }

        if (status === "Izin") {
            kode = "I";
        }

        if (status === "Alpa") {
            kode = "A";
        }

        const btn =
            document.getElementById(
                kode + "_" + nisn
            );

        if (btn) {

            if (status === "Hadir") {

                btn.className =
                    "btn btn-success btn-sm";

            }

            if (status === "Sakit") {

                btn.className =
                    "btn btn-primary btn-sm";

            }

            if (status === "Izin") {

                btn.className =
                    "btn btn-warning btn-sm";

            }

            if (status === "Alpa") {

                btn.className =
                    "btn btn-danger btn-sm";

            }

        }

        const input =
            document.getElementById(
                "status_" + nisn
            );

        if (!input) {
            return;
        }

        input.value = status;

        const row =
            input.closest("tr");

        if (row) {

            row.classList.remove(
                "table-danger"
            );

        }

        const card =
            input.closest(".absensi-card");

        if (card) {

            card.classList.remove(
                "border-danger"
            );

        }

    }

    function resetStatusAbsensi() {

        document
            .querySelectorAll(
                'input[id^="status_"]'
            )
            .forEach(function (input) {

                input.value = "";

            });

        document
            .querySelectorAll(
                '#tableAbsensi button, #mobileAbsensiContainer button'
            )
            .forEach(function (btn) {

                btn.className =
                    "btn btn-outline-secondary btn-sm";

            });

        setSimpanAbsensiDisabled(
            false
        );

        setHadirSemuaDisabled(
            false
        );

    }

    function hadirSemua() {

        const inputs =

            document.querySelectorAll(
                '[id^="status_"]'
            );

        inputs.forEach(function (item) {

            const nisn =
                item.id.replace(
                    "status_",
                    ""
                );

            setStatusAbsen(
                nisn,
                "Hadir"
            );

        });

    }

    function filterSiswaAbsensi() {

        const keyword =

            document
                .getElementById(
                    "cariSiswaAbsensi"
                )
                .value
                .toLowerCase();

        const rows =
            isMobileLayout()

                ?

                document.querySelectorAll(
                    "#mobileAbsensiContainer .absensi-card"
                )

                :

                document.querySelectorAll(
                    "#tableAbsensi tr"
                );

        rows.forEach(function (row) {

            const text =

                row.innerText
                    .toLowerCase();

            row.style.display =

                text.includes(
                    keyword
                )

                    ? ""

                    : "none";

        });

    }

    function mulaiRevisiAbsensi() {

        const modal =

            new bootstrap.Modal(

                document.getElementById(
                    "modalRevisiAbsensi"
                )

            );

        modal.show();

    }

    function konfirmasiRevisiAbsensi() {

        modeEditAbsensi = true;

        setHadirSemuaDisabled(
            false
        );

        setSimpanAbsensiText(

            '<i class="fa-solid fa-floppy-disk"></i> Simpan Revisi',

            "btn-primary"

        );

        setSimpanAbsensiDisabled(
            false
        );

        const modal =

            bootstrap.Modal.getInstance(

                document.getElementById(
                    "modalRevisiAbsensi"
                )

            );

        if (modal) {

            modal.hide();

        }

    }

    function konfirmasiSimpanRevisi() {

        const modal =

            new bootstrap.Modal(

                document.getElementById(
                    "modalKonfirmasiRevisi"
                )

            );

        modal.show();

    }

    function simpanRevisiFinal() {

        if (!dataRevisiPending) {
            return;
        }

        const btn =

            document.getElementById(
                "btnYaSimpanRevisi"
            );

        startButtonLoading(
            btn,
            "Menyimpan..."
        );

        google.script.run

            .withSuccessHandler(function () {

                successButtonLoading(
                    btn,
                    "Tersimpan"
                );

                btn.classList.remove(
                    "btn-warning"
                );

                btn.classList.add(
                    "btn-success"
                );

                showToast(
                    "Revisi absensi berhasil disimpan"
                );

                dataRevisiPending = null;

                const modalEl =

                    document.getElementById(
                        "modalKonfirmasiRevisi"
                    );

                const modal =

                    bootstrap.Modal.getInstance(
                        modalEl
                    );

                if (modal) {
                    modal.hide();
                }

                setTimeout(function () {

                    loadExistingAttendance();

                }, 200);

                setTimeout(function () {

                    btn.classList.remove(
                        "btn-success"
                    );

                    btn.classList.add(
                        "btn-warning"
                    );

                    stopButtonLoading(
                        btn
                    );

                }, 1000);

            })

            .withFailureHandler(function (error) {

                console.error(error);

                btn.classList.remove(
                    "btn-success"
                );

                btn.classList.add(
                    "btn-warning"
                );

                stopButtonLoading(
                    btn
                );

                showToast(
                    "Gagal menyimpan revisi",
                    "error"
                );

            })

            .reviseAttendance(

                dataRevisiPending.kelas,

                dataRevisiPending.tanggal,

                dataRevisiPending.data

            );

    }

    function batalkanPerubahanRevisi() {

        dataRevisiPending = null;

        const modal =

            bootstrap.Modal.getInstance(

                document.getElementById(
                    "modalKonfirmasiRevisi"
                )

            );

        if (modal) {
            modal.hide();
        }

        modeEditAbsensi = false;

        loadExistingAttendance();

        showToast(
            "Perubahan revisi dibatalkan",
            "warning"
        );

    }

    function simpanAbsensi() {

        if (

            modeAbsensi === "revisi"

            &&

            !modeEditAbsensi

        ) {

            mulaiRevisiAbsensi();

            return;

        }

        const btnSimpan =

            document.getElementById(
                "btnSimpanAbsensi"
            );

        const tanggal =

            document.getElementById(
                "tanggalAbsensi"
            ).value;

        const kelas =

            document.getElementById(
                "filterKelasAbsensi"
            ).value;

        if (!tanggal || !kelas) {

            showToast(
                "Pilih tanggal dan kelas terlebih dahulu",
                "warning"
            );

            return;

        }

        const rows =
            isMobileLayout()
                ?
                document.querySelectorAll(
                    "#mobileAbsensiContainer .absensi-card"
                )
                :
                document.querySelectorAll(
                    "#tableAbsensi tr"
                );

        const data = [];

        let adaYangKosong = false;

        rows.forEach(function (row) {

            const hiddenInput =

                row.querySelector(
                    'input[id^="status_"]'
                );

            if (!hiddenInput) {
                return;
            }

            const nisn =

                hiddenInput.id.replace(
                    "status_",
                    ""
                );

            const status =
                hiddenInput.value;

            if (!status) {

                adaYangKosong = true;

                return;

            }

            const nama =

                row
                    .querySelector(".nama-siswa")
                    .innerText
                    .trim();

            data.push({

                tanggal: tanggal,

                nisn: nisn,

                nama: nama,

                kelas: kelas,

                status: status,

                inputOleh:

                    localStorage.getItem(
                        "wongmit_nama"
                    )

            });

        });

        if (adaYangKosong) {

            rows.forEach(function (row) {

                const input =
                    row.querySelector(
                        'input[id^="status_"]'
                    );

                if (!input || input.value) {
                    return;
                }

                row.classList.add(
                    "table-danger"
                );

                const card =
                    row.closest(".absensi-card");

                if (card) {

                    card.classList.add(
                        "border-danger"
                    );

                }

            });

            const siswaKosong =

                document.querySelector(

                    'input[id^="status_"][value=""]'

                );

            if (siswaKosong) {

                const target =
                    siswaKosong.closest("tr")
                    ||
                    siswaKosong.closest(".absensi-card");

                if (target) {

                    target.scrollIntoView({

                        behavior: "smooth",

                        block: "center"

                    });

                }

            }

            const modal =

                new bootstrap.Modal(

                    document.getElementById(
                        "modalWarningAbsensi"
                    )

                );

            modal.show();

            showToast(
                "Lengkapi absensi yang masih kosong",
                "warning"
            );

            return;

        }

        if (data.length === 0) {

            showToast(
                "Belum ada absensi yang dipilih",
                "warning"
            );

            return;

        }

        const proses =

            modeAbsensi === "revisi"

                &&

                modeEditAbsensi

                ?

                "revisi"

                :

                "baru";

        if (proses === "baru") {

            setSimpanAbsensiDisabled(
                true
            );

            startSimpanAbsensiLoading(
                "Menyimpan..."
            );

            google.script.run
                .withSuccessHandler(function () {

                    // Hapus draft karena sudah berhasil disimpan
                    draftAbsensi = {};

                    successSimpanAbsensiLoading(
                        "Tersimpan"
                    );

                    showToast(
                        "Absensi berhasil disimpan"
                    );

                    loadExistingAttendance();

                })
                .withFailureHandler(function (error) {

                    stopSimpanAbsensiLoading();

                    console.error(error);

                    setSimpanAbsensiDisabled(
                        false
                    );

                    showToast(
                        "Gagal menyimpan absensi",
                        "error"
                    );

                })
                .saveAttendance(data);

        } else {

            dataRevisiPending = {

                kelas: kelas,

                tanggal: tanggal,

                data: data

            };

            konfirmasiSimpanRevisi();

            return;

        }

    }

    function loadKelasAbsensi() {

        google.script.run
            .withSuccessHandler(function (data) {

                data = JSON.parse(data);

                let html =

                    '<option value="">Pilih Kelas</option>';

                data.forEach(function (kelas) {

                    html += `

          <option value="${kelas.nama}">

            ${kelas.nama}

          </option>

        `;

                });

                const select =

                    document.getElementById(
                        'filterKelasAbsensi'
                    );

                if (select) {

                    select.innerHTML = html;

                }

            })
            .getKelasAbsensi(

                localStorage.getItem(
                    "wongmit_session"
                )

            );

    }

</script>
