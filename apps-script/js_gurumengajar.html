<script>

    /* GURU MENGAJAR */

    function filterGuruMengajar() {
        var keyword = (document.getElementById('guruSearchGuruMengajar').value || '').toLowerCase();
        var rows = document.querySelectorAll('#tableGuruMengajar tr');
        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (row.cells.length === 1) continue;
            var text = row.textContent.toLowerCase();
            row.style.display = text.indexOf(keyword) !== -1 ? '' : 'none';
        }
    }

    function loadHariMengajar(callback) {

        google.script.run
            .withSuccessHandler(function (hari) {

                const select =
                    document.getElementById(
                        "hariMengajar"
                    );

                if (!select) {
                    return;
                }

                select.innerHTML = "";

                const optionDefault =
                    document.createElement("option");

                optionDefault.value = "";

                optionDefault.textContent =
                    "Pilih Hari";

                select.appendChild(
                    optionDefault
                );

                hari.forEach(function (namaHari) {

                    const option =
                        document.createElement("option");

                    option.value = namaHari;

                    option.textContent = namaHari;

                    select.appendChild(option);

                });

                if (typeof callback === "function") {
                    callback();
                }

            })
            .withFailureHandler(function (error) {

                console.error(
                    "Gagal memuat daftar hari:",
                    error
                );

                if (typeof callback === "function") {
                    callback();
                }

            })
            .getWeekDays();

    }

    function loadMapelCheckbox(callback) {

        google.script.run
            .withSuccessHandler(function (result) {

                const data =
                    JSON.parse(result);

                const container =
                    document.getElementById(
                        "listMapelMengajar"
                    );

                container.innerHTML = "";

                if (data.length <= 1) {

                    container.innerHTML =

                        '<div class="text-muted">' +

                        'Belum ada mata pelajaran.'

                        +

                        '</div>';

                    return;

                }

                let html =

                    '<div class="row">';

                let jumlahAktif = 0;

                for (
                    let i = 1;
                    i < data.length;
                    i++
                ) {

                    if (
                        data[i][3] !== "Aktif"
                    ) {
                        continue;
                    }

                    jumlahAktif++;

                    html +=

                        '<div class="col-md-6 mb-2">' +

                        '<div class="form-check">' +

                        '<input ' +

                        'class="form-check-input mapel-check" ' +

                        'type="checkbox" ' +

                        'value="' +

                        data[i][1] +

                        '">' +

                        '<label class="form-check-label">' +

                        data[i][1] +

                        '</label>' +

                        '</div>' +

                        '</div>';

                }

                html +=
                    '</div>';

                if (jumlahAktif === 0) {

                    container.innerHTML =

                        '<div class="text-muted">' +

                        'Belum ada mata pelajaran aktif.'

                        +

                        '</div>';

                    return;

                }

                container.innerHTML =
                    html;

                if (
                    typeof callback ===
                    "function"
                ) {

                    callback();

                }

            })

            .withFailureHandler(function (error) {

                console.error(error);

                document.getElementById(
                    "listMapelMengajar"
                ).innerHTML =

                    '<div class="text-danger">' +

                    'Gagal memuat mata pelajaran.'

                    +

                    '</div>';

            })

            .getMapel(

                localStorage.getItem(
                    "wongmit_session"
                )

            );

    }

    function bukaModalGuruMengajar() {

        modeGuruMengajar =
            "tambah";

        editGuruMengajarRow =
            null;

        document.getElementById(
            "idRelasiMengajar"
        ).value = "";

        document.getElementById(
            "guruMengajar"
        ).value = "";

        document.getElementById(
            "kelasMengajar"
        ).value = "";

        document.getElementById(
            "hariMengajar"
        ).value = "";

        const checklist =

            document.querySelectorAll(
                "#listMapelMengajar input[type='checkbox']"
            );

        checklist.forEach(function (item) {

            item.checked = false;

        });

        document.getElementById(
            "statusMengajar"
        ).value = "Aktif";

        loadHariMengajar();
        loadMapelCheckbox();

        const modal =
            new bootstrap.Modal(
                document.getElementById(
                    "modalGuruMengajar"
                )
            );

        modal.show();

    }

    /* === IMPORT MASSAL GURU MENGAJAR === */

    function bukaModalImportGuruMengajar() {

        fileImportGuruMengajar = null;

        resetImportModal({

            fileName:

                "namaFileGuruMengajar",

            preview:

                "previewImportGuruMengajar"

        });

        document.getElementById(

            "fileImportGuruMengajar"

        ).value = "";

        workbookGuruMengajar = null;

        bootstrap.Modal

            .getOrCreateInstance(

                document.getElementById(

                    "modalImportGuruMengajar"

                )

            )

            .show();

        initDragDropGuruMengajar();

    }

    function downloadTemplateGuruMengajar() {

        google.script.run

            .withSuccessHandler(function (result) {

                window.open(
                    result.exportUrl,
                    "_blank"
                );

                google.script.run
                    .cleanupExportSpreadsheet(
                        result.spreadsheetId
                    );

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(

                    "Gagal membuat template",

                    "error"

                );

            })

            .downloadTemplateGuruMengajar();

    }

    document.addEventListener(

        "change",

        function (event) {

            if (

                event.target.id !==

                "fileImportGuruMengajar"

            ) {

                return;

            }

            if (

                event.target.files.length === 0

            ) {

                return;

            }

            fileImportGuruMengajar =

                event.target.files[0];

            document.getElementById(

                "namaFileGuruMengajar"

            ).innerHTML =

                "<strong>" +

                fileImportGuruMengajar.name +

                "</strong>";

            previewImportGuruMengajar();

        }

    );

    /* === PREVIEW IMPORT GURU MENGAJAR === */

    function previewImportGuruMengajar() {

        if (!fileImportGuruMengajar) {
            return;
        }

        readExcelFile(

            fileImportGuruMengajar,

            function (workbook, data) {

                workbookGuruMengajar =
                    workbook;

                loadMasterImportGuruMengajar(

                    function () {

                        renderPreviewGuruMengajar(data);

                    }

                );

            }

        );

    }

    /* === LOAD MASTER IMPORT === */

    function loadMasterImportGuruMengajar(callback) {

        loadMasterDataBundle(function (bundle) {

            masterGuruImport =
                bundle.Guru || [];

            masterKelasImport =
                bundle.Kelas || [];

            masterMapelImport =
                bundle.Mapel || [];

            if (typeof callback === "function") {
                callback();
            }

        });

    }

    function renderPreviewGuruMengajar(data) {

        const header =

            data[0] || [];

        const validHeader =

            header.length >= 9 &&

            header[0] === "Guru" &&

            header[1] === "Kelas" &&

            header[2] === "Hari" &&

            header[3] === "Mapel 1" &&

            header[4] === "Mapel 2" &&

            header[5] === "Mapel 3" &&

            header[6] === "Mapel 4" &&

            header[7] === "Mapel 5" &&

            header[8] === "Status";

        if (

            !validHeader

        ) {

            document.getElementById(

                "previewImportGuruMengajar"

            ).innerHTML =

                '<div class="alert alert-danger mb-0">' +

                '<i class="fa-solid fa-circle-xmark me-2"></i>' +

                '<strong>Template tidak sesuai.</strong><br>' +

                'Gunakan file Template Guru Mengajar yang disediakan.' +

                '</div>';

            return;

        }

        let totalValid = 0;

        let totalError = 0;

        let html =

            '<div class="table-responsive">' +

            '<table class="table table-bordered table-sm">' +

            '<tbody>';

        const maxRow =

            Math.min(

                data.length,

                6

            );

        for (

            let i = 0;

            i < maxRow;

            i++

        ) {

            html += "<tr>";

            let barisError = false;

            for (

                let j = 0;

                j < data[i].length;

                j++

            ) {

                let value =

                    data[i][j] || "";

                let style = "";

                if (

                    i > 0

                ) {

                    /* =========================
                       VALIDASI GURU
                    ========================= */

                    if (

                        j === 0 &&

                        String(value).trim() === ""

                    ) {

                        style =

                            ' class="table-danger"';

                        barisError = true;

                    }

                    const guruAda =

                        masterGuruImport.some(

                            function (item) {

                                return (

                                    item.nama ===

                                    String(value).trim()

                                );

                            }

                        );

                    if (

                        j === 0 &&

                        String(value).trim() !== "" &&

                        !guruAda

                    ) {

                        style =

                            ' class="table-danger"';

                        barisError = true;

                    }

                    /* =========================
                       VALIDASI KELAS
                    ========================= */

                    if (

                        j === 1 &&

                        String(value).trim() === ""

                    ) {

                        style =

                            ' class="table-danger"';

                        barisError = true;

                    }

                    const kelasAda =

                        masterKelasImport.some(

                            function (item) {

                                return (

                                    item.nama ===

                                    String(value).trim()

                                );

                            }

                        );

                    if (

                        j === 1 &&

                        String(value).trim() !== "" &&

                        !kelasAda

                    ) {

                        style =

                            ' class="table-danger"';

                        barisError = true;

                    }

                    /* =========================
                       VALIDASI HARI
                    ========================= */

                    if (

                        j === 2 &&

                        ![

                            "Ahad",
                            "Senin",
                            "Selasa",
                            "Rabu",
                            "Kamis",
                            "Sabtu"

                        ].includes(

                            String(value).trim()

                        )

                    ) {

                        style =

                            ' class="table-danger"';

                        barisError = true;

                    }

                    /* =========================
                       VALIDASI MAPEL
                    ========================= */

                    if (

                        j === 3 &&

                        String(value).trim() === ""

                    ) {

                        style =

                            ' class="table-danger"';

                        barisError = true;

                    }

                    if (

                        j >= 3 &&

                        j <= 7 &&

                        String(value).trim() !== ""

                    ) {

                        const mapelAda =

                            masterMapelImport.some(

                                function (item) {

                                    return (

                                        item.nama ===

                                        String(value).trim()

                                    );

                                }

                            );

                        if (

                            !mapelAda

                        ) {

                            style =

                                ' class="table-danger"';

                            barisError = true;

                        }

                    }

                    /*
                      Mapel 2–5 boleh kosong.
            
                      Validasi Master Mapel
                      dilakukan pada Preview
                      dan akan divalidasi ulang
                      pada Backend Import
                      (GM.4E).
                    */

                    /* =========================
                       VALIDASI STATUS
                    ========================= */

                    if (

                        j === 8 &&

                        ![

                            "Aktif",
                            "Nonaktif"

                        ].includes(

                            String(value).trim()

                        )

                    ) {

                        style =

                            ' class="table-danger"';

                        barisError = true;

                    }

                }

                html +=

                    i === 0

                        ?

                        "<th>" +

                        value +

                        "</th>"

                        :

                        "<td" +

                        style +

                        ">" +

                        value +

                        "</td>";

            }

            if (

                i > 0

            ) {

                if (

                    barisError

                ) {

                    totalError++;

                }

                else {

                    totalValid++;

                }

            }

            html += "</tr>";

        }

        html +=

            "</tbody>" +

            "</table>" +

            "</div>";

        html += buildPreviewSummary(

            data.length - 1,

            totalValid,

            totalError

        );

        document.getElementById(

            "btnUploadGuruMengajar"

        ).disabled =

            totalError > 0;

        document.getElementById(

            "previewImportGuruMengajar"

        ).innerHTML =

            html;

    }

    /* === UPLOAD IMPORT GURU MENGAJAR === */

    function uploadImportGuruMengajar() {

        uploadImportEngine({

            file: fileImportGuruMengajar,

            button: "btnUploadGuruMengajar",

            onRead: function (workbook, rows, btn) {

                workbookGuruMengajar = workbook;

                rows.shift();

                google.script.run

                    .withSuccessHandler(function (hasil) {

                        successButtonLoading(

                            btn,

                            "Berhasil"

                        );

                        showToast(

                            hasil.berhasil +

                            " data berhasil diimport."

                        );

                        setTimeout(function () {

                            stopButtonLoading(

                                btn

                            );

                            bootstrap.Modal

                                .getInstance(

                                    document.getElementById(

                                        "modalImportGuruMengajar"

                                    )

                                )

                                ?.hide();

                            loadGuruMengajar();

                        }, 800);

                    })

                    .withFailureHandler(function (error) {

                        console.error(error);

                        stopButtonLoading(

                            btn

                        );

                        showToast(

                            error.message,

                            "error"

                        );

                    })

                    .importGuruMengajar(

                        localStorage.getItem(

                            "wongmit_session"

                        ),

                        rows

                    );

            }

        });

    }

    /* === DRAG & DROP IMPORT GURU MENGAJAR === */

    function initDragDropGuruMengajar() {

        initImportDragDrop({

            dropArea: "dropAreaGuruMengajar",

            fileInput: "fileImportGuruMengajar",

            fileLabel: "namaFileGuruMengajar",

            preview: previewImportGuruMengajar,

            setFile: function (file) {

                fileImportGuruMengajar = file;

            }

        });

    }

    /* === GURU MENGAJAR === */

    function loadGuruMengajar() {

        loadMapel();

        loadGuruDropdown();

        loadKelasDropdown();

        google.script.run
            .withSuccessHandler(function (result) {

                const data =
                    JSON.parse(result);

                const tbody =
                    document.getElementById(
                        "tableGuruMengajar"
                    );

                tbody.innerHTML = "";

                if (data.length <= 1) {

                    tbody.innerHTML =

                        '<tr>' +
                        '<td colspan="6" class="text-center py-4">' +
                        'Belum ada data guru mengajar' +
                        '</td>' +
                        '</tr>';

                    return;

                }

                for (
                    let i = 1;
                    i < data.length;
                    i++
                ) {

                    tbody.innerHTML +=

                        '<tr>' +

                        '<td>' +
                        data[i][2] +
                        '</td>' +

                        '<td>' +
                        data[i][3] +
                        '</td>' +

                        '<td>' +
                        data[i][4] +
                        '</td>' +

                        '<td>' +
                        String(
                            data[i][5]
                        ).split("|").join(" | ") +
                        '</td>' +

                        '<td>' +
                        data[i][6] +
                        '</td>' +

                        '<td>' +

                        '<button ' +
                        'class="btn btn-warning btn-sm me-1" ' +
                        'onclick="editGuruMengajar(\'' +
                        data[i][0] +
                        '\')">' +

                        '<i class="fa-solid fa-pen"></i>' +

                        '</button>' +

                        '<button ' +
                        'class="btn btn-danger btn-sm" ' +
                        'onclick="hapusGuruMengajar(\'' +
                        data[i][0] +
                        '\')">' +

                        '<i class="fa-solid fa-trash"></i>' +

                        '</button>' +

                        '</td>' +

                        '</tr>';

                }

            })
            .withFailureHandler(function (error) {

                console.error(error);

                showToast(
                    "Gagal memuat data guru mengajar",
                    "error"
                );

            })
            .getGuruMengajar(

                localStorage.getItem(
                    "wongmit_session"
                )

            );

    }

    function editGuruMengajar(idRelasi) {

        modeGuruMengajar =
            "edit";

        google.script.run

            .withSuccessHandler(function (data) {

                if (!data) {

                    showToast(
                        "Data tidak ditemukan",
                        "warning"
                    );

                    return;

                }

                editGuruMengajarRow =
                    data.rowIndex;

                document.getElementById(
                    "idRelasiMengajar"
                ).value =
                    data.idRelasi;

                document.getElementById(
                    "guruMengajar"
                ).value =
                    data.idGuru;

                document.getElementById(
                    "kelasMengajar"
                ).value =
                    data.kelas;

                document.getElementById(
                    "statusMengajar"
                ).value =
                    data.status;

                loadHariMengajar(function () {

                    document.getElementById(
                        "hariMengajar"
                    ).value =
                        data.hari;

                    loadMapelCheckbox(function () {

                        const daftarMapel =
                            String(
                                data.mapel
                            ).split("|");

                        document
                            .querySelectorAll(
                                "#listMapelMengajar .mapel-check"
                            )
                            .forEach(function (item) {

                                item.checked =
                                    daftarMapel.includes(
                                        item.value
                                    );

                            });

                        const modal =
                            new bootstrap.Modal(
                                document.getElementById(
                                    "modalGuruMengajar"
                                )
                            );

                        modal.show();

                    });

                });

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(
                    "Gagal memuat data",
                    "error"
                );

            })

            .getGuruMengajarById(
                idRelasi
            );

    }

    function hapusGuruMengajar(

        idRelasi

    ) {

        showConfirmModal(

            "Hapus Guru Mengajar",

            "Apakah Anda yakin ingin menghapus data guru mengajar ini?",

            function () {

                prosesHapusGuruMengajar(

                    idRelasi

                );

            }

        );

    }

    function prosesHapusGuruMengajar(

        idRelasi

    ) {

        const btn =

            document.getElementById(

                "btnYaKonfirmasiGlobal"

            );

        startButtonLoading(

            btn,

            "Menghapus..."

        );

        google.script.run

            .withSuccessHandler(function () {

                successButtonLoading(

                    btn,

                    "Berhasil"

                );

                setTimeout(function () {

                    stopButtonLoading(

                        btn

                    );

                    bootstrap.Modal

                        .getInstance(

                            document.getElementById(

                                "modalKonfirmasiGlobal"

                            )

                        )

                        ?.hide();

                    showToast(

                        "Data berhasil dihapus"

                    );

                    loadGuruMengajar();

                }, 800);

            })

            .withFailureHandler(function (error) {

                console.error(error);

                stopButtonLoading(

                    btn

                );

                showToast(

                    "Gagal menghapus data",

                    "error"

                );

            })

            .deleteGuruMengajar(

                localStorage.getItem(

                    "wongmit_session"

                ),

                idRelasi

            );

    }

    function simpanGuruMengajar() {

        const btn =

            document.getElementById(
                "btnSimpanGuruMengajar"
            );

        startButtonLoading(
            btn
        );

        const data = {

            idRelasi:

                document.getElementById(
                    "idRelasiMengajar"
                ).value

                ||

                Date.now(),

            idGuru:

                document.getElementById(
                    "guruMengajar"
                ).value,

            kelas:

                document.getElementById(
                    "kelasMengajar"
                ).value,

            hari:

                document.getElementById(
                    "hariMengajar"
                ).value,

            mapel: (() => {

                const hasil = [];

                document
                    .querySelectorAll(
                        "#listMapelMengajar .mapel-check:checked"
                    )
                    .forEach(function (item) {

                        hasil.push(
                            item.value
                        );

                    });

                return hasil.join("|");

            })(),

            status:

                document.getElementById(
                    "statusMengajar"
                ).value

        };

        if (

            !data.idGuru ||

            !data.kelas ||

            !data.hari ||

            !data.mapel

        ) {

            stopButtonLoading(
                btn
            );

            showToast(
                "Lengkapi semua data",
                "warning"
            );

            return;

        }

        const runner =

            google.script.run

                .withSuccessHandler(function () {

                    successButtonLoading(
                        btn
                    );

                    showToast(

                        modeGuruMengajar === "edit"

                            ?

                            "Data guru mengajar berhasil diperbarui"

                            :

                            "Data guru mengajar berhasil disimpan"

                    );

                    setTimeout(function () {

                        stopButtonLoading(
                            btn
                        );

                        const modal =

                            bootstrap.Modal.getInstance(

                                document.getElementById(
                                    "modalGuruMengajar"
                                )

                            );

                        if (modal) {
                            modal.hide();
                        }

                        loadGuruMengajar();

                    }, 1000);

                })

                .withFailureHandler(function (error) {

                    console.error(error);

                    stopButtonLoading(
                        btn
                    );

                    showToast(
                        "Gagal menyimpan data",
                        "error"
                    );

                });

        if (

            modeGuruMengajar === "edit"

        ) {

            runner.updateGuruMengajar(

                localStorage.getItem(
                    "wongmit_session"
                ),

                editGuruMengajarRow,

                data

            );

        } else {

            runner.addGuruMengajar(

                localStorage.getItem(
                    "wongmit_session"
                ),

                data

            );

        }

    }

</script>
