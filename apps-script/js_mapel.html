<script>

    /* === STATE MAPEL === */

    let modeMapel =
        "tambah";

    let editMapelRow =
        null;

    let fileImportMapel =
        null;

    /* === TEMPLATE MAPEL === */

    function downloadTemplateMapel() {

        google.script.run

            .withSuccessHandler(function (result) {

                window.open(
                    result.exportUrl,
                    "_blank"
                );

                google.script.run
                    .cleanupExportSpreadsheet(
                        result.spreadsheetId
                    );

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(
                    "Gagal membuat template",
                    "error"
                );

            })

            .downloadTemplateMapel();

    }

    /* === IMPORT MASSAL MAPEL === */

    function bukaModalImportMapel() {

        fileImportMapel = null;

        resetImportModal({

            fileName:

                "namaFileMapel",

            preview:

                "previewImportMapel"

        });

        bootstrap.Modal

            .getOrCreateInstance(

                document.getElementById(

                    "modalImportMapel"

                )

            )

            .show();

        setTimeout(function () {

            initDragDropMapel();

        }, 100);

    }

    document.addEventListener(

        "change",

        function (event) {

            if (

                event.target.id !==

                "fileImportMapel"

            ) {

                return;

            }

            if (

                event.target.files.length === 0

            ) {

                return;

            }

            fileImportMapel =

                event.target.files[0];

            previewImportMapel();

            document.getElementById(

                "namaFileMapel"

            ).innerHTML =

                "<strong>" +

                fileImportMapel.name +

                "</strong>";

        }

    );

    /* === PREVIEW IMPORT MAPEL === */

    function previewImportMapel() {

        if (!fileImportMapel) {
            return;
        }

        readExcelFile(

            fileImportMapel,

            function (workbook, data) {

                renderPreviewMapel(data);

            }

        );

    }

    function renderPreviewMapel(data) {

        const header =

            data[0] || [];

        const validHeader =

            header.length >= 3 &&

            header[0] === "Nama Mapel" &&

            header[1] === "Kelompok" &&

            header[2] === "Status";

        if (

            !validHeader

        ) {

            document.getElementById(

                "previewImportMapel"

            ).innerHTML =

                '<div class="alert alert-danger mb-0">' +

                '<i class="fa-solid fa-circle-xmark me-2"></i>' +

                '<strong>Template tidak sesuai.</strong><br>' +

                'Gunakan file Template Mapel yang disediakan.' +

                '</div>';

            const btnUpload =

                document.getElementById(
                    "btnUploadMapel"
                );

            if (btnUpload) {

                btnUpload.disabled = true;

            }

            return;

        }

        let totalValid = 0;

        let totalError = 0;

        let html =

            '<div class="table-responsive">' +

            '<table class="table table-bordered table-sm">' +

            '<tbody>';

        const maxRow =

            Math.min(

                data.length,

                6

            );

        for (

            let i = 0;

            i < maxRow;

            i++

        ) {

            html += "<tr>";

            let barisError = false;

            for (

                let j = 0;

                j < data[i].length;

                j++

            ) {

                let value =

                    data[i][j] || "";

                let style = "";

                if (

                    i > 0

                ) {

                    if (

                        j === 0 &&

                        String(value).trim() === ""

                    ) {

                        style =
                            ' class="table-danger"';

                        barisError = true;

                    }

                    if (

                        j === 1 &&

                        ![

                            "PAI",
                            "Umum",
                            "Mulok"

                        ].includes(

                            String(value).trim()

                        )

                    ) {

                        style =
                            ' class="table-danger"';

                        barisError = true;

                    }

                    if (

                        j === 2 &&

                        ![

                            "Aktif",
                            "Nonaktif"

                        ].includes(

                            String(value).trim()

                        )

                    ) {

                        style =
                            ' class="table-danger"';

                        barisError = true;

                    }

                }

                if (

                    i === 0

                ) {

                    html +=

                        "<th>" +

                        value +

                        "</th>";

                }

                else {

                    html +=

                        "<td" +

                        style +

                        ">" +

                        value +

                        "</td>";

                }

            }

            if (

                i > 0

            ) {

                if (barisError) {

                    totalError++;

                }

                else {

                    totalValid++;

                }

            }

            html += "</tr>";

        }

        html +=

            "</tbody>" +

            "</table>" +

            "</div>";

        html +=

            '<div class="mt-3">' +

            '<div class="alert ' +

            (

                totalError > 0

                    ?

                    'alert-warning'

                    :

                    'alert-success'

            ) +

            '">' +

            '<strong>Total Data :</strong> ' +

            (data.length - 1) +

            '<br>' +

            '<strong>Valid :</strong> ' +

            totalValid +

            '<br>' +

            '<strong>Error :</strong> ' +

            totalError +

            '</div>' +

            '</div>';

        const btnUpload =

            document.getElementById(
                "btnUploadMapel"
            );

        if (

            btnUpload

        ) {

            btnUpload.disabled =

                totalError > 0;

        }

        document.getElementById(

            "previewImportMapel"

        ).innerHTML =

            html;

    }

    /* === UPLOAD IMPORT MAPEL === */

    function uploadImportMapel() {

        uploadImportEngine({

            file: fileImportMapel,

            button: "btnUploadMapel",

            onRead: function (workbook, data, btn) {

                data.shift();

                google.script.run

                    .withSuccessHandler(function (hasil) {

                        stopButtonLoading(btn);

                        bootstrap.Modal

                            .getInstance(

                                document.getElementById(

                                    "modalImportMapel"

                                )

                            )

                            ?.hide();

                        loadMapel();

                        loadMapelCheckbox();

                        let pesan = "";

                        if (hasil.berhasil > 0) {

                            pesan +=

                                "Berhasil : " +

                                hasil.berhasil +

                                " data";

                        }

                        if (hasil.gagal > 0) {

                            if (pesan !== "") {

                                pesan += "\n";

                            }

                            pesan +=

                                "Duplikat : " +

                                hasil.gagal +

                                " data";

                        }

                        if (hasil.berhasil === 0) {

                            showToast(

                                "Seluruh data sudah ada.\n\n" +

                                pesan,

                                "warning"

                            );

                        }

                        else {

                            showToast(

                                "Import selesai.\n\n" +

                                pesan

                            );

                        }

                    })

                    .withFailureHandler(function (error) {

                        console.error(error);

                        stopButtonLoading(btn);

                        showToast(

                            "Import gagal",

                            "error"

                        );

                    })

                    .importMapel(

                        localStorage.getItem(

                            "wongmit_session"

                        ),

                        data

                    );

            }

        });

    }

    /* DRAG & DROP IMPORT MAPEL  */

    function initDragDropMapel() {

        const dropArea =

            document.getElementById(
                "dropAreaMapel"
            );

        if (!dropArea) {
            return;
        }

        /* =========================
          CLICK
        ========================= */

        dropArea.addEventListener(

            "click",

            function () {

                document.getElementById(

                    "fileImportMapel"

                ).click();

            }

        );

        dropArea.addEventListener(

            "dragover",

            function (e) {

                e.preventDefault();

                dropArea.classList.add(
                    "border-primary"
                );

                dropArea.style.background =
                    "#eef5ff";

            }

        );

        dropArea.addEventListener(

            "dragleave",

            function () {

                dropArea.classList.remove(
                    "border-primary"
                );

                dropArea.style.background =
                    "#fafafa";

            }

        );

        dropArea.addEventListener(

            "drop",

            function (e) {

                e.preventDefault();

                dropArea.classList.remove(
                    "border-primary"
                );

                dropArea.style.background =
                    "#fafafa";

                if (

                    e.dataTransfer.files.length === 0

                ) {

                    return;

                }

                fileImportMapel =

                    e.dataTransfer.files[0];

                document.getElementById(

                    "namaFileMapel"

                ).innerHTML =

                    "<strong>" +

                    fileImportMapel.name +

                    "</strong>";

                previewImportMapel();

            }

        );

    }

    function loadMapel() {

        google.script.run

            .withSuccessHandler(function (result) {

                const data =
                    JSON.parse(result);

                const tbody =

                    document.getElementById(
                        "tableMapel"
                    );

                tbody.innerHTML = "";

                if (data.length <= 1) {

                    tbody.innerHTML =

                        '<tr>' +

                        '<td colspan="4" class="text-center py-4">' +

                        'Belum ada data mata pelajaran' +

                        '</td>' +

                        '</tr>';

                    return;

                }

                for (

                    let i = 1;

                    i < data.length;

                    i++

                ) {

                    tbody.innerHTML +=

                        '<tr>' +

                        '<td>' +

                        data[i][1] +

                        '</td>' +

                        '<td>' +

                        data[i][2] +

                        '</td>' +

                        '<td>' +

                        data[i][3] +

                        '</td>' +

                        '<td>' +

                        '<button ' +
                        'class="btn btn-sm btn-warning me-1" ' +
                        'onclick="editMapel(\'' +
                        data[i][0] +
                        '\')">' +

                        '<i class="fa-solid fa-pen"></i>' +

                        '</button>' +

                        '<button ' +
                        'class="btn btn-sm btn-danger" ' +
                        'onclick="hapusMapel(\'' +
                        data[i][0] +
                        '\')">' +

                        '<i class="fa-solid fa-trash"></i>' +

                        '</button>' +

                        '</td>' +

                        '</tr>';

                }

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(

                    "Gagal memuat data mata pelajaran",

                    "error"

                );

            })

            .getMapel(

                localStorage.getItem(

                    "wongmit_session"

                )

            );

    }

    function editMapel(idMapel) {

        google.script.run

            .withSuccessHandler(function (data) {

                if (!data) {

                    showToast(
                        "Data tidak ditemukan",
                        "error"
                    );

                    return;

                }

                modeMapel =
                    "edit";

                editMapelRow =
                    data.rowIndex;

                document.getElementById(
                    "idMapel"
                ).value =
                    data.idMapel;

                document.getElementById(
                    "namaMapel"
                ).value =
                    data.namaMapel;

                document.getElementById(
                    "kelompokMapel"
                ).value =
                    data.kelompok;

                document.getElementById(
                    "statusMapel"
                ).value =
                    data.status;

                bootstrap.Modal
                    .getOrCreateInstance(

                        document.getElementById(
                            "modalMapel"
                        )

                    )
                    .show();

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(
                    "Gagal membaca data",
                    "error"
                );

            })

            .getMapelById(
                idMapel
            );

    }

    function showMapelUsage(
        namaMapel,
        data
    ) {

        document.getElementById(
            "mapelUsageTitle"
        ).textContent =
            namaMapel;

        document.getElementById(
            "mapelUsageCount"
        ).textContent =
            data.length;

        const tbody =

            document.getElementById(
                "tableMapelUsage"
            );

        tbody.innerHTML = "";

        for (
            let i = 0;
            i < data.length;
            i++
        ) {

            tbody.innerHTML +=

                "<tr>" +

                "<td>" +

                data[i].guru +

                "</td>" +

                "<td class='text-center'>" +

                data[i].kelas +

                "</td>" +

                "<td class='text-center'>" +

                data[i].hari +

                "</td>" +

                "</tr>";

        }

        bootstrap.Modal

            .getOrCreateInstance(

                document.getElementById(
                    "modalMapelUsage"
                )

            )

            .show();

    }

    function bukaModalMapel() {

        modeMapel =
            "tambah";

        editMapelRow =
            null;

        document.getElementById(
            "idMapel"
        ).value = "";

        document.getElementById(
            "namaMapel"
        ).value = "";

        document.getElementById(
            "kelompokMapel"
        ).value = "PAI";

        document.getElementById(
            "statusMapel"
        ).value = "Aktif";

        const modal =

            new bootstrap.Modal(

                document.getElementById(
                    "modalMapel"
                )

            );

        modal.show();

    }

    function simpanMapel() {

        const namaMapel =

            document.getElementById(
                "namaMapel"
            ).value.trim();

        const kelompok =

            document.getElementById(
                "kelompokMapel"
            ).value;

        const status =

            document.getElementById(
                "statusMapel"
            ).value;

        if (!namaMapel) {

            showToast(
                "Nama mata pelajaran wajib diisi",
                "warning"
            );

            return;

        }

        const btn =

            document.getElementById(
                "btnSimpanMapel"
            );

        startButtonLoading(
            btn,
            "Menyimpan..."
        );

        const data = {

            idMapel:

                modeMapel === "edit"

                    ? document.getElementById(
                        "idMapel"
                    ).value

                    : "MP" + Date.now(),

            namaMapel:
                namaMapel,

            kelompok:
                kelompok,

            status:
                status

        };

        if (

            modeMapel === "edit"

        ) {

            google.script.run

                .withSuccessHandler(function () {

                    successButtonLoading(
                        btn,
                        "Tersimpan"
                    );

                    showToast(
                        "Mata pelajaran berhasil diperbarui"
                    );

                    const modal =

                        bootstrap.Modal.getInstance(

                            document.getElementById(
                                "modalMapel"
                            )

                        );

                    if (modal) {
                        modal.hide();
                    }

                    loadMapel();

                    loadMapelCheckbox();

                    setTimeout(function () {

                        stopButtonLoading(
                            btn
                        );

                    }, 800);

                })

                .withFailureHandler(function (error) {

                    console.error(error);

                    stopButtonLoading(
                        btn
                    );

                    showToast(
                        "Gagal memperbarui mata pelajaran",
                        "error"
                    );

                })

                .updateMapel(

                    localStorage.getItem(
                        "wongmit_session"
                    ),

                    editMapelRow,

                    data

                );

        }

        else {

            google.script.run

                .withSuccessHandler(function () {

                    successButtonLoading(
                        btn,
                        "Tersimpan"
                    );

                    showToast(
                        "Mata pelajaran berhasil disimpan"
                    );

                    const modal =

                        bootstrap.Modal.getInstance(

                            document.getElementById(
                                "modalMapel"
                            )

                        );

                    if (modal) {
                        modal.hide();
                    }

                    loadMapel();

                    loadMapelCheckbox();

                    setTimeout(function () {

                        stopButtonLoading(
                            btn
                        );

                    }, 800);

                })

                .withFailureHandler(function (error) {

                    console.error(error);

                    stopButtonLoading(
                        btn
                    );

                    showToast(
                        "Gagal menyimpan mata pelajaran",
                        "error"
                    );

                })

                .addMapel(

                    localStorage.getItem(
                        "wongmit_session"
                    ),

                    data

                );

        }

    }

    function hapusMapel(
        idMapel
    ) {

        showDeleteConfirm(

            "Apakah Anda yakin ingin menghapus mata pelajaran ini?",

            function () {

                prosesHapusMapel(
                    idMapel
                );

            }

        );

        return;

    }

    function prosesHapusMapel(
        idMapel
    ) {

        const btn =

            document.getElementById(
                "btnDeleteConfirm"
            );

        startButtonLoading(

            btn,

            "Menghapus..."

        );

        google.script.run

            .withSuccessHandler(function (data) {

                if (!data) {

                    stopButtonLoading(
                        btn
                    );

                    showToast(
                        "Data tidak ditemukan",
                        "error"
                    );

                    return;

                }

                google.script.run

                    .withSuccessHandler(function (relasi) {

                        if (

                            Array.isArray(relasi) &&

                            relasi.length > 0

                        ) {

                            stopButtonLoading(
                                btn
                            );

                            bootstrap.Modal

                                .getInstance(

                                    document.getElementById(
                                        "modalDeleteConfirm"
                                    )

                                )

                                ?.hide();

                            showMapelUsage(

                                data.namaMapel,

                                relasi

                            );

                            return;

                        }

                        google.script.run

                            .withSuccessHandler(function () {

                                stopButtonLoading(
                                    btn
                                );

                                bootstrap.Modal

                                    .getInstance(

                                        document.getElementById(
                                            "modalDeleteConfirm"
                                        )

                                    )

                                    ?.hide();

                                showToast(
                                    "Mata pelajaran berhasil dihapus"
                                );

                                loadMapel();

                                loadMapelCheckbox();

                            })

                            .withFailureHandler(function (error) {

                                console.error(error);

                                stopButtonLoading(
                                    btn
                                );

                                showToast(
                                    "Gagal menghapus mata pelajaran",
                                    "error"
                                );

                            })

                            .deleteMapel(

                                localStorage.getItem(
                                    "wongmit_session"
                                ),

                                idMapel

                            );

                    })

                    .withFailureHandler(function (error) {

                        console.error(error);

                        stopButtonLoading(
                            btn
                        );

                        showToast(
                            "Gagal memeriksa relasi",
                            "error"
                        );

                    })

                    .getMapelUsage(
                        data.namaMapel
                    );

            })

            .withFailureHandler(function (error) {

                console.error(error);

                stopButtonLoading(
                    btn
                );

                showToast(
                    "Gagal membaca data",
                    "error"
                );

            })

            .getMapelById(
                idMapel
            );

    }

</script>
