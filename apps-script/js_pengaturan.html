<script>

  /* =========================
     MENU PENGATURAN AKADEMIK
  ========================= */

  let pengaturanDetailType = "";

  let pengaturanSekolahData = null;

  let pengaturanSistemData = null;

  /* State asset logo sekolah -
     aktif hanya saat mode Edit.
     Upload BUKAN commit - [Simpan]
     adalah satu-satunya commit. */

  let assetAwal = null;

  let assetPendingUpload = null;

  let assetPendingDelete = null;

  let fileDipilih = null;

  /* State asset Card Sistem (Sprint 4C) -
     state TERPISAH per slot: "logo"
     (logo_aplikasi) dan "favicon".
     Pola state machine FIX-2 dipakai
     ulang. Upload BUKAN commit - [Simpan]
     pada Card Sistem adalah satu-satunya
     commit. mode_maintenance TIDAK
     dikelola di sini (POST-4C). */

  function buatStateAssetSistem() {

    return {
      awal: null,
      pendingUpload: null,
      pendingDelete: null,
      fileDipilih: null
    };

  }

  let sistemAsset = {
    logo: buatStateAssetSistem(),
    favicon: buatStateAssetSistem()
  };

  const pengaturanDetailMeta = {
    akademik: {title: "Pengaturan Akademik", description: "Tahun ajaran, semester, dan hari libur sekolah."},
    sekolah: {title: "Pengaturan Sekolah", description: "Nama sekolah, kepala sekolah, dan logo sekolah."},
    sistem: {title: "Pengaturan Sistem", description: "Konfigurasi aplikasi, status sistem, dan backup/restore data."},
    "tahun-ajaran": {title: "Pengaturan Tahun Ajaran", description: "Proses naik kelas, kelulusan, dan arsip akan tersedia pada sprint berikutnya."}
  };

  function bukaPengaturanAkademik() {

    bukaPengaturanDetail("akademik");

  }

  function bukaPengaturanDetail(type) {

    const meta = pengaturanDetailMeta[type];
    const previewView = document.getElementById("pengaturanPreviewView");
    const detailView = document.getElementById("pengaturanDetailView");

    if (!meta || !previewView || !detailView) {
      return;
    }

    pengaturanDetailType = type;
    document.getElementById("pengaturanDetailTitle").innerText = meta.title;
    document.getElementById("pengaturanDetailDescription").innerText = meta.description;
    previewView.classList.add("d-none");
    detailView.classList.remove("d-none");

    if (type === "akademik") {
      tampilkanDetailAkademik();
      return;
    }

    if (type === "sekolah") {
      tampilkanDetailSekolah();
      return;
    }

    if (type === "sistem") {
      tampilkanDetailSistem();
      return;
    }

    tampilkanDetailBelumTersedia(type);

  }

  function kembaliKePreviewPengaturan() {

    const previewView = document.getElementById("pengaturanPreviewView");
    const detailView = document.getElementById("pengaturanDetailView");

    if (!previewView || !detailView) {
      return;
    }

    pengaturanDetailType = "";
    detailView.classList.add("d-none");
    previewView.classList.remove("d-none");

  }

  function tampilkanDetailAkademik() {

    const content = document.getElementById("pengaturanDetailContent");
    const actions = document.getElementById("pengaturanDetailActions");

    content.className = "pengaturan-detail-content";
    content.innerHTML = `
      <div class="pengaturan-detail-list">
        <div><strong>Tahun Ajaran</strong><span id="detailTahunAjaran">-</span></div>
        <div><strong>Semester</strong><span id="detailSemester">-</span></div>
        <div><strong>Hari Libur</strong><span id="detailHariLibur">-</span></div>
      </div>
    `;
    actions.innerHTML = `
      <button type="button" class="btn btn-primary" data-pengaturan-action="edit-akademik">
        <i class="fa-solid fa-pen"></i> Edit
      </button>
    `;
    perbaruiDetailAkademik();

  }

  function perbaruiDetailAkademik() {

    [["detailTahunAjaran", "previewTahunAjaran"], ["detailSemester", "previewSemester"], ["detailHariLibur", "previewHariLibur"]]
      .forEach(function (field) {
        const detail = document.getElementById(field[0]);
        const preview = document.getElementById(field[1]);

        if (detail && preview) {
          detail.innerText = preview.innerText;
        }
      });

  }

  function tampilkanDetailBelumTersedia(type) {

    const content = document.getElementById("pengaturanDetailContent");
    const actions = document.getElementById("pengaturanDetailActions");
    const meta = pengaturanDetailMeta[type];

    content.className = "pengaturan-detail-content";
    content.innerHTML = `
      <div class="pengaturan-empty-state">
        <i class="fa-solid fa-circle-info"></i>
        <p class="mb-0">${meta.title} belum memiliki data atau fungsi backend yang dapat dikelola. Detail ini disiapkan sebagai fondasi UI untuk sprint berikutnya.</p>
      </div>
    `;
    actions.innerHTML = `
      <button type="button" class="btn btn-secondary" disabled aria-disabled="true">
        <i class="fa-solid fa-pen"></i> Edit belum tersedia
      </button>
    `;

  }

  document.addEventListener("click", function (event) {

    const card = event.target.closest("[data-pengaturan-card]");

    if (card) {
      bukaPengaturanDetail(card.dataset.pengaturanCard);
      return;
    }

    const action = event.target.closest("[data-pengaturan-action]");

    if (!action) {
      return;
    }

    if (action.dataset.pengaturanAction === "back") {
      kembaliKePreviewPengaturan();
      return;
    }

    if (action.dataset.pengaturanAction === "edit-akademik") {
      aktifkanEditAkademik();
      return;
    }

    if (action.dataset.pengaturanAction === "save-akademik") {
      simpanAkademik();
      return;
    }

    if (action.dataset.pengaturanAction === "cancel-akademik") {
      batalEditAkademik();
      return;
    }

    if (action.dataset.pengaturanAction === "edit-sekolah") {
      aktifkanEditSekolah();
      return;
    }

    if (action.dataset.pengaturanAction === "save-sekolah") {
      simpanSekolah();
      return;
    }

    if (action.dataset.pengaturanAction === "cancel-sekolah") {
      batalEditSekolah();
      return;
    }

    if (action.dataset.pengaturanAction === "upload-logo-sekolah") {
      pilihFileLogoSekolah();
      return;
    }

    if (action.dataset.pengaturanAction === "hapus-logo-sekolah") {
      hapusGambarSekolah();
      return;
    }

    if (action.dataset.pengaturanAction === "edit-sistem") {
      aktifkanEditSistem();
      return;
    }

    if (action.dataset.pengaturanAction === "save-sistem") {
      simpanSistem();
      return;
    }

    if (action.dataset.pengaturanAction === "cancel-sistem") {
      batalEditSistem();
      return;
    }

    if (action.dataset.pengaturanAction === "upload-logo-aplikasi") {
      pilihFileAssetSistem("logo");
      return;
    }

    if (action.dataset.pengaturanAction === "hapus-logo-aplikasi") {
      hapusGambarSistem("logo");
      return;
    }

    if (action.dataset.pengaturanAction === "upload-favicon") {
      pilihFileAssetSistem("favicon");
      return;
    }

    if (action.dataset.pengaturanAction === "hapus-favicon") {
      hapusGambarSistem("favicon");
      return;
    }

  });

  document.addEventListener("change", function (event) {

    const id =
      event.target && event.target.id;

    if (id === "editLogoSekolahFile") {

      /* Pilih file BUKAN trigger upload -
         hanya validasi + preview lokal,
         menunggu konfirmasi admin. */

      tahapFileLogoSekolah(event.target);

      return;
    }

    /* Sprint 4C - Card Sistem: pilih file
       logo aplikasi / favicon BUKAN
       trigger upload - hanya validasi +
       preview lokal, menunggu konfirmasi
       admin via tombol Upload. */

    if (id === "editLogoAplikasiFile") {
      tahapFileAssetSistem(event.target, "logo");
      return;
    }

    if (id === "editFaviconFile") {
      tahapFileAssetSistem(event.target, "favicon");
      return;
    }

  });

  document.addEventListener("keydown", function (event) {

    if (event.key !== "Enter" && event.key !== " ") {
      return;
    }

    const card = event.target.closest("[data-pengaturan-card]");

    if (!card) {
      return;
    }

    event.preventDefault();
    bukaPengaturanDetail(card.dataset.pengaturanCard);

  });


  /* =========================
     LOAD AKADEMIK
  ========================= */

  function loadAcademicSettings() {

    /*
     * Caller loadPage() pada index.html memanggil
     * fungsi ini saat halaman Pengaturan dibuka.
     * Identitas sekolah dimuat melalui jalur yang
     * sama tanpa mengubah index.html.
     */
    loadSchoolIdentity();

    loadSystemSettings();

    google.script.run

      .withSuccessHandler(function (data) {

        const tahun =

          document.getElementById(
            "previewTahunAjaran"
          );

        const semester =

          document.getElementById(
            "previewSemester"
          );

        const libur =

          document.getElementById(
            "previewHariLibur"
          );

        if (tahun) {

          tahun.innerText =
            data.tahunAjaran;

        }

        if (semester) {

          semester.innerText =
            data.semester;

        }

        if (libur) {

          libur.innerText =
            data.hariLibur;

        }

        if (pengaturanDetailType === "akademik" && !document.getElementById("editTahunAjaran")) {
          perbaruiDetailAkademik();
        }

      })

      .getAcademicSettings(
        localStorage.getItem(
          "wongmit_session"
        )
      );

  }


  /* =========================
     CHECKBOX HARI LIBUR
  ========================= */

  function buatCheckboxHariLibur(selected) {

    const hari = [

      "Senin",
      "Selasa",
      "Rabu",
      "Kamis",
      "Jumat",
      "Sabtu",
      "Ahad"

    ];

    const dipilih =

      selected
        .split(",")

        .map(function (h) {

          return h.trim();

        });

    return hari.map(function (h) {

      return `

      <div class="form-check">

        <input

          class="form-check-input"

          type="checkbox"

          value="${h}"

          ${dipilih.includes(h) ? "checked" : ""}>

        <label class="form-check-label">

          ${h}

        </label>

      </div>

    `;

    }).join("");

  }


  /* =========================
     MODE EDIT AKADEMIK
  ========================= */

  function aktifkanEditAkademik() {

    const tahun =

      document.getElementById(
        "previewTahunAjaran"
      ).innerText;

    const semester =

      document.getElementById(
        "previewSemester"
      ).innerText;

    const libur =

      document.getElementById(
        "previewHariLibur"
      ).innerText;

    const container =

      document.getElementById(
        "pengaturanDetailContent"
      );

    container.className =
      "pengaturan-detail-content pengaturan-edit";

    container.innerHTML = `

    <div class="mb-2">

      <strong>

        Tahun Ajaran

      </strong>

      <input

        id="editTahunAjaran"

        class="form-control mt-1"

        value="${tahun}">

    </div>

    <div class="mb-2">

      <strong>

        Semester

      </strong>

      <select

        id="editSemester"

        class="form-select mt-1">

        <option>

          Ganjil

        </option>

        <option>

          Genap

        </option>

      </select>

    </div>

    <div class="mt-3">

      <strong class="d-block mb-2">

        Hari Libur

      </strong>

      <div
        id="editHariLibur">

        ${buatCheckboxHariLibur(libur)}

      </div>

    </div>

  `;

    document.getElementById(

      "editSemester"

    ).value = semester;

    tampilkanButtonEdit();

  }


  /* =========================
     SIMPAN AKADEMIK
  ========================= */

  function simpanAkademik() {

    const btn =

      document.getElementById(
        "btnSimpanAkademik"
      );

    const tahun =

      document.getElementById(
        "editTahunAjaran"
      ).value.trim();

    const semester =

      document.getElementById(
        "editSemester"
      ).value;

    const hari = [];

    document

      .querySelectorAll(
        "#editHariLibur input:checked"
      )

      .forEach(function (cb) {

        hari.push(cb.value);

      });

    if (!tahun) {

      showToast(
        "Tahun Ajaran wajib diisi",
        "warning"
      );

      return;

    }

    if (hari.length === 0) {

      showToast(
        "Pilih minimal satu Hari Libur",
        "warning"
      );

      return;

    }

    showConfirmModal(

      "Simpan Pengaturan",

      "Yakin ingin menyimpan perubahan Pengaturan Akademik?",

      function () {

        setButtonLoading(

          btn,

          "Menyimpan..."

        );

        google.script.run

          .withSuccessHandler(function () {

            resetButtonLoading(btn);

            showToast(
              "Pengaturan Akademik berhasil disimpan"
            );

            batalEditAkademik();

            loadAcademicSettings();

          })

          .withFailureHandler(function () {

            resetButtonLoading(btn);

            showToast(
              "Gagal menyimpan",
              "error"
            );

          })

          .saveAcademicSettings(

            localStorage.getItem(
              "wongmit_session"
            ),

            {

              tahunAjaran: tahun,

              semester: semester,

              hariLibur: hari.join(",")

            }

          );

      }

    );

  }


  /* =========================
     BUTTON EDIT
  ========================= */

  function tampilkanButtonEdit() {

    document.getElementById(

      "pengaturanDetailActions"

    ).innerHTML = `

    <button

      id="btnSimpanAkademik"

      class="btn btn-success"

      data-pengaturan-action="save-akademik">

      <i class="fa-solid fa-floppy-disk"></i>

      Simpan

    </button>

    <button

      class="btn btn-secondary btn-sm"

      data-pengaturan-action="cancel-akademik">

      Batal

    </button>

  `;

  }


  /* =========================
     BATAL EDIT
  ========================= */

  function batalEditAkademik() {

    bukaPengaturanDetail("akademik");

  }


  /* =========================
     DETAIL SEKOLAH
  ========================= */

  function tampilkanDetailSekolah() {

    const content =
      document.getElementById("pengaturanDetailContent");
    const actions =
      document.getElementById("pengaturanDetailActions");

    content.className = "pengaturan-detail-content";
    content.innerHTML = `
      <div class="pengaturan-detail-list">
        <div style="display:flex; gap:16px; margin-bottom:10px;">
          <div style="text-align:center;">
            <img id="previewLogoSekolah" alt="Logo Sekolah" style="display:none; width:64px; height:64px; object-fit:contain; border:1px solid #e3e6f0; border-radius:8px; background:#fff; padding:4px;">
            <div style="font-size:11px; color:#6c757d;">Logo Sekolah</div>
          </div>
        </div>
        <div><strong>Nama Sekolah</strong><span id="detailNamaSekolah">-</span></div>
        <div><strong>Kepala Sekolah</strong><span id="detailKepalaSekolah">-</span></div>
        <div><strong>Logo Sekolah (File ID)</strong><span id="detailLogoSekolah">-</span></div>
      </div>
    `;
    actions.innerHTML = `
      <button type="button" class="btn btn-primary" data-pengaturan-action="edit-sekolah">
        <i class="fa-solid fa-pen"></i> Edit
      </button>
    `;
    perbaruiDetailSekolah();

  }

  function perbaruiDetailSekolah() {

    if (!pengaturanSekolahData) {
      return;
    }

    [
      ["detailNamaSekolah", pengaturanSekolahData.namaSekolah],
      ["detailKepalaSekolah", pengaturanSekolahData.kepalaSekolah],
      ["detailLogoSekolah", pengaturanSekolahData.logoSekolah]
    ]
      .forEach(function (field) {
        const detail =
          document.getElementById(field[0]);

        if (detail) {
          detail.innerText = field[1] || "-";
        }
      });

    pasangPreviewAsset(
      "previewLogoSekolah",
      pengaturanSekolahData.logoSekolahUrl
    );

  }

  function tampilkanDetailSistem() {

    const content =
      document.getElementById("pengaturanDetailContent");
    const actions =
      document.getElementById("pengaturanDetailActions");

    content.className = "pengaturan-detail-content";
    content.innerHTML = `
      <div class="pengaturan-detail-list">
        <div style="display:flex; gap:24px; margin-bottom:10px; flex-wrap:wrap;">
          <div style="text-align:center;">
            <img id="detailPreviewLogoAplikasi" alt="Logo Aplikasi" style="display:none; width:64px; height:64px; object-fit:contain; border:1px solid #e3e6f0; border-radius:8px; background:#fff; padding:4px;">
            <div style="font-size:11px; color:#6c757d;">Logo Aplikasi</div>
          </div>
          <div style="text-align:center;">
            <img id="detailPreviewFavicon" alt="Favicon" style="display:none; width:48px; height:48px; object-fit:contain; border:1px solid #e3e6f0; border-radius:8px; background:#fff; padding:4px;">
            <div style="font-size:11px; color:#6c757d;">Favicon</div>
          </div>
        </div>
        <div><strong>Nama Aplikasi</strong><span id="detailNamaAplikasi">-</span></div>
        <div><strong>Tagline Aplikasi</strong><span id="detailTaglineAplikasi">-</span></div>
        <div><strong>Versi Aplikasi</strong><span id="detailVersiAplikasi">-</span></div>
        <div><strong>Logo Aplikasi (File ID)</strong><span id="detailLogoAplikasi">-</span></div>
        <div><strong>Favicon (File ID)</strong><span id="detailFavicon">-</span></div>
        <div><strong>Mode Maintenance</strong><span id="detailModeMaintenance">-</span></div>
      </div>
    `;
    actions.innerHTML = `
      <button type="button" class="btn btn-primary" data-pengaturan-action="edit-sistem">
        <i class="fa-solid fa-pen"></i> Edit
      </button>
    `;
    perbaruiDetailSistem();

  }

  function perbaruiDetailSistem() {

    if (!pengaturanSistemData) {
      return;
    }

    [
      ["detailNamaAplikasi", pengaturanSistemData.namaAplikasi],
      ["detailTaglineAplikasi", pengaturanSistemData.taglineAplikasi],
      ["detailVersiAplikasi", pengaturanSistemData.versiAplikasi],
      ["detailLogoAplikasi", pengaturanSistemData.logoAplikasi],
      ["detailFavicon", pengaturanSistemData.favicon],
      ["detailModeMaintenance", pengaturanSistemData.modeMaintenance ? "Aktif" : "Nonaktif"]
    ]
      .forEach(function (field) {
        const detail =
          document.getElementById(field[0]);

        if (detail) {
          detail.innerText = field[1] || "-";
        }
      });

    /* Preview visual dari field derived
       URL (resolver backend, Sprint 4C).
       Gagal render -> sembunyikan (state
       aman), File ID tetap tampil sebagai
       teks di list detail. */

    pasangPreviewAsset(
      "detailPreviewLogoAplikasi",
      pengaturanSistemData.logoAplikasiUrl
    );

    pasangPreviewAsset(
      "detailPreviewFavicon",
      pengaturanSistemData.faviconUrl
    );

  }

  /* =========================
     PREVIEW ASSET IDENTITY
     Konsumsi field derived URL
     (resolver backend). Gagal
     render -> sembunyikan (state
     aman), File ID tetap tampil
     sebagai teks di list detail.
  ========================= */

  function pasangPreviewAsset(imgId, url) {

    const img =
      document.getElementById(imgId);

    if (!img) {
      return;
    }

    if (url) {

      img.onerror =
        function () {

          img.onerror = null;

          img.style.display = "none";

        };

      img.style.display = "";

      img.src = url;

    } else {

      img.onerror = null;

      img.style.display = "none";

      img.removeAttribute("src");

    }

  }

  /* =========================
     MODE EDIT SEKOLAH
  ========================= */

  function aktifkanEditSekolah() {

    const data =
      pengaturanSekolahData || {};

    const container =
      document.getElementById(
        "pengaturanDetailContent"
      );

    container.className =
      "pengaturan-detail-content pengaturan-edit";

    container.innerHTML = `

    <div class="mb-2">

      <strong>

        Nama Sekolah

      </strong>

      <input

        id="editNamaSekolah"

        class="form-control mt-1"

        value="${data.namaSekolah || ""}">

    </div>

    <div class="mb-2">

      <strong>

        Kepala Sekolah

      </strong>

      <input

        id="editKepalaSekolah"

        class="form-control mt-1"

        value="${data.kepalaSekolah || ""}">

    </div>

    <div class="mb-2">

      <strong>

        Logo Sekolah

      </strong>

      <div class="d-flex align-items-center gap-2 mt-1">

        <img id="editPreviewLogoSekolah" alt="Preview Logo Sekolah" style="display:none; width:48px; height:48px; object-fit:contain; border:1px solid #e3e6f0; border-radius:8px; background:#fff; padding:3px;">

        <div class="d-flex flex-column gap-1">

          <button type="button" id="btnUploadLogoSekolah" class="btn btn-outline-primary btn-sm" data-pengaturan-action="upload-logo-sekolah">

            <i class="fa-solid fa-upload"></i> Upload Gambar

          </button>

          <button type="button" class="btn btn-outline-danger btn-sm" data-pengaturan-action="hapus-logo-sekolah">

            <i class="fa-solid fa-trash"></i> Hapus Gambar

          </button>

        </div>

      </div>

      <input type="file" id="editLogoSekolahFile" accept=".jpg,.jpeg,.png" style="display:none;">

      <div class="form-text" id="editLogoSekolahStatus"></div>

      <input

        id="editLogoSekolah"

        class="form-control mt-1"

        placeholder="File ID Google Drive (otomatis terisi setelah upload)"

        value="${data.logoSekolah || ""}">

      <div class="form-text">

        File ID (informasi teknis) - boleh diisi manual atau dikosongkan.

      </div>

    </div>

  `;

    /* Snapshot logo tersimpan saat
       masuk mode Edit - dasar untuk
       Cancel dan pending state asset. */

    assetAwal = {
      fileId: data.logoSekolah || "",
      url: data.logoSekolahUrl || ""
    };

    assetPendingUpload = null;

    assetPendingDelete = null;

    fileDipilih = null;

    pasangPreviewAsset(
      "editPreviewLogoSekolah",
      assetAwal.url
    );

    setAssetStatus("");

    tampilkanButtonSekolah();

  }

  /* =========================
     SIMPAN SEKOLAH
  ========================= */

  function simpanSekolah() {

    const btn =
      document.getElementById(
        "btnSimpanSekolah"
      );

    const namaSekolah =
      document.getElementById(
        "editNamaSekolah"
      ).value.trim();

    const kepalaSekolah =
      document.getElementById(
        "editKepalaSekolah"
      ).value.trim();

    const logoSekolah =
      document.getElementById(
        "editLogoSekolah"
      ).value.trim();

    if (!namaSekolah) {

      showToast(
        "Nama Sekolah wajib diisi",
        "warning"
      );

      return;

    }

    showConfirmModal(

      "Simpan Pengaturan",

      "Yakin ingin menyimpan perubahan Pengaturan Sekolah?",

      function () {

        setButtonLoading(

          btn,

          "Menyimpan..."

        );

        google.script.run

                 tersimpan diganti file baru.
               - pending deletion: file lama
                 dihapus dari Drive.
               Gagal hapus tidak membatalkan
               konfigurasi yang sudah tersimpan. */

            if (
              assetPendingUpload
              && assetAwal
              && assetAwal.fileId
            ) {

              hapusAssetSekolahSisiClient(
                sessionId,
                assetAwal.fileId
              );

            }

            if (
              assetPendingDelete
              && assetPendingDelete.fileId
            ) {

              hapusAssetSekolahSisiClient(

                assetPendingDelete.fileId
              );

            }

            resetAssetState();

            showToast(

            batalEditSekolah();

            loadSchoolIdentity();

            );

              kepalaSekolah: kepalaSekolah,

  function hapusAssetSekolahSisiClient(
    sessionId,
    fileId,
    sudahRetry
  ) {

    /* Best effort - kegagalan hapus
       file di Drive TIDAK membatalkan
       konfigurasi yang sudah tersimpan. */

    if (!sessionId || !fileId) {
      return;
    }

    google.script.run
      .withFailureHandler(function (error) {

        console.warn(
          "hapusAssetSekolah:",
          error
        );

        /* Konfigurasi baru tetap valid -
           hanya asset lama yang tertinggal
           di Drive. Coba 1x lagi bila belum;
           bila tetap gagal, beri peringatan
           jelas tanpa mengganggu hasil save. */

        if (!sudahRetry) {

          hapusAssetSekolahSisiClient(
            sessionId,
            fileId,
            true
          );

          return;

        }

        showToast(
          "Asset logo lama gagal dihapus dari Drive. Konfigurasi tetap tersimpan dengan aman.",
          "warning"
        );

      })
      .hapusAssetSekolah(
        sessionId,
        fileId
      );

       hapus file baru dari Drive,

       kosong). Logo tersimpan TIDAK
       diubah. */

    if (
      assetPendingUpload
      && assetPendingUpload.fileId
    ) {

      const sessionId =
        localStorage.getItem(
          "wongmit_session"
        );

      hapusAssetSekolahSisiClient(
        sessionId,
        assetPendingUpload.fileId
      );

      const kembaliKeLama =
        assetAwal
        && assetAwal.fileId;

      const inputLogo =
        document.getElementById(

      if (inputLogo) {

          kembaliKeLama
            ? assetAwal.fileId
            : "";

      }

      pasangPreviewAsset(
        "editPreviewLogoSekolah",
        kembaliKeLama
          ? assetAwal.url
          : ""
      );

      fileDipilih = null;

      pulihkanInputFile();

      pulihkanTombolUpload();

      ubahLabelTombolUpload(
        "Upload Gambar",
        "fa-upload"
      );

      setAssetStatus(
        kembaliKeLama

          : "Upload baru dibatalkan."
      );

      showToast(
        "Upload baru dibatalkan"
      );

      return;

    }

    /* ============ KASUS B ============
       Logo tersimpan: tandai pending
       deletion (tidak destruktif).
       File lama hanya dihapus dari
       Drive SETELAH [Simpan] sukses;
       Batal membatalkannya. */

    if (assetAwal && assetAwal.fileId) {

      showConfirmModal(

        "Hapus Logo Sekolah",

          pulihkanTombolUpload();

          ubahLabelTombolUpload(
            "Upload Gambar",
            "fa-upload"
          );

          const inputLogo =
            document.getElementById(
              "editLogoSekolah"
            );

          if (inputLogo) {
            inputLogo.value = "";
          }

          pasangPreviewAsset(
            "editPreviewLogoSekolah",
            ""
          );

          setAssetStatus(
            "Logo ditandai untuk dihapus. Klik \"Simpan\" untuk konfirmasi."
          );

        }

      );

      return;

    }

    showToast(
      "Belum ada Logo Sekolah",
      "warning"

  function pilihFileLogoSekolah() {

    /* Dua fase: klik pertama membuka
       file picker; setelah file dipilih
       (belum diupload), klik tombol yang
       sama berarti KONFIRMASI upload
       ke Drive. */

    if (fileDipilih) {

      prosesUploadLogoSekolah();

      return;

    }

    const input =

        "editLogoSekolahFile"

    if (!input) {

    input.click();

  function tahapFileLogoSekolah(input) {

    const file =
      input.files && input.files[0];

    if (!file) {
      return;
    }

    /* Validasi client (UX saja -
       server tetap memvalidasi
       ulang dengan aturan sama). */

    const ekstensiDiizinkan = ["jpg", "jpeg", "png"];

    const mimeDiizinkan = ["image/jpeg", "image/png"];

    const ekstensi =
      file.name.split(".").pop().toLowerCase();

    if (
      mimeDiizinkan.indexOf(file.type) === -1
      || ekstensiDiizinkan.indexOf(ekstensi) === -1
    ) {

      showToast(
        "Format harus JPG atau PNG",
        "warning"
      );

      input.value = "";

      fileDipilih = null;

      pulihkanTombolUpload();

      return;

    }

    if (file.size > 2 * 1024 * 1024) {

      showToast(
        "Ukuran file maksimal 2 MB",
        "warning"
      );

      input.value = "";

      fileDipilih = null;

      pulihkanTombolUpload();

      return;

    }

    /* Pilih file BUKAN upload -
       simpan pilihan + preview
       lokal, menunggu konfirmasi
       admin via tombol Upload. */

    const reader =
      new FileReader();

    reader.onload = function (event) {

      fileDipilih = {
        file: file,
        previewUrl:
          String(event.target.result || "")
      };

      pasangPreviewAsset(
        "editPreviewLogoSekolah",
        fileDipilih.previewUrl
      );

      setAssetStatus(
        "File siap. Klik \"Upload ke Drive\" untuk mengunggah."
      );

      ubahLabelTombolUpload(
        "Upload ke Drive",
        "fa-cloud-arrow-up"
      );

    };

    reader.onerror = function () {

      fileDipilih = null;

      pulihkanTombolUpload();

      showToast(
        "Gagal membaca file",
        "error"
      );

    };

    reader.readAsDataURL(file);

  }

    ubahLabelTombolUpload(

  function prosesUploadLogoSekolah() {

    /* Upload hanya berjalan bila ada
       file yang sudah dipilih DAN
       dikonfirmasi via tombol Upload.
       Membuka picker saja TIDAK
       membuat file di Drive. */

    if (!fileDipilih) {
      return;
    }

    const file =
      fileDipilih.file;

    const sessionId =
      localStorage.getItem(
        "wongmit_session"
      );

    if (!sessionId) {

      showToast(
        "Sesi tidak ditemukan",
        "error"
      );

      return;

    }

    const btn =
      document.getElementById(
        "btnUploadLogoSekolah"
      );

    if (btn) {

      btn.disabled = true;

      btn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Mengunggah...';

    }

    const reader =
      new FileReader();

    reader.onload = function (event) {

      const dataUrl =
        String(event.target.result || "");

      const base64 =
        dataUrl.indexOf("base64,") === -1
          ? ""
          : dataUrl.substring(
              dataUrl.indexOf("base64,") + 7
            );

      if (!base64) {

        showToast(
          "Gagal membaca file",
          "error"
        );

        pulihkanInputFile();

        pulihkanTombolUpload();

        return;

      }

      google.script.run

        .withSuccessHandler(function (hasil) {

          pulihkanInputFile();

          if (!hasil || !hasil.fileId) {

            showToast(
              "Upload selesai namun hasil tidak lengkap",
              "warning"
            );

            pulihkanTombolUpload();

            return;

          }

          /* File ID otomatis terisi -
             tetap perlu Simpan untuk
             merekam perubahan lain. */

          const inputLogo =
            document.getElementById(
              "editLogoSekolah"
            );

          if (inputLogo) {

            inputLogo.value =
              hasil.fileId;

          }

          pasangPreviewAsset(
            "editPreviewLogoSekolah",
            hasil.url
          );

          /* Upload baru BERHASIL ke Drive,
             namun BUKAN commit. File ID
             ditandai pending - logo lama
             yang tersimpan tidak disentuh
             sampai [Simpan] sukses. */

          assetPendingUpload = {
            fileId: hasil.fileId,
            url: hasil.url || ""
          };

          assetPendingDelete = null;

          fileDipilih = null;

          setAssetStatus(
            "Logo terupload. Klik \"Simpan\" untuk menyimpan."
          );

          pulihkanTombolUpload();

          ubahLabelTombolUpload(
            "Upload Gambar",
            "fa-upload"
          );

          showToast(
            "Logo berhasil diupload"
          );

        })

        .withFailureHandler(function (error) {

          pulihkanInputFile();

          fileDipilih = null;

          pulihkanTombolUpload();

          ubahLabelTombolUpload(
            "Upload Gambar",
            "fa-upload"
          );

          showToast(
            (error && error.message)
              ? error.message
              : "Gagal mengupload logo",
            "error"
          );

        })

        .uploadLogoSekolah(
          sessionId,
          {
            fileName: file.name,
            mimeType: file.type,
            base64: base64
          }
        );

    };

    reader.onerror = function () {

      pulihkanInputFile();

      fileDipilih = null;

      pulihkanTombolUpload();

      ubahLabelTombolUpload(
        "Upload Gambar",
        "fa-upload"
      );

      showToast(
        "Gagal membaca file",
        "error"
      );

    };

    reader.readAsDataURL(file);

  }

      file.name.split(".").pop().toLowerCase();

    if (
      konfig.mime.indexOf(file.type) === -1
      || konfig.ekstensi.indexOf(ekstensi) === -1
    ) {

      showToast(konfig.pesanFormat, "warning");

      input.value = "";

      state.fileDipilih = null;

      pulihkanTombolUploadSistem(slot);

      return;

    }

    if (file.size > 2 * 1024 * 1024) {

      showToast(
        "Ukuran file maksimal 2 MB",
        "warning"
      );

      input.value = "";

      state.fileDipilih = null;

      pulihkanTombolUploadSistem(slot);

      return;

    }

    /* Pilih file BUKAN upload -
       simpan pilihan + preview
       lokal, menunggu konfirmasi
       admin via tombol Upload. */

    const reader =
      new FileReader();

    reader.onload = function (event) {

      state.fileDipilih = {
        file: file,
        previewUrl:
          String(event.target.result || "")
      };

      pasangPreviewAsset(
        konfig.previewId,
        state.fileDipilih.previewUrl
      );

      setStatusAssetSistem(
        slot,
        'File siap. Klik "Upload ke Drive" untuk mengunggah.'
      );

      setLabelTombolUploadSistem(
        slot,
        "Upload ke Drive",
        "fa-cloud-arrow-up"
      );

    };

    reader.onerror = function () {

      state.fileDipilih = null;

      pulihkanTombolUploadSistem(slot);

      showToast(
        "Gagal membaca file",
        "error"
      );

    };

    reader.readAsDataURL(file);

  }


  function prosesUploadAssetSistem(slot) {

    /* Upload hanya berjalan bila ada
       file yang sudah dipilih DAN
       dikonfirmasi via tombol Upload.
       Membuka picker saja TIDAK
       membuat file di Drive. */

    const konfig =
      KONFIG_SLOT_ASSET_SISTEM[slot];

    const state = sistemAsset[slot];

    if (!state.fileDipilih) {
      return;
    }

    const file =
      state.fileDipilih.file;

    const sessionId =
      localStorage.getItem(
        "wongmit_session"
      );

    if (!sessionId) {

      showToast(
        "Sesi tidak ditemukan",
        "error"
      );

      return;

    }

    const btn =
      document.getElementById(
        konfig.tombolUploadId
      );

    if (btn) {

      btn.disabled = true;

      btn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Mengunggah...';

    }

    const reader =
      new FileReader();

    reader.onload = function (event) {

      const dataUrl =
        String(event.target.result || "");

      const base64 =
        dataUrl.indexOf("base64,") === -1
          ? ""
          : dataUrl.substring(
              dataUrl.indexOf("base64,") + 7
            );

      if (!base64) {

        showToast(
          "Gagal membaca file",
          "error"
        );

        pulihkanInputFileSistem(slot);

        state.fileDipilih = null;

        pulihkanTombolUploadSistem(slot);

        return;

      }

      google.script.run

        .withSuccessHandler(function (hasil) {

          pulihkanInputFileSistem(slot);

          if (!hasil || !hasil.fileId) {

            showToast(
              "Upload selesai namun hasil tidak lengkap",
              "warning"
            );

            pulihkanTombolUploadSistem(slot);

            return;

          }

          /* File ID otomatis terisi -
             tetap perlu Simpan untuk
             commit konfigurasi. */

          const inputAsset =
            document.getElementById(
              konfig.inputId
            );

          if (inputAsset) {

            inputAsset.value =
              hasil.fileId;

          }

          pasangPreviewAsset(
            konfig.previewId,
            hasil.url
          );

          /* Upload baru BERHASIL ke Drive,
             namun BUKAN commit. File ID
             ditandai pending - asset lama
             yang tersimpan tidak disentuh
             sampai [Simpan] sukses. */

          state.pendingUpload = {
            fileId: hasil.fileId,
            url: hasil.url || ""
          };

          state.pendingDelete = null;

          state.fileDipilih = null;

          setStatusAssetSistem(
            slot,
            konfig.label + " terupload. Klik \"Simpan\" untuk menyimpan."
          );

          pulihkanTombolUploadSistem(slot);

          showToast(
            konfig.label + " berhasil diupload"
          );

        })

        .withFailureHandler(function (error) {

          pulihkanInputFileSistem(slot);

          state.fileDipilih = null;

          pulihkanTombolUploadSistem(slot);

          showToast(
            (error && error.message)
              ? error.message
              : "Gagal mengupload " + konfig.label.toLowerCase(),
            "error"
          );

        })

        .uploadAssetAplikasi(
          sessionId,
          {
            fileName: file.name,
            mimeType: file.type,
            base64: base64
          },
          konfig.target
        );

    };

    reader.onerror = function () {

      pulihkanInputFileSistem(slot);

      state.fileDipilih = null;

      pulihkanTombolUploadSistem(slot);

      showToast(
        "Gagal membaca file",
        "error"
      );

    };

    reader.readAsDataURL(file);

  }


  function hapusGambarSistem(slot) {

    const konfig =
      KONFIG_SLOT_ASSET_SISTEM[slot];

    const state = sistemAsset[slot];

    /* ============ KASUS A ============
       Upload baru yang belum di-Simpan:
       hapus file baru dari Drive,
       kembalikan ke asset lama (atau
       kosong). Asset tersimpan TIDAK
       diubah. */

    if (
      state.pendingUpload
      && state.pendingUpload.fileId
    ) {

      const sessionId =
        localStorage.getItem(
          "wongmit_session"
        );

      hapusAssetSekolahSisiClient(
        sessionId,
        state.pendingUpload.fileId
      );

      const kembaliKeLama =
        state.awal
        && state.awal.fileId;

      const inputAsset =
        document.getElementById(
          konfig.inputId
        );

      if (inputAsset) {

        inputAsset.value =
          kembaliKeLama
            ? state.awal.fileId
            : "";

      }

      pasangPreviewAsset(
        konfig.previewId,
        kembaliKeLama
          ? state.awal.url
          : ""
      );

      state.pendingUpload = null;

      state.fileDipilih = null;

      pulihkanInputFileSistem(slot);

      pulihkanTombolUploadSistem(slot);

      setStatusAssetSistem(
        slot,
        kembaliKeLama
          ? "Upload baru dibatalkan - " + konfig.label.toLowerCase() + " lama tetap digunakan."
          : "Upload baru dibatalkan."
      );

      showToast(
        "Upload baru dibatalkan"
      );

      return;

    }

    /* ============ KASUS B ============
       Asset tersimpan: tandai pending
       deletion (tidak destruktif).
       File lama hanya dihapus dari
       Drive SETELAH [Simpan] sukses;
       Batal membatalkannya. */

    if (state.awal && state.awal.fileId) {

      showConfirmModal(

        "Hapus " + konfig.label,

        "Yakin ingin menghapus " + konfig.label + "? Perubahan tersimpan setelah Anda menekan Simpan.",

        function () {

          state.pendingDelete = {
            fileId: state.awal.fileId
          };

          state.pendingUpload = null;

          state.fileDipilih = null;

          pulihkanInputFileSistem(slot);

          pulihkanTombolUploadSistem(slot);

          const inputAsset =
            document.getElementById(
              konfig.inputId
            );

          if (inputAsset) {
            inputAsset.value = "";
          }

          pasangPreviewAsset(
            konfig.previewId,
            ""
          );

          setStatusAssetSistem(
            slot,
            konfig.label + " ditandai untuk dihapus. Klik \"Simpan\" untuk konfirmasi."
          );

        }

      );

      return;

    }

    showToast(
      "Belum ada " + konfig.label,
      "warning"
    );

  }


  function batalEditSistem() {

    const sessionId =
      localStorage.getItem(
        "wongmit_session"
      );

    /* File baru yang sudah terupload ke
       Drive tapi belum di-Simpan dihapus
       agar tidak menjadi orphan (pola
       FIX-2). File tersimpan lama TIDAK
       disentuh. */

    ["logo", "favicon"].forEach(function (slot) {

      if (
        sistemAsset[slot].pendingUpload
        && sistemAsset[slot].pendingUpload.fileId
      ) {

        hapusAssetSekolahSisiClient(
          sessionId,
          sistemAsset[slot].pendingUpload.fileId
        );

      }

      resetStateAssetSistemSlot(slot);

    });

    bukaPengaturanDetail("sistem");

  }


  function simpanSistem() {

    const btn =
      document.getElementById(
        "btnSimpanSistem"
      );

    const namaAplikasi =
      document.getElementById(
        "editNamaAplikasi"
      ).value.trim();

    const taglineAplikasi =
      document.getElementById(
        "editTaglineAplikasi"
      ).value.trim();

    const versiAplikasi =
      document.getElementById(
        "editVersiAplikasi"
      ).value.trim();

    const logoAplikasi =
      document.getElementById(
        "editLogoAplikasi"
      ).value.trim();

    const favicon =
      document.getElementById(
        "editFavicon"
      ).value.trim();

    if (!namaAplikasi) {

      showToast(
        "Nama Aplikasi wajib diisi",
        "warning"
      );

      return;

    }

    /* Hanya kirim field yang benar-benar
       berubah - updateSettingValue()
       melewatkan undefined, jadi field
       yang tidak dikirim TIDAK tertimpa
       di Sheet. modeMaintenance sengaja
       TIDAK dikirim (bukan scope 4C,
       nilai Sheet tidak berubah).
       logo_sekolah juga tidak disentuh. */

    const data = {};

    const lama =
      pengaturanSistemData || {};

    if (namaAplikasi !== (lama.namaAplikasi || "")) {
      data.namaAplikasi = namaAplikasi;
    }

    if (taglineAplikasi !== (lama.taglineAplikasi || "")) {
      data.taglineAplikasi = taglineAplikasi;
    }

    if (versiAplikasi !== (lama.versiAplikasi || "")) {
      data.versiAplikasi = versiAplikasi;
    }

    const logoAwalId =
      sistemAsset.logo.awal
        ? sistemAsset.logo.awal.fileId
        : "";

    if (
      logoAplikasi !== logoAwalId
      || sistemAsset.logo.pendingDelete
    ) {
      data.logoAplikasi = logoAplikasi;
    }

    const faviconAwalId =
      sistemAsset.favicon.awal
        ? sistemAsset.favicon.awal.fileId
        : "";

    if (
      favicon !== faviconAwalId
      || sistemAsset.favicon.pendingDelete
    ) {
      data.favicon = favicon;
    }

    showConfirmModal(

      "Simpan Pengaturan Sistem",

      "Yakin ingin menyimpan perubahan Pengaturan Sistem?",

      function () {

        setButtonLoading(

          btn,

          "Menyimpan..."

        );

        google.script.run

          .withSuccessHandler(function () {

            resetButtonLoading(btn);

            const sessionId =
              localStorage.getItem(
                "wongmit_session"
              );

            /* [Simpan] adalah satu-satunya
               COMMIT konfigurasi. Pembersihan
               Drive hanya SETELAH commit
               sukses (best effort, pola
               FIX-2):
               - pending upload: asset lama
                 tersimpan diganti file baru.
               - pending deletion: file lama
                 dihapus dari Drive.
               Gagal hapus tidak membatalkan
               konfigurasi yang sudah tersimpan
               (retry 1x + warning di helper
               hapusAssetSekolahSisiClient). */

            ["logo", "favicon"].forEach(function (slot) {

              const state = sistemAsset[slot];

              if (
                state.pendingUpload
                && state.awal
                && state.awal.fileId
              ) {

                hapusAssetSekolahSisiClient(
                  sessionId,
                  state.awal.fileId
                );

              }

              if (
                state.pendingDelete
                && state.pendingDelete.fileId
              ) {

                hapusAssetSekolahSisiClient(
                  sessionId,
                  state.pendingDelete.fileId
                );

              }

              resetStateAssetSistemSlot(slot);

            });

            showToast(
              "Pengaturan Sistem berhasil disimpan"
            );

            bukaPengaturanDetail("sistem");

            loadSystemSettings();

          })

          .withFailureHandler(function () {

            resetButtonLoading(btn);

            showToast(
              "Gagal menyimpan",
              "error"
            );

          })

          .saveSystemSettings(

            localStorage.getItem(
              "wongmit_session"
            ),

            data

          );

      }

    );

  }


  /* =========================
     LOAD SEKOLAH
  ========================= */

  function loadSchoolIdentity() {

    google.script.run

      .withSuccessHandler(function (data) {

        pengaturanSekolahData = data;

        const nama =
          document.getElementById(
            "previewNamaSekolah"
          );

        const kepala =
          document.getElementById(
            "previewKepalaSekolah"
          );

        if (nama) {

          nama.innerText =
            data.namaSekolah || "-";

        }

        if (kepala) {

          kepala.innerText =
            data.kepalaSekolah || "-";

        }

        if (pengaturanDetailType === "sekolah" && !document.getElementById("editNamaSekolah")) {
          perbaruiDetailSekolah();
        }

      })

      .getSchoolIdentity(
        localStorage.getItem(
          "wongmit_session"
        )
      );

  }

  function loadSystemSettings() {

    google.script.run

      .withSuccessHandler(function (data) {

        pengaturanSistemData = data;

        const nama =
          document.getElementById(
            "previewNamaAplikasi"
          );

        const versi =
          document.getElementById(
            "previewVersiAplikasi"
          );

        if (nama) {

          nama.innerText =
            data.namaAplikasi || "-";

        }

        if (versi) {

          versi.innerText =
            data.versiAplikasi || "-";

        }

        const tagline =
          document.getElementById(
            "previewTaglineAplikasi"
          );

        if (tagline) {

          tagline.innerText =
            data.taglineAplikasi || "-";

        }

        const maintenance =
          document.getElementById(
            "previewModeMaintenance"
          );

        if (maintenance) {

          maintenance.innerText =
            data.modeMaintenance ? "Aktif" : "Nonaktif";

        }

        if (pengaturanDetailType === "sistem") {
          perbaruiDetailSistem();
        }

      })

      .getSystemSettings(
        localStorage.getItem(
          "wongmit_session"
        )
      );

  }

</script>
