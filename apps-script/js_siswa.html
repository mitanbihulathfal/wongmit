<script>

    /* =========================
            DATA SISWA
    ========================= */

    /* === STATE SISWA === */

    let allStudents = [];
    let currentSortColumn = null;
    let currentSortDirection = "asc";

    /* === SISWA TABLE HELPERS === */

    function updateSortIcons() {

        const icons = document.querySelectorAll(".sort-icon");

        icons.forEach(function (icon) {

            const column = Number(icon.dataset.column);

            icon.textContent = getSortIcon(column);

        });

    }

    function formatTanggal(value) {

        if (!value) return "";

        const tgl = new Date(value);

        if (isNaN(tgl)) return value;

        return tgl.toLocaleDateString("id-ID", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });

    }

    function isiFilterKelas(data) {

        const select =
            document.getElementById('filterKelas');

        if (!select) return;

        const kelasUnik = [];

        data.slice(1).forEach(function (row) {

            const kelas = row[6];

            if (
                kelas &&
                !kelasUnik.includes(kelas)
            ) {
                kelasUnik.push(kelas);
            }

        });

        kelasUnik.sort();

        select.innerHTML =
            '<option value="">Semua Kelas</option>';

        kelasUnik.forEach(function (kelas) {

            select.innerHTML += `
      <option value="${kelas}">
        ${kelas}
      </option>
    `;

        });

    }

    function loadStudents() {

        google.script.run

            .withSuccessHandler(function (data) {

                data = JSON.parse(data);

                const header = data.shift();

                data.sort(function (a, b) {

                    const kelas = String(a[6]).localeCompare(
                        String(b[6]),
                        'id',
                        {
                            numeric: true,
                            sensitivity: 'base'
                        }
                    );

                    if (kelas !== 0) {
                        return kelas;
                    }

                    return String(a[2]).localeCompare(
                        String(b[2]),
                        'id',
                        {
                            sensitivity: 'base'
                        }
                    );

                });

                allStudents = data;

                isiFilterKelas([header, ...allStudents]);

                filterSiswa();

                const roleSiswa =
                    localStorage.getItem("wongmit_role") || "";

                const grupTambah =
                    document.getElementById("grupTambahSiswa");

                if (
                    grupTambah &&
                    !roleSiswa.includes("Admin") &&
                    !roleSiswa.includes("KepalaSekolah")
                ) {

                    grupTambah.classList.add("d-none");

                }

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(
                    "Gagal mengambil data siswa",
                    "error"
                );

            })

            .getStudents();

    }

    /* === START APP ==== */

    function showTambahSiswa() {

        modeForm = "tambah";

        const modalTitle =
            document.querySelector(
                "#modalSiswa .modal-title"
            );

        if (modalTitle) {

            modalTitle.textContent =
                "Tambah Siswa";

        }

        document.getElementById(
            "idSiswa"
        ).value = "";

        document.getElementById(
            "nisn"
        ).value = "";

        document.getElementById(
            "namaSiswa"
        ).value = "";

        document.getElementById(
            "jk"
        ).value = "L";

        document.getElementById(
            "tempatLahir"
        ).value = "";

        document.getElementById(
            "tanggalLahir"
        ).value = "";

        document.getElementById(
            "kelas"
        ).value = "";

        document.getElementById(
            "status"
        ).value = "Aktif";

        const modal =
            new bootstrap.Modal(
                document.getElementById(
                    "modalSiswa"
                )
            );

        modal.show();

    }


    function editSiswa(id) {

        google.script.run

            .withSuccessHandler(function (data) {

                if (!data) {

                    showToast(
                        "Data siswa tidak ditemukan",
                        "warning"
                    );

                    return;

                }

                try {

                    data =
                        typeof data === "string"
                            ? JSON.parse(data)
                            : data;

                } catch (error) {

                    console.error(
                        "Gagal membaca data siswa:",
                        error
                    );

                    showToast(
                        "Format data siswa tidak valid",
                        "error"
                    );

                    return;

                }

                modeForm = "edit";

                /* =========================
                    JUDUL MODAL
                ========================= */

                const modalTitle =
                    document.querySelector(
                        "#modalSiswa .modal-title"
                    );

                if (modalTitle) {

                    modalTitle.textContent =
                        "Edit Siswa";

                }

                /* === DATA SISWA FROM SPREADSHEET === */

                document.getElementById(
                    "idSiswa"
                ).value =
                    data.id ?? "";

                document.getElementById(
                    "nisn"
                ).value =
                    data.nisn ?? "";

                document.getElementById(
                    "namaSiswa"
                ).value =
                    data.nama ?? "";

                document.getElementById(
                    "jk"
                ).value =
                    data.jk ?? "L";

                document.getElementById(
                    "tempatLahir"
                ).value =
                    data.tempatLahir ?? "";

                /* =========================
                    TANGGAL LAHIR
                    INPUT TYPE DATE HARUS
                    YYYY-MM-DD
                ========================= */

                let tanggalLahir = "";

                if (data.tanggalLahir) {

                    const nilai =
                        String(
                            data.tanggalLahir
                        ).trim();

                    /*
                    * Jika sudah YYYY-MM-DD,
                    * gunakan langsung.
                    */
                    if (
                        /^\d{4}-\d{2}-\d{2}$/.test(
                            nilai
                        )
                    ) {

                        tanggalLahir = nilai;

                    }

                    /*
                    * Jika berbentuk ISO Date:
                    * 2020-01-15T00:00:00.000Z
                    */
                    else {

                        const match =
                            nilai.match(
                                /^(\d{4}-\d{2}-\d{2})/
                            );

                        if (match) {

                            tanggalLahir =
                                match[1];

                        }

                        /*
                            * Fallback untuk format
                            * tanggal lain yang masih
                            * dapat dibaca browser.
                            */
                        else {

                            const parsedDate =
                                new Date(nilai);

                            if (
                                !isNaN(
                                    parsedDate.getTime()
                                )
                            ) {

                                const tahun =
                                    parsedDate
                                        .getFullYear()
                                        .toString()
                                        .padStart(4, "0");

                                const bulan =
                                    String(
                                        parsedDate.getMonth() + 1
                                    ).padStart(2, "0");

                                const hari =
                                    String(
                                        parsedDate.getDate()
                                    ).padStart(2, "0");

                                tanggalLahir =
                                    tahun +
                                    "-" +
                                    bulan +
                                    "-" +
                                    hari;

                            }

                        }

                    }

                }

                document.getElementById(
                    "tanggalLahir"
                ).value =
                    tanggalLahir;

                document.getElementById(
                    "kelas"
                ).value =
                    data.kelas ?? "";

                document.getElementById(
                    "status"
                ).value =
                    data.status ?? "Aktif";

                /* =========================
                    TAMPILKAN MODAL
                ========================= */

                bootstrap.Modal
                    .getOrCreateInstance(
                        document.getElementById(
                            "modalSiswa"
                        )
                    )
                    .show();

            })

            .withFailureHandler(function (error) {

                console.error(
                    "Gagal mengambil data siswa:",
                    error
                );

                showToast(
                    "Gagal mengambil data siswa",
                    "error"
                );

            })

            .getStudentById(id);

    }


    function simpanSiswa() {

        if (
            !lockButton(
                "simpanSiswa"
            )
        ) {

            return;

        }

        const btn =
            document.getElementById(
                "btnSimpanSiswa"
            );

        startButtonLoading(
            btn
        );

        const data = {

            id:
                document.getElementById(
                    "idSiswa"
                ).value.trim(),

            nisn:
                document.getElementById(
                    "nisn"
                ).value.trim(),

            nama:
                document.getElementById(
                    "namaSiswa"
                ).value.trim(),

            jk:
                document.getElementById(
                    "jk"
                ).value,

            tempatLahir:
                document.getElementById(
                    "tempatLahir"
                ).value.trim(),

            tanggalLahir:
                document.getElementById(
                    "tanggalLahir"
                ).value,

            kelas:
                document.getElementById(
                    "kelas"
                ).value.trim(),

            status:
                document.getElementById(
                    "status"
                ).value

        };

        /* =========================
            VALIDASI DASAR
        ========================= */

        if (!data.id) {

            unlockButton(
                "simpanSiswa"
            );

            stopButtonLoading(
                btn
            );

            showToast(
                "ID siswa wajib diisi",
                "warning"
            );

            return;

        }

        if (!data.nisn) {

            unlockButton(
                "simpanSiswa"
            );

            stopButtonLoading(
                btn
            );

            showToast(
                "NISN wajib diisi",
                "warning"
            );

            return;

        }

        if (!data.nama) {

            unlockButton(
                "simpanSiswa"
            );

            stopButtonLoading(
                btn
            );

            showToast(
                "Nama siswa wajib diisi",
                "warning"
            );

            return;

        }

        /* =========================
            MODE EDIT
        ========================= */

        if (
            modeForm === "edit"
        ) {

            google.script.run

                .withSuccessHandler(function (result) {

                    if (result === false) {

                        unlockButton(
                            "simpanSiswa"
                        );

                        stopButtonLoading(
                            btn
                        );

                        showToast(
                            "Data siswa tidak ditemukan",
                            "warning"
                        );

                        return;

                    }

                    unlockButton(
                        "simpanSiswa"
                    );

                    successButtonLoading(
                        btn
                    );

                    showToast(
                        "Data siswa berhasil diperbarui"
                    );

                    const modalElement =
                        document.getElementById(
                            "modalSiswa"
                        );

                    const modal =
                        bootstrap.Modal.getInstance(
                            modalElement
                        );

                    if (modal) {

                        modal.hide();

                    }

                    modeForm =
                        "tambah";

                    const modalTitle =
                        document.querySelector(
                            "#modalSiswa .modal-title"
                        );

                    if (modalTitle) {

                        modalTitle.textContent =
                            "Tambah Siswa";

                    }

                    loadStudents();

                    setTimeout(function () {

                        stopButtonLoading(
                            btn
                        );

                    }, 1000);

                })

                .withFailureHandler(function (error) {

                    unlockButton(
                        "simpanSiswa"
                    );

                    stopButtonLoading(
                        btn
                    );

                    console.error(
                        "Gagal memperbarui data siswa:",
                        error
                    );

                    showToast(
                        error &&
                            error.message
                            ? error.message
                            : "Gagal memperbarui data siswa",
                        "error"
                    );

                })

                .updateStudent(
                    localStorage.getItem(
                        "wongmit_session"
                    ),
                    data
                );

            return;

        }

        /* =========================
            MODE TAMBAH
        ========================= */

        google.script.run

            .withSuccessHandler(function () {

                unlockButton(
                    "simpanSiswa"
                );

                successButtonLoading(
                    btn
                );

                showToast(
                    "Data siswa berhasil disimpan"
                );

                const modalElement =
                    document.getElementById(
                        "modalSiswa"
                    );

                const modal =
                    bootstrap.Modal.getInstance(
                        modalElement
                    );

                if (modal) {

                    modal.hide();

                }

                loadStudents();

                setTimeout(function () {

                    stopButtonLoading(
                        btn
                    );

                }, 1000);

            })

            .withFailureHandler(function (error) {

                unlockButton(
                    "simpanSiswa"
                );

                stopButtonLoading(
                    btn
                );

                console.error(
                    "Gagal menyimpan data siswa:",
                    error
                );

                showToast(
                    error &&
                        error.message
                        ? error.message
                        : "Gagal menyimpan data siswa",
                    "error"
                );

            })

            .addStudent(
                localStorage.getItem(
                    "wongmit_session"
                ),
                data
            );

    }

    function hapusSiswa(id) {

        showConfirmModal(
            "Hapus Siswa",
            "Apakah Anda yakin ingin menghapus siswa ini?",
            function () {

                google.script.run
                    .withSuccessHandler(function () {

                        showToast(
                            "Data siswa berhasil dihapus"
                        );

                        loadStudents();

                    })
                    .withFailureHandler(function (error) {

                        console.error(error);

                        showToast(
                            "Gagal menghapus data siswa",
                            "error"
                        );

                    })
                    .deleteStudent(
                        localStorage.getItem("wongmit_session"),
                        id
                    );

            }
        );

    }

    function filterSiswa() {

        const keyword =
            document
                .getElementById("searchSiswa")
                .value
                .trim()
                .toLowerCase();

        const kelasFilter =
            document
                .getElementById("filterKelas")
                .value
                .trim()
                .toLowerCase();

        let hasil = allStudents.filter(function (row) {

            const text = [
                row[1],
                row[2]
            ].join(" ").toLowerCase();

            const cocokNama =
                text.includes(keyword);

            const cocokKelas =
                kelasFilter === "" ||
                String(row[6]).toLowerCase() === kelasFilter;

            return cocokNama && cocokKelas;

        });

        if (currentSortColumn !== null) {

            hasil.sort(function (a, b) {

                let nilaiA = a[currentSortColumn] ?? "";
                let nilaiB = b[currentSortColumn] ?? "";

                if (currentSortColumn === 0 || currentSortColumn === 1) {

                    nilaiA = Number(nilaiA);
                    nilaiB = Number(nilaiB);

                    return currentSortDirection === "asc"
                        ? nilaiA - nilaiB
                        : nilaiB - nilaiA;

                }

                return currentSortDirection === "asc"

                    ? String(nilaiA).localeCompare(
                        String(nilaiB),
                        "id",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )

                    : String(nilaiB).localeCompare(
                        String(nilaiA),
                        "id",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    );

            });

        }

        renderStudentsTable(hasil);

    }

    function renderStudentsTable(data) {

        const table = document.getElementById("tableSiswa");

        if (!table) return;

        const roleSiswaTable =
            localStorage.getItem("wongmit_role") || "";

        const bolehEditHapus =

            roleSiswaTable.includes("Admin") ||
            roleSiswaTable.includes("KepalaSekolah");

        let html = "";

        if (data.length === 0) {

            html = `
          <tr>
            <td colspan="9" class="text-center">
              Tidak ada data siswa
            </td>
          </tr>
        `;

        } else {

            data.forEach(function (row) {

                html += `
          <tr>

            <td>${row[0] ?? ""}</td>
            <td>${row[1] ?? ""}</td>
            <td>${row[2] ?? ""}</td>
            <td>${row[4] ?? ""}</td>
            <td>${formatTanggal(row[5])}</td>
            <td>${row[3] ?? ""}</td>
            <td>${row[6] ?? ""}</td>
            <td>${row[7] ?? ""}</td>

            <td>

              ${bolehEditHapus ? `
              <div class="d-flex justify-content-center gap-1">

                <button
                  class="btn btn-warning btn-sm"
                  onclick="editSiswa('${row[0]}')">

                  <i class="fa-solid fa-pen"></i>

                </button>

                <button
                  class="btn btn-danger btn-sm"
                  onclick="hapusSiswa('${row[0]}')">

                  <i class="fa-solid fa-trash"></i>

                </button>

              </div>
              ` : ""}

            </td>

          </tr>
          `;

            });

        }

        table.innerHTML = html;

        updateSortIcons();

    }

    function sortTable(column) {

        if (currentSortColumn === column) {

            currentSortDirection =
                currentSortDirection === 'asc'
                    ? 'desc'
                    : 'asc';

        } else {

            currentSortColumn = column;
            currentSortDirection = 'asc';

        }

        filterSiswa();

    }

    function getSortIcon(column) {

        if (currentSortColumn !== column) {
            return "↕";
        }

        return currentSortDirection === "asc"
            ? "▲"
            : "▼";

    }

    /* === TEMPLATE SISWA - IMPORT MASSAL SISWA === */

    function downloadTemplateSiswa() {

        google.script.run

            .withSuccessHandler(function (result) {

                window.open(

                    result.exportUrl,

                    "_blank"

                );

                google.script.run
                    .cleanupExportSpreadsheet(
                        result.spreadsheetId
                    );

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(

                    "Gagal membuat template",

                    "error"

                );

            })

            .downloadTemplateSiswa();

    }

    /* === IMPORT MASSAL SISWA === */

    function showImportSiswa() {

        fileImportSiswa =

            null;

        document.getElementById(

            "fileImportSiswa"

        ).value = "";

        resetImportModal({

            fileName:

                "namaFileSiswa",

            preview:

                "previewImportSiswa"

        });

        bootstrap.Modal

            .getOrCreateInstance(

                document.getElementById(

                    "modalImportSiswa"

                )

            )

            .show();

        initImportDragDrop({

            dropArea:

                "dropAreaSiswa",

            fileInput:

                "fileImportSiswa",

            fileLabel:

                "namaFileSiswa",

            preview:

                previewImportSiswa,

            setFile: function (file) {

                fileImportSiswa = file;

            }

        });

    }

    /* === PREVIEW IMPORT SISWA === */

    function previewImportSiswa() {

        if (

            !fileImportSiswa

        ) {

            return;

        }

        readExcelFile(

            fileImportSiswa,

            function (workbook, data) {

                renderPreviewSiswa(

                    data

                );

            }

        );

    }

    /* === RENDER PREVIEW SISWA === */

    function renderPreviewSiswa(data) {

        const header =

            data[0] || [];

        const validHeader =

            header.length >= 8 &&

            header[0] === "ID" &&

            header[1] === "NISN" &&

            header[2] === "Nama Siswa" &&

            header[3] === "JK" &&

            header[4] === "Tempat Lahir" &&

            header[5] === "Tanggal Lahir" &&

            header[6] === "Kelas" &&

            header[7] === "Status";

        if (

            !validHeader

        ) {

            document.getElementById(

                "previewImportSiswa"

            ).innerHTML =

                '<div class="alert alert-danger mb-0">' +

                '<i class="fa-solid fa-circle-xmark me-2"></i>' +

                '<strong>Template tidak sesuai.</strong><br>' +

                'Gunakan Template Siswa yang disediakan.' +

                '</div>';

            document.getElementById(

                "btnUploadSiswa"

            ).disabled = true;

            return;

        }

        const totalData =

            data.length - 1;

        let totalValid = 0;

        let totalError = 0;

        /* === HITUNG SELURUH DATA === */

        for (

            let i = 1;

            i < data.length;

            i++

        ) {

            let barisError = false;

            for (

                let j = 0;

                j < data[i].length;

                j++

            ) {

                const value =

                    String(

                        data[i][j] || ""

                    ).trim();

                if (

                    value === ""

                ) {

                    barisError = true;

                }

                if (

                    j === 3 &&

                    !["L", "P"].includes(value)

                ) {

                    barisError = true;

                }

                if (

                    j === 5 &&

                    !normalizeTanggalImportSiswa(value)

                ) {

                    barisError = true;

                }

                if (

                    j === 7 &&

                    !["Aktif", "Lulus", "Mutasi"].includes(value)

                ) {

                    barisError = true;

                }

            }

            if (

                barisError

            ) {

                totalError++;

            }

            else {

                totalValid++;

            }

        }

        /* === PREVIEW (10 BARIS) === */

        let html =

            '<div class="table-responsive">' +

            '<table class="table table-bordered table-sm">' +

            '<tbody>';

        const maxPreview =

            Math.min(

                data.length,

                11

            );

        for (

            let i = 0;

            i < maxPreview;

            i++

        ) {

            html += "<tr>";

            for (

                let j = 0;

                j < data[i].length;

                j++

            ) {

                let value =

                    data[i][j] || "";

                let style = "";

                if (

                    i > 0

                ) {

                    const textValue =

                        String(value).trim();

                    if (

                        textValue === ""

                    ) {

                        style =

                            ' class="table-danger"';

                    }

                    if (

                        j === 3 &&

                        !["L", "P"].includes(

                            textValue

                        )

                    ) {

                        style =

                            ' class="table-danger"';

                    }

                    if (

                        j === 5 &&

                        !normalizeTanggalImportSiswa(value)

                    ) {

                        style =

                            ' class="table-danger"';

                    }

                    if (

                        j === 7 &&

                        !["Aktif", "Lulus", "Mutasi"].includes(

                            textValue

                        )

                    ) {

                        style =

                            ' class="table-danger"';

                    }

                    if (

                        j === 5

                    ) {

                        const tanggal =

                            normalizeTanggalImportSiswa(

                                value

                            );

                        value =

                            tanggal ||

                            String(value);

                    }

                }

                html +=

                    i === 0

                        ?

                        "<th>" +

                        value +

                        "</th>"

                        :

                        "<td" +

                        style +

                        ">" +

                        value +

                        "</td>";

            }

            html += "</tr>";

        }

        html +=

            "</tbody>" +

            "</table>" +

            "</div>";

        html +=

            buildPreviewSummary(

                totalData,

                totalValid,

                totalError

            );

        document.getElementById(

            "btnUploadSiswa"

        ).disabled =

            totalError > 0;

        document.getElementById(

            "previewImportSiswa"

        ).innerHTML =

            html;

    }

    function normalizeTanggalImportSiswa(value) {

        if (value === null || value === undefined) {
            return "";
        }

        const text =
            String(value).trim();

        if (!text) {
            return "";
        }

        /* DD/MM/YYYY */
        const match =
            text.match(
                /^(\d{2})\/(\d{2})\/(\d{4})$/
            );

        if (match) {

            const day = match[1];
            const month = match[2];
            const year = match[3];

            const date =
                new Date(
                    Number(year),
                    Number(month) - 1,
                    Number(day)
                );

            if (
                date.getFullYear() === Number(year) &&
                date.getMonth() === Number(month) - 1 &&
                date.getDate() === Number(day)
            ) {
                return (
                    year +
                    "-" +
                    month +
                    "-" +
                    day
                );
            }

            return "";
        }

        /* YYYY-MM-DD */
        if (
            /^\d{4}-\d{2}-\d{2}$/.test(text)
        ) {
            return text;
        }

        return "";
    }

    let fileImportSiswa =
        null;

    /* === UPLOAD IMPORT SISWA === */

    function uploadImportSiswa() {

        uploadImportEngine({

            file:

                fileImportSiswa,

            button:

                "btnUploadSiswa",

            onRead:

                function (

                    workbook,

                    data,

                    btn

                ) {

                    data.shift();

                    data.forEach(function (row) {

                        row[5] =
                            normalizeTanggalImportSiswa(
                                row[5]
                            );

                    });

                    google.script.run

                        .withSuccessHandler(function (hasil) {

                            stopButtonLoading(

                                btn

                            );

                            bootstrap.Modal

                                .getInstance(

                                    document.getElementById(

                                        "modalImportSiswa"

                                    )

                                )

                                ?.hide();

                            loadStudents();

                            let pesan = "";

                            if (

                                hasil.berhasil > 0

                            ) {

                                pesan +=

                                    "Berhasil : " +

                                    hasil.berhasil +

                                    " data";

                            }

                            if (

                                hasil.gagal > 0

                            ) {

                                if (

                                    pesan !== ""

                                ) {

                                    pesan += "\n";

                                }

                                pesan +=

                                    "Duplikat : " +

                                    hasil.gagal +

                                    " data";

                            }

                            if (

                                hasil.berhasil === 0

                            ) {

                                showToast(

                                    "Seluruh data sudah ada.\n\n" +

                                    pesan,

                                    "warning"

                                );

                            }

                            else {

                                showToast(

                                    "Import selesai.\n\n" +

                                    pesan

                                );

                            }

                        })

                        .withFailureHandler(function (error) {

                            console.error(

                                error

                            );

                            stopButtonLoading(

                                btn

                            );

                            showToast(

                                error.message ||

                                "Import gagal",

                                "error"

                            );

                        })

                        .importSiswa(

                            localStorage.getItem(

                                "wongmit_session"

                            ),

                            data

                        );

                }

        });

    }

    document.addEventListener(

        "change",

        function (event) {

            if (

                event.target.id !==

                "fileImportSiswa"

            ) {

                return;

            }

            if (

                event.target.files.length === 0

            ) {

                return;

            }

            fileImportSiswa =

                event.target.files[0];

            document.getElementById(

                "namaFileSiswa"

            ).innerHTML =

                "<strong>" +

                fileImportSiswa.name +

                "</strong>";

            previewImportSiswa();

        }

    );

    /* === EXPORT SISWA === */

    function showModalDownloadSiswa() {

        const select =
            document.getElementById('kelasDownloadSiswa');

        const kelasUnik = [];

        allStudents.forEach(function (row) {

            const kelas = row[6];

            if (
                kelas &&
                !kelasUnik.includes(kelas)
            ) {
                kelasUnik.push(kelas);
            }

        });

        kelasUnik.sort();

        select.innerHTML =
            '<option value="">Semua Kelas</option>';

        kelasUnik.forEach(function (kelas) {

            select.innerHTML += `
            <option value="${kelas}">
              ${kelas}
            </option>
          `;

        });

        new bootstrap.Modal(
            document.getElementById('modalDownloadSiswa')
        ).show();

    }

    function siapkanDataExportSiswa(kelas) {

        const baris = [];

        allStudents.forEach(function (row) {

            const kelasSiswa = row[6];

            if (
                kelas &&
                kelas !== "" &&
                String(kelasSiswa) !== String(kelas)
            ) {

                return;

            }

            baris.push([

                baris.length + 1,
                row[1],
                row[2],
                row[4],
                formatTanggal(row[5]),
                row[3],
                row[6],
                row[7]

            ]);

        });

        return baris;

    }

    function downloadSiswaExcel() {

        const kelas =
            document.getElementById('kelasDownloadSiswa').value;

        const btn =
            document.getElementById('btnDownloadSiswaExcel');

        setButtonLoading(
            btn,
            "Memproses..."
        );

        try {

            const baris =
                siapkanDataExportSiswa(kelas);

            const kelasText =
                kelas || "Semua Kelas";

            const tanggalExport =
                new Date().toLocaleString(
                    "id-ID",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                ).replace(" pukul ", ", ") + " WIB";

            const namaPengunduh =
                localStorage.getItem("wongmit_nama") || "-";

            google.script.run

                .withSuccessHandler(function (settings) {

                    const tahunAjaran =
                        settings.tahunAjaran || "-";

                    const wsData = [

                        ["DATA SISWA"],
                        ["MIS TANBIHUL ATHFAL"],
                        ["TAHUN AJARAN " + tahunAjaran],
                        [],
                        ["Kelas", "", kelasText, "", "Tanggal Export", tanggalExport, "", ""],
                        ["Jumlah", "", baris.length + " siswa", "", "Didownload oleh", namaPengunduh, "", ""],
                        [],
                        ["No", "NISN", "Nama", "Tempat Lahir", "Tanggal Lahir", "JK", "Kelas", "Status"]

                    ];

                    baris.forEach(function (row) {
                        wsData.push(row);
                    });

                    const ws =
                        XLSX.utils.aoa_to_sheet(wsData);

                    ws['!views'] = [
                        {showGridLines: false}
                    ];

                    ws['!merges'] = [

                        {s: {r: 0, c: 0}, e: {r: 0, c: 7}},
                        {s: {r: 1, c: 0}, e: {r: 1, c: 7}},
                        {s: {r: 2, c: 0}, e: {r: 2, c: 7}},
                        {s: {r: 4, c: 0}, e: {r: 4, c: 1}},
                        {s: {r: 4, c: 5}, e: {r: 4, c: 7}},
                        {s: {r: 5, c: 0}, e: {r: 5, c: 1}},
                        {s: {r: 5, c: 5}, e: {r: 5, c: 7}}

                    ];

                    ws['!cols'] = [

                        {wch: 4},   // No
                        {wch: 13},  // NISN
                        {wch: 43},  // Nama
                        {wch: 15},  // Tempat Lahir
                        {wch: 18},  // Tanggal Lahir
                        {wch: 6},   // JK
                        {wch: 10},  // Kelas
                        {wch: 10}   // Status

                    ];

                    for (let r = 0; r <= 2; r++) {

                        const addr =
                            XLSX.utils.encode_cell({r: r, c: 0});

                        if (ws[addr]) {

                            ws[addr].s = {

                                font: {
                                    name: "Cambria",
                                    bold: true,
                                    sz: (r === 0) ? 14 : (r === 1 ? 14 : 12)
                                },

                                alignment: {
                                    horizontal: "center",
                                    vertical: "center"
                                }

                            };

                        }

                    }

                    const labelCells = ["A5", "A6", "E5", "E6"];

                    labelCells.forEach(function (addr) {

                        if (ws[addr]) {

                            ws[addr].s = {
                                font: {
                                    name: "Cambria",
                                    bold: true,
                                    sz: 11
                                }
                            };

                        }

                    });

                    const valueCells = ["C5", "C6", "F5", "F6"];

                    valueCells.forEach(function (addr) {

                        if (ws[addr]) {

                            ws[addr].s = {
                                font: {
                                    name: "Cambria",
                                    sz: 11
                                }
                            };

                        }

                    });

                    const headerRowIdx = 7;

                    for (let c = 0; c < 8; c++) {

                        const addr =
                            XLSX.utils.encode_cell({r: headerRowIdx, c: c});

                        if (ws[addr]) {

                            ws[addr].s = {

                                font: {
                                    name: "Cambria",
                                    bold: true,
                                    color: {rgb: "FFFFFF"},
                                    sz: 12
                                },

                                fill: {
                                    fgColor: {rgb: "4A90D9"}
                                }

                            };

                        }

                    }

                    for (let i = 0; i < baris.length; i++) {

                        const warna =
                            (i % 2 === 0) ? "FFFFFF" : "F2F6FC";

                        for (let c = 0; c < 8; c++) {

                            const addr =
                                XLSX.utils.encode_cell({r: headerRowIdx + 1 + i, c: c});

                            if (ws[addr]) {

                                ws[addr].s = {
                                    font: {
                                        name: "Cambria",
                                        sz: 12
                                    },

                                    fill: {
                                        fgColor: {rgb: warna}
                                    },

                                    border: {
                                        top: {
                                            style: "thin",
                                            color: {rgb: "B7B7B7"}
                                        },
                                        bottom: {
                                            style: "thin",
                                            color: {rgb: "B7B7B7"}
                                        },
                                        left: {
                                            style: "thin",
                                            color: {rgb: "B7B7B7"}
                                        },
                                        right: {
                                            style: "thin",
                                            color: {rgb: "B7B7B7"}
                                        }
                                    }
                                };

                            }

                        }

                    }

                    const wb =
                        XLSX.utils.book_new();

                    XLSX.utils.book_append_sheet(
                        wb,
                        ws,
                        "Data Siswa"
                    );

                    XLSX.writeFile(
                        wb,
                        "Data_Siswa_" + (kelas || "SemuaKelas") + ".xlsx"
                    );

                    resetButtonLoading(btn);

                    bootstrap.Modal.getInstance(
                        document.getElementById('modalDownloadSiswa')
                    ).hide();

                })

                .withFailureHandler(function (error) {

                    console.error(error);

                    resetButtonLoading(btn);

                    showToast(
                        "Gagal mengambil pengaturan tahun ajaran",
                        "error"
                    );

                })

                .getAcademicSettings(
                    localStorage.getItem(
                        "wongmit_session"
                    )
                );

        } catch (error) {

            console.error(error);

            resetButtonLoading(btn);

            showToast(
                "Gagal membuat file Excel",
                "error"
            );

        }

    }

    function downloadSiswaPdf() {

        const kelas =
            document.getElementById('kelasDownloadSiswa').value;

        const btn =
            document.getElementById('btnDownloadSiswaPdf');

        setButtonLoading(
            btn,
            "Memproses..."
        );

        try {

            const baris =
                siapkanDataExportSiswa(kelas);

            const kelasText =
                kelas || "Semua Kelas";

            const tanggalExport =
                new Date().toLocaleString(
                    "id-ID",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                ).replace(" pukul ", ", ") + " WIB";

            const namaPengunduh =
                localStorage.getItem("wongmit_nama") || "-";

            google.script.run

                .withSuccessHandler(function (settings) {

                    const tahunAjaran =
                        settings.tahunAjaran || "-";

                    const {jsPDF} = window.jspdf;

                    const doc =
                        new jsPDF(
                            "p",
                            "mm",
                            "a4"
                        );

                    const pageWidth =
                        doc.internal.pageSize.getWidth();

                    doc.setFont(
                        "helvetica",
                        "bold"
                    );

                    doc.setFontSize(16);

                    doc.text(
                        "DATA SISWA",
                        pageWidth / 2,
                        15,
                        {align: "center"}
                    );

                    doc.setFontSize(12);

                    doc.text(
                        "MIS TANBIHUL ATHFAL",
                        pageWidth / 2,
                        22,
                        {align: "center"}
                    );

                    doc.text(
                        "TAHUN AJARAN " + tahunAjaran,
                        pageWidth / 2,
                        28,
                        {align: "center"}
                    );

                    doc.setFont(
                        "helvetica",
                        "normal"
                    );

                    doc.setFontSize(10);

                    doc.setFont(
                        "helvetica",
                        "bold"
                    );

                    doc.text("Kelas", 14, 38);
                    doc.text("Jumlah", 14, 44);

                    doc.setFont(
                        "helvetica",
                        "normal"
                    );

                    doc.text(": " + kelasText, 30, 38);
                    doc.text(": " + baris.length + " siswa", 30, 44);

                    doc.setFont(
                        "helvetica",
                        "bold"
                    );

                    doc.text("Tanggal Export", 110, 38);
                    doc.text("Didownload oleh", 110, 44);

                    doc.setFont(
                        "helvetica",
                        "normal"
                    );

                    doc.text(": " + tanggalExport, 145, 38);
                    doc.text(": " + namaPengunduh, 145, 44);

                    doc.autoTable({

                        startY: 50,

                        head: [[
                            "No", "NISN", "Nama", "Tempat Lahir",
                            "Tanggal Lahir", "JK", "Kelas", "Status"
                        ]],

                        body: baris,

                        theme: "grid",

                        headStyles: {
                            fillColor: [74, 144, 217],
                            textColor: [255, 255, 255],
                            fontStyle: "bold"
                        },

                        alternateRowStyles: {
                            fillColor: [242, 246, 252]
                        },

                        columnStyles: {
                            0: {cellWidth: 10},
                            1: {cellWidth: 25},
                            2: {cellWidth: 45},
                            3: {cellWidth: 30},
                            4: {cellWidth: 25},
                            5: {cellWidth: 12},
                            6: {cellWidth: 18},
                            7: {cellWidth: 20}
                        },

                        styles: {
                            fontSize: 9,
                            lineColor: [0, 0, 0],
                            lineWidth: 0.1
                        }

                    });

                    doc.save(
                        "Data_Siswa_" + (kelas || "SemuaKelas") + ".pdf"
                    );

                    resetButtonLoading(btn);

                    bootstrap.Modal.getInstance(
                        document.getElementById('modalDownloadSiswa')
                    ).hide();

                })

                .withFailureHandler(function (error) {

                    console.error(error);

                    resetButtonLoading(btn);

                    showToast(
                        "Gagal mengambil pengaturan tahun ajaran",
                        "error"
                    );

                })

                .getAcademicSettings(
                    localStorage.getItem(
                        "wongmit_session"
                    )
                );

        } catch (error) {

            console.error(error);

            resetButtonLoading(btn);

            showToast(
                "Gagal membuat file PDF",
                "error"
            );

        }

    }

</script>
