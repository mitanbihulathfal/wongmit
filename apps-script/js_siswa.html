<script>

    function loadStudents() {

        google.script.run

            .withSuccessHandler(function (data) {

                data = JSON.parse(data);

                const header = data.shift();

                data.sort(function (a, b) {

                    const kelas = String(a[6]).localeCompare(
                        String(b[6]),
                        'id',
                        {
                            numeric: true,
                            sensitivity: 'base'
                        }
                    );

                    if (kelas !== 0) {
                        return kelas;
                    }

                    return String(a[2]).localeCompare(
                        String(b[2]),
                        'id',
                        {
                            sensitivity: 'base'
                        }
                    );

                });

                allStudents = data;

                isiFilterKelas([header, ...allStudents]);

                filterSiswa();

                const roleSiswa =
                    localStorage.getItem("wongmit_role") || "";

                const grupTambah =
                    document.getElementById("grupTambahSiswa");

                if (
                    grupTambah &&
                    !roleSiswa.includes("Admin") &&
                    !roleSiswa.includes("KepalaSekolah")
                ) {

                    grupTambah.classList.add("d-none");

                }

            })

            .withFailureHandler(function (error) {

                console.error(error);

                showToast(
                    "Gagal mengambil data siswa",
                    "error"
                );

            })

            .getStudents();

    }

    /* =========================
        START APP
    ========================= */

    function showTambahSiswa() {

        modeForm = "tambah";

        const modalTitle =
            document.querySelector(
                "#modalSiswa .modal-title"
            );

        if (modalTitle) {

            modalTitle.textContent =
                "Tambah Siswa";

        }

        document.getElementById(
            "idSiswa"
        ).value = "";

        document.getElementById(
            "nisn"
        ).value = "";

        document.getElementById(
            "namaSiswa"
        ).value = "";

        document.getElementById(
            "jk"
        ).value = "L";

        document.getElementById(
            "tempatLahir"
        ).value = "";

        document.getElementById(
            "tanggalLahir"
        ).value = "";

        document.getElementById(
            "kelas"
        ).value = "";

        document.getElementById(
            "status"
        ).value = "Aktif";

        const modal =
            new bootstrap.Modal(
                document.getElementById(
                    "modalSiswa"
                )
            );

        modal.show();

    }


    function editSiswa(id) {

        google.script.run

            .withSuccessHandler(function (data) {

                if (!data) {

                    showToast(
                        "Data siswa tidak ditemukan",
                        "warning"
                    );

                    return;

                }

                try {

                    data =
                        typeof data === "string"
                            ? JSON.parse(data)
                            : data;

                } catch (error) {

                    console.error(
                        "Gagal membaca data siswa:",
                        error
                    );

                    showToast(
                        "Format data siswa tidak valid",
                        "error"
                    );

                    return;

                }

                modeForm = "edit";

                /* =========================
                    JUDUL MODAL
                ========================= */

                const modalTitle =
                    document.querySelector(
                        "#modalSiswa .modal-title"
                    );

                if (modalTitle) {

                    modalTitle.textContent =
                        "Edit Siswa";

                }

                /* =========================
                    DATA SISWA
                ========================= */

                document.getElementById(
                    "idSiswa"
                ).value =
                    data.id ?? "";

                document.getElementById(
                    "nisn"
                ).value =
                    data.nisn ?? "";

                document.getElementById(
                    "namaSiswa"
                ).value =
                    data.nama ?? "";

                document.getElementById(
                    "jk"
                ).value =
                    data.jk ?? "L";

                document.getElementById(
                    "tempatLahir"
                ).value =
                    data.tempatLahir ?? "";

                /* =========================
                    TANGGAL LAHIR
                    INPUT TYPE DATE HARUS
                    YYYY-MM-DD
                ========================= */

                let tanggalLahir = "";

                if (data.tanggalLahir) {

                    const nilai =
                        String(
                            data.tanggalLahir
                        ).trim();

                    /*
                    * Jika sudah YYYY-MM-DD,
                    * gunakan langsung.
                    */
                    if (
                        /^\d{4}-\d{2}-\d{2}$/.test(
                            nilai
                        )
                    ) {

                        tanggalLahir = nilai;

                    }

                    /*
                    * Jika berbentuk ISO Date:
                    * 2020-01-15T00:00:00.000Z
                    */
                    else {

                        const match =
                            nilai.match(
                                /^(\d{4}-\d{2}-\d{2})/
                            );

                        if (match) {

                            tanggalLahir =
                                match[1];

                        }

                        /*
                            * Fallback untuk format
                            * tanggal lain yang masih
                            * dapat dibaca browser.
                            */
                        else {

                            const parsedDate =
                                new Date(nilai);

                            if (
                                !isNaN(
                                    parsedDate.getTime()
                                )
                            ) {

                                const tahun =
                                    parsedDate
                                        .getFullYear()
                                        .toString()
                                        .padStart(4, "0");

                                const bulan =
                                    String(
                                        parsedDate.getMonth() + 1
                                    ).padStart(2, "0");

                                const hari =
                                    String(
                                        parsedDate.getDate()
                                    ).padStart(2, "0");

                                tanggalLahir =
                                    tahun +
                                    "-" +
                                    bulan +
                                    "-" +
                                    hari;

                            }

                        }

                    }

                }

                document.getElementById(
                    "tanggalLahir"
                ).value =
                    tanggalLahir;

                document.getElementById(
                    "kelas"
                ).value =
                    data.kelas ?? "";

                document.getElementById(
                    "status"
                ).value =
                    data.status ?? "Aktif";

                /* =========================
                    TAMPILKAN MODAL
                ========================= */

                bootstrap.Modal
                    .getOrCreateInstance(
                        document.getElementById(
                            "modalSiswa"
                        )
                    )
                    .show();

            })

            .withFailureHandler(function (error) {

                console.error(
                    "Gagal mengambil data siswa:",
                    error
                );

                showToast(
                    "Gagal mengambil data siswa",
                    "error"
                );

            })

            .getStudentById(id);

    }


    function simpanSiswa() {

        if (
            !lockButton(
                "simpanSiswa"
            )
        ) {

            return;

        }

        const btn =
            document.getElementById(
                "btnSimpanSiswa"
            );

        startButtonLoading(
            btn
        );

        const data = {

            id:
                document.getElementById(
                    "idSiswa"
                ).value.trim(),

            nisn:
                document.getElementById(
                    "nisn"
                ).value.trim(),

            nama:
                document.getElementById(
                    "namaSiswa"
                ).value.trim(),

            jk:
                document.getElementById(
                    "jk"
                ).value,

            tempatLahir:
                document.getElementById(
                    "tempatLahir"
                ).value.trim(),

            tanggalLahir:
                document.getElementById(
                    "tanggalLahir"
                ).value,

            kelas:
                document.getElementById(
                    "kelas"
                ).value.trim(),

            status:
                document.getElementById(
                    "status"
                ).value

        };

        /* =========================
            VALIDASI DASAR
        ========================= */

        if (!data.id) {

            unlockButton(
                "simpanSiswa"
            );

            stopButtonLoading(
                btn
            );

            showToast(
                "ID siswa wajib diisi",
                "warning"
            );

            return;

        }

        if (!data.nisn) {

            unlockButton(
                "simpanSiswa"
            );

            stopButtonLoading(
                btn
            );

            showToast(
                "NISN wajib diisi",
                "warning"
            );

            return;

        }

        if (!data.nama) {

            unlockButton(
                "simpanSiswa"
            );

            stopButtonLoading(
                btn
            );

            showToast(
                "Nama siswa wajib diisi",
                "warning"
            );

            return;

        }

        /* =========================
            MODE EDIT
        ========================= */

        if (
            modeForm === "edit"
        ) {

            google.script.run

                .withSuccessHandler(function (result) {

                    if (result === false) {

                        unlockButton(
                            "simpanSiswa"
                        );

                        stopButtonLoading(
                            btn
                        );

                        showToast(
                            "Data siswa tidak ditemukan",
                            "warning"
                        );

                        return;

                    }

                    unlockButton(
                        "simpanSiswa"
                    );

                    successButtonLoading(
                        btn
                    );

                    showToast(
                        "Data siswa berhasil diperbarui"
                    );

                    const modalElement =
                        document.getElementById(
                            "modalSiswa"
                        );

                    const modal =
                        bootstrap.Modal.getInstance(
                            modalElement
                        );

                    if (modal) {

                        modal.hide();

                    }

                    modeForm =
                        "tambah";

                    const modalTitle =
                        document.querySelector(
                            "#modalSiswa .modal-title"
                        );

                    if (modalTitle) {

                        modalTitle.textContent =
                            "Tambah Siswa";

                    }

                    loadStudents();

                    setTimeout(function () {

                        stopButtonLoading(
                            btn
                        );

                    }, 1000);

                })

                .withFailureHandler(function (error) {

                    unlockButton(
                        "simpanSiswa"
                    );

                    stopButtonLoading(
                        btn
                    );

                    console.error(
                        "Gagal memperbarui data siswa:",
                        error
                    );

                    showToast(
                        error &&
                            error.message
                            ? error.message
                            : "Gagal memperbarui data siswa",
                        "error"
                    );

                })

                .updateStudent(
                    localStorage.getItem(
                        "wongmit_session"
                    ),
                    data
                );

            return;

        }

        /* =========================
            MODE TAMBAH
        ========================= */

        google.script.run

            .withSuccessHandler(function () {

                unlockButton(
                    "simpanSiswa"
                );

                successButtonLoading(
                    btn
                );

                showToast(
                    "Data siswa berhasil disimpan"
                );

                const modalElement =
                    document.getElementById(
                        "modalSiswa"
                    );

                const modal =
                    bootstrap.Modal.getInstance(
                        modalElement
                    );

                if (modal) {

                    modal.hide();

                }

                loadStudents();

                setTimeout(function () {

                    stopButtonLoading(
                        btn
                    );

                }, 1000);

            })

            .withFailureHandler(function (error) {

                unlockButton(
                    "simpanSiswa"
                );

                stopButtonLoading(
                    btn
                );

                console.error(
                    "Gagal menyimpan data siswa:",
                    error
                );

                showToast(
                    error &&
                        error.message
                        ? error.message
                        : "Gagal menyimpan data siswa",
                    "error"
                );

            })

            .addStudent(
                localStorage.getItem(
                    "wongmit_session"
                ),
                data
            );

    }

    function hapusSiswa(id) {

        showConfirmModal(
            "Hapus Siswa",
            "Apakah Anda yakin ingin menghapus siswa ini?",
            function () {

                google.script.run
                    .withSuccessHandler(function () {

                        showToast(
                            "Data siswa berhasil dihapus"
                        );

                        loadStudents();

                    })
                    .withFailureHandler(function (error) {

                        console.error(error);

                        showToast(
                            "Gagal menghapus data siswa",
                            "error"
                        );

                    })
                    .deleteStudent(
                        localStorage.getItem("wongmit_session"),
                        id
                    );

            }
        );

    }

    function filterSiswa() {

        const keyword =
            document
                .getElementById("searchSiswa")
                .value
                .trim()
                .toLowerCase();

        const kelasFilter =
            document
                .getElementById("filterKelas")
                .value
                .trim()
                .toLowerCase();

        let hasil = allStudents.filter(function (row) {

            const text = [
                row[1],
                row[2]
            ].join(" ").toLowerCase();

            const cocokNama =
                text.includes(keyword);

            const cocokKelas =
                kelasFilter === "" ||
                String(row[6]).toLowerCase() === kelasFilter;

            return cocokNama && cocokKelas;

        });

        if (currentSortColumn !== null) {

            hasil.sort(function (a, b) {

                let nilaiA = a[currentSortColumn] ?? "";
                let nilaiB = b[currentSortColumn] ?? "";

                if (currentSortColumn === 0 || currentSortColumn === 1) {

                    nilaiA = Number(nilaiA);
                    nilaiB = Number(nilaiB);

                    return currentSortDirection === "asc"
                        ? nilaiA - nilaiB
                        : nilaiB - nilaiA;

                }

                return currentSortDirection === "asc"

                    ? String(nilaiA).localeCompare(
                        String(nilaiB),
                        "id",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )

                    : String(nilaiB).localeCompare(
                        String(nilaiA),
                        "id",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    );

            });

        }

        renderStudentsTable(hasil);

    }

    function sortTable(column) {

        if (currentSortColumn === column) {

            currentSortDirection =
                currentSortDirection === 'asc'
                    ? 'desc'
                    : 'asc';

        } else {

            currentSortColumn = column;
            currentSortDirection = 'asc';

        }

        filterSiswa();

    }

    function getSortIcon(column) {

        if (currentSortColumn !== column) {
            return "↕";
        }

        return currentSortDirection === "asc"
            ? "▲"
            : "▼";

    }

</script>
