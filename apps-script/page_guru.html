<div class="topbar">

  <div class="d-flex justify-content-between align-items-center">

    <div>

      <h3 class="fw-bold mb-1">
        Data Guru
      </h3>

      <div class="text-muted">
        Kelola data guru dan pengguna sistem
      </div>

    </div>

    <button
      class="btn btn-primary"
      onclick="showTambahGuru()">

      <i class="fa-solid fa-plus"></i>
      Tambah Guru

    </button>

  </div>

</div>

<div class="card card-summary p-4">

  <div class="row mb-3">

    <div class="col-md-4">

      <input
        type="text"
        class="form-control"
        id="searchGuru"
        placeholder="Cari Nama Guru..."
        onkeyup="filterGuru()">

    </div>

  </div>

  <div class="table-responsive">

    <table class="table table-striped table-hover">

      <thead>

        <tr>
          <th>ID</th>
          <th>Nama Guru</th>
          <th>Username</th>
          <th>Role</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>

      </thead>

      <tbody id="tableGuru">

        <tr>
          <td colspan="6" class="text-center">
            Memuat data...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<!-- MODAL TAMBAH GURU -->

<div class="modal fade" id="modalGuru" tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Tambah Guru
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>

      </div>

      <input
        type="hidden"
        id="idGuru">

      <div class="modal-body">

        <div class="mb-3">

          <label>Nama Guru</label>

          <input
            type="text"
            class="form-control"
            id="namaGuru">

        </div>

        <div class="mb-3">

          <label>Username</label>

          <input
            type="text"
            class="form-control"
            id="usernameGuru">

        </div>

        <div class="mb-3">

          <label>Password</label>

          <input
            type="text"
            class="form-control"
            id="passwordGuru">

        </div>

        <div class="mb-3">

          <label class="fw-bold">
            Peran
          </label>

          <div class="form-check">

            <input
              class="form-check-input"
              type="checkbox"
              id="roleAdmin">

            <label class="form-check-label">
              Admin
            </label>

          </div>

          <div class="form-check">

            <input
              class="form-check-input"
              type="checkbox"
              id="roleKepsek">

            <label class="form-check-label">
              Kepala Sekolah
            </label>

          </div>

          <div class="form-check">

            <input
              class="form-check-input"
              type="checkbox"
              id="roleWali">

            <label class="form-check-label">
              Wali Kelas
            </label>

          </div>

          <div class="form-check">

            <input
              class="form-check-input"
              type="checkbox"
              id="roleMapel">

            <label class="form-check-label">
              Guru Mapel
            </label>

          </div>

        </div>

        <div class="mb-3">

          <label>Status</label>

          <select
            class="form-select"
            id="statusGuru">

            <option value="Aktif">
              Aktif
            </option>

            <option value="Nonaktif">
              Nonaktif
            </option>

            <option value="Pensiun">
              Pensiun
            </option>

            <option value="Mutasi">
              Mutasi
            </option>

          </select>

        </div>

      </div>

      <div class="modal-footer">

        <button
          class="btn btn-secondary"
          data-bs-dismiss="modal">

          Batal

        </button>

        <button
          id="btnSimpanGuru"
          class="btn btn-success"
          onclick="simpanGuru()">

          Simpan

        </button>

      </div>

    </div>

  </div>

</div>
