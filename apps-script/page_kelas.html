<div class="topbar">

  <div class="d-flex justify-content-between align-items-center">

    <div>

      <h3 class="fw-bold mb-1">
        Data Kelas
      </h3>

      <div class="text-muted">
        Kelola data kelas aktif
      </div>

    </div>

    <button
      class="btn btn-primary"
      onclick="showTambahKelas()">

      <i class="fa-solid fa-plus"></i>
      Tambah Kelas

    </button>

  </div>

</div>

<div class="card card-summary p-4">

  <div class="row mb-3">

    <div class="col-md-4">

      <input
        type="text"
        class="form-control"
        id="searchKelas"
        placeholder="Cari kelas..."
        onkeyup="filterKelas()">

    </div>

  </div>

  <div class="table-responsive">

    <table class="table table-striped table-hover">

      <thead>

        <tr>
          <th>ID</th>
          <th>Nama Kelas</th>
          <th>Wali Kelas</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>

      </thead>

      <tbody id="tableKelas">

        <tr>
          <td colspan="5" class="text-center">
            Memuat data...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<!-- MODAL KELAS -->

<div
  class="modal fade"
  id="modalKelas"
  tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Tambah Kelas
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>

      </div>

      <div class="modal-body">

        <div class="mb-3">

          <label>ID Kelas</label>

          <input
            type="text"
            class="form-control"
            id="idKelas">

        </div>

        <div class="mb-3">

          <label>Nama Kelas</label>

          <input
            type="text"
            class="form-control"
            id="namaKelas">

        </div>

        <div class="mb-3">

          <label>Wali Kelas</label>

          <select
            class="form-select"
            id="waliKelas">

            <option value="">
              Memuat data guru...
            </option>

          </select>

        </div>

        <div class="mb-3">

          <label>Status</label>

          <select
            class="form-select"
            id="statusKelas">

            <option value="Aktif">
              Aktif
            </option>

            <option value="Nonaktif">
              Nonaktif
            </option>

          </select>

        </div>

      </div>

      <div class="modal-footer">

        <button
          class="btn btn-secondary"
          data-bs-dismiss="modal">

          Batal

        </button>

        <button
          id="btnSimpanKelas"
          class="btn btn-success"
          onclick="simpanKelas()">

          Simpan

        </button>

      </div>

    </div>

  </div>

</div>
