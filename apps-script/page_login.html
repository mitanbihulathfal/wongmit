<div class="container">

  <div
    class="row justify-content-center align-items-center"
    style="min-height:100vh;">

    <div class="col-md-4">

      <div class="card shadow border-0">

        <div class="card-body p-4">

          <div class="text-center mb-4">

            <img
              src="https://iili.io/CU1QcrJ.png.png"
              width="90">

            <h3 class="mt-3 fw-bold">
              WONG MIT
            </h3>

            <div class="text-muted">

              Website Online Guru

            </div>

          </div>

          <div class="mb-3">

            <label>Username</label>

            <input
              type="text"
              class="form-control"
              id="loginUsername"
              onclick="showLoginHistory()"
              onfocus="showLoginHistory()"
              onblur="hideLoginHistory()"
              onkeypress="if(event.key==='Enter')loginUser()">

          </div>

          <div
            id="loginHistory"
            class="list-group mt-1"
            style="
              display:none;
              max-height:180px;
              overflow-y:auto;
              font-size:14px;
            ">
          </div>

          <div class="mb-3">

            <label>Password</label>

            <div class="input-group">

              <input
                type="password"
                class="form-control"
                id="loginPassword"
                onkeypress="if(event.key==='Enter')loginUser()">

              <button
                class="btn btn-outline-secondary"
                type="button"
                onclick="toggleLoginPassword()">

                <i
                  id="loginPasswordIcon"
                  class="fa-solid fa-eye">
                </i>

              </button>

            </div>

          </div>
          
          <button
            id="btnLogin"
            class="btn btn-primary w-100"
            onclick="loginUser()">

            LOGIN

          </button>

        </div>

      </div>

    </div>

  </div>

</div>
