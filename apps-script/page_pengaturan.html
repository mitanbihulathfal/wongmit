<div class="pengaturan-page">

  <!-- HEADER -->

  <div class="pengaturan-header">

    <div class="pengaturan-header-icon">

      <i class="fa-solid fa-gear"></i>

    </div>

    <div>

      <h3 class="fw-bold mb-1">
        Pengaturan
      </h3>

      <div class="text-muted">
        Kelola konfigurasi WONG MIT
      </div>

    </div>

  </div>


  <!-- INFO -->

  <div class="pengaturan-info">

    <i class="fa-solid fa-sliders"></i>

    <span>
      4 Menu Pengaturan
    </span>

  </div>


  <!-- MENU -->

  <div class="row g-3 mt-1">


    <!-- AKADEMIK -->

    <div class="col-12 col-md-6">

      <div
        class="pengaturan-card"
        onclick="bukaPengaturanAkademik()">

        <div
          class="pengaturan-icon
                 pengaturan-icon-akademik">

          <i class="fa-solid fa-book-open"></i>

        </div>

        <div class="pengaturan-card-content">

          <h5>

            Akademik

          </h5>

          <div
            id="academicContainer"
            class="pengaturan-preview">

            <div>

              <strong>

                Tahun Ajaran

              </strong>

              <span
                id="previewTahunAjaran">

                -

              </span>

            </div>

            <div>

              <strong>

                Semester

              </strong>

              <span
                id="previewSemester">

                -

              </span>

            </div>

            <div>

              <strong>

                Hari Libur

              </strong>

              <span
                id="previewHariLibur">

                -

              </span>

            </div>

          </div>

          <div
            class="mt-3"
            id="academicButtonArea">

            <button

              class="btn btn-primary btn-sm"

              onclick="
                event.stopPropagation();
                aktifkanEditAkademik();
              ">

              <i class="fa-solid fa-pen"></i>

              Edit

            </button>

          </div>

        </div>


        <div class="pengaturan-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </div>

    </div>


    <!-- SEKOLAH -->

    <div class="col-12 col-md-6">

      <div
        class="pengaturan-card"
        onclick="bukaPengaturanSekolah()">

        <div
          class="pengaturan-icon
                 pengaturan-icon-sekolah">

          <i class="fa-solid fa-school"></i>

        </div>


        <div class="pengaturan-card-content">

          <h5>
            Sekolah
          </h5>

          <p>
            Nama Sekolah, Logo,
            dan Identitas Sekolah
          </p>

        </div>


        <div class="pengaturan-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </div>

    </div>


    <!-- SISTEM -->

    <div class="col-12 col-md-6">

      <div
        class="pengaturan-card"
        onclick="bukaPengaturanSistem()">

        <div
          class="pengaturan-icon
                 pengaturan-icon-sistem">

          <i class="fa-solid fa-database"></i>

        </div>


        <div class="pengaturan-card-content">

          <h5>
            Sistem
          </h5>

          <p>
            Backup, Restore,
            dan Log Aktivitas
          </p>

        </div>


        <div class="pengaturan-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </div>

    </div>


    <!-- TAHUN AJARAN -->

    <div class="col-12 col-md-6">

      <div
        class="pengaturan-card"
        onclick="bukaPengaturanTahunAjaran()">

        <div
          class="pengaturan-icon
                 pengaturan-icon-tahun">

          <i class="fa-solid fa-graduation-cap"></i>

        </div>


        <div class="pengaturan-card-content">

          <h5>
            Tahun Ajaran
          </h5>

          <p>
            Naik Kelas, Kelulusan,
            dan Arsip Data
          </p>

        </div>


        <div class="pengaturan-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </div>

    </div>


  </div>

</div>
