<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wong MIT</title>
  <link id="wrapperFavicon" rel="icon" href="https://iili.io/CU1QcrJ.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbyCulItbgDlH2XJPZMCHtEqOG4zgHYusmpruqE7MjL2oD0heVVbLF3ug15ATVG1033Qow/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
  <script>
    /* Favicon production bridge (MICRO-FIX
       setelah Sprint 4C): menerima faviconUrl
       dari Apps Script iframe via postMessage
       agar favicon tab browser mengikuti
       konfigurasi Card Sistem. Fallback statis
       (iili.io) TIDAK pernah dihapus dan tetap
       dipakai bila tidak ada payload valid.
       Validasi ketat: hanya type persis
       "wongmit-favicon" dan URL https dari
       domain asset Drive yang dihasilkan
       resolveDriveImageUrl() (drive.google.com).
       Payload tidak valid -> diabaikan. */
    (function () {
      "use strict";

      var el = document.getElementById("wrapperFavicon");

      if (!el) { return; }

      window.addEventListener("message", function (event) {

        var data = event.data;
        var url;
        var parsed;

        if (!data || typeof data !== "object") { return; }

        if (data.type !== "wongmit-favicon") { return; }

        url = data.url;

        if (typeof url !== "string" || url.length === 0 || url.length > 2048) {
          return;
        }

        try {

          parsed = new URL(url);

        } catch (e) {

          return;

        }

        /* Hanya izinkan domain asset Drive yang
           digunakan Sprint 4C, jangan URL arbitrer. */
        if (
          parsed.protocol !== "https:"
          || parsed.hostname !== "drive.google.com"
        ) {
          return;
        }

        el.href = parsed.href;

      });
    })();
  </script>
</body>
</html>
